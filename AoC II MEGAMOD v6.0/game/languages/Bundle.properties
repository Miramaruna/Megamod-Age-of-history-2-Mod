opisanieKoalicziiF = Германия может быть окружена врагами, что сделает её агрессивную политику несостоятельной, мы сможем достичь мира в Европе, но для этого нам нужен союзник в виде Польши. Нужно провести встречу трёх государств.
koalicziyaP = Встреча в Лондоне
opisanieKoalicziiP = Руководство Великобритании и Франции хотят, чтобы мы вместе с ними и Чехословакией выступили против Германии, как в военном, так и в политическом плане. Таким образом они хотят остановить агрессию Германии, а в случае войны мы получим своё. Каково будет наше решение?
