opisanieKSkrf = Глядя на наши проблемы внутри страны, Рим решил снарядить экспедиции и высадиться на Карсику и Сардинию. Рим потребоал от нас передать остова под своё владычество или же он вторгнется в остальные наши владения.
titleKSkrf1 = Придётся подчиниться.
titleKSkrf2 = Никто нам не указ!
RIkrf = Расширение в Иберии
opisanieRIkrf = Иберийский полуостров содержит в себе очень много богатств, именно поэтому мы расширяли свои владения в этом регионе. Нашим планам по-расширению мешает Сагунт и мы можем избавить себя от проблем с ним. Однако, Сагунт является союзником Рима, который встанет на защиту Сагунта. Мы можем взять реванш или всё же выждать более удачного момента.
