pytKrahaC = Национальный Кризис
opisaniePytKrahaC = В Чехословакии наблюдается национальный кризис. Немцы и словаки не хотят быть частью нашего государства. В Судетской области проходят забастовки и митинги в поддержку Германии. Стабильность в государстве постепенно падает.
