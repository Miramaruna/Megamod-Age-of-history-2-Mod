titleOVKkai = Да здравствует Южное Касаи!
AFK = Федерация Конго
opisanieAFK = Мы смогли договориться с вождями племён, а также с губернаторами провинций. Переговоры, которые были проведены в Леопольдвиле, определили будущую судьбу страны: Конго становится конфедерацией провинций и племён. У правящей верхушки западных провинций это вызвало недоумение, но зато восточные провинции были удовлетворены и больше не покинут нас. 
titleAFK = Замечательная идея!
FRK = Отделение Провинций
opisanieFRK = Мы отказались влиять на Касаи и Катангу, это позволило им свободно выйти из состава Конго. Теперь же это хотят сделать и другие провинции Конго. Многие вожди племён кооперируются с местными властями и провозглашают независимость своих провинций, надеясь, что мы не будем им мешать. Одной из первых таких провинций стала Восточная Провинция, где в союзе с племенами местная власть образовала новое государство - Чопо, в честь одного из притока реки Конго.
titleFRK1 = Это необратимый процесс.
titleFRK2 = Этим вождём был Я(Играть за Чопо).
opisanieFRK2 = Мы отказались влиять на Касаи и Катангу, это позволило им свободно выйти из состава Конго. Теперь же это хотят сделать и другие провинции Конго. Многие вожди племён кооперируются с местными властями и провозглашают независимость своих провинций, надеясь, что мы не будем им мешать. Новым государством, выделившимся из Конго, стала Экваториальная Провинция. Многих жителей этой провинции, видимо, не устраивало прежнее название, поэтому его решили сменить на Экваториальное Конго.
titleFRK21 = Строго и со вкусом.
titleFRK22 = Этим вождём был Я(Играть за ЭК).
opisanieFRK3 = Правительство Конго загнало себя в ситуацию, в которой сохранение государства практически невозможно. Отделяющиеся провинции перерезали нам пути снабжения в Восточное Конго, что побудило восточные провинции отколоться. Но есть и хорошие новости: западные провинции не собираются идти своим путём, они предпочли остаться верными центральному правительству.
titleFRK31 = Не самые плохие новости.
titleFRK32 = Вовремя отделиться - у власти остаться(Играть за Киву).
titleFRK33 = У нас будет свой центр(Играть за Маниему).
ZARtvk = Теократическая Монархия в ЦАИ
opisanieZARtvk = В недавнем времени Центральноафриканская Империя появилась на карте мира и её император, конечно же, решил следовать зову предков и традициям народа Африки. Он принял нашу веру и стал нашим союзником на долгие десятилетия. Истинность учений конголезских священников рано или поздно пробьёт барьер смуты, которую привезли с собой колонисты.
titleZARtvk = Император Бокасса не перестаёт радовать!
RKteo = Верования в Соседнем Конго
opisanieRKteo = После установления теократического устройства государственности, в соседнем Конго начали зреть религиозные организации, которые переняли нашу культуру и верования, и которые достаточно быстро набирают популярность. Многие обращаются в нашу религию предков, многие готовы просвещать умы и сердца других людей, но для этого им нужно уходить из своих привычных мест обитания, на что требуются деньги, которые можем дать мы. Спонсирование не останется незамеченным, так что отношения с соседями и постоянными членами СБ ООН могут быть испорчены.
titleRKteo1 = Стоит спонсировать их.
titleRKteo2 = Наша религия не требует агрессивного навязывания.
RKteork = Подпольные Секты
opisanieRKteork = Попытка переворота в Конго не осталась незамеченной и отразилась на многих слоях населения по-разному. Высшие чины показали уровень своей верности текущему режиму, некоторые были отправлены в тюрьмы на продолжительные сроки. Есть в нашей стране и самые бедные слои населения, часть из которых стали проповедовать какую-то новую религию, предположительно пришедшую из соседнего Конго, где не так давно произошла смена политического режима, и вместе с этим в Государстве Конго установилась теократия. Религия, которую они исповедуют, основывается на традиционных верованиях Африки. Люди видят выход в этом учении, но вместе с тем они становятся более радикальными к власти. Они очень активные и быстро распространяют своё верование, скоро очень большая часть людей будут находиться под их влиянием. Возможно, нам стоит принять их догмы, чтобы не допустить нового кровопролития.                                                                                                                                 ..
titleRKteork1 = Пусть эти верования станут частью нашей жизни!
titleRKteork2 = Нужно подавить это недоразумение.
RKteork2 = Противостояние Религии и Государственности
opisanieRKteork2 = Новая африканская религия стала слишком популярной. Её апологеты обнаглели о подняли открытое восстание на Севере страны, расколов общество надвое. Мы, разумеется, уже собрали вещи и готовы в случае чего перебежать на противоположную сторону, но для этого придётся принять их вероучение. Это может стать неприятным опытом, но когда мы не не переходили на чужую сторону?
titleRKteork21 = Встать на сторону президента.
titleRKteork22 = Встать на сторону религии.
RKteork3 = Подавления Фанатиков
opisanieRKteork3 = Фанатики на севере были разгромлены, а их лидеры бежали за рубеж. Однако в стране всё ещё остались приверженцы агрессивной религии, которые не хотят покидать Конго, да и не могут этого сделать. Сейчас они очень недовольны тем, что мы подавили их бунт, но со временем их пылкие настроения должны устаканиться.
titleRKteork3 = Это было очень опасно.
RKteork4 = Конго Единое и Неделимое
opisanieRKteork4 =  Благочестивый орден смог завоевать Конго и распространить свою веру на эти территории. Этот день будет отмечаться каждый год и превратится в священный праздник! Наши друзья из соседнего Конго будут очень рады данному событию!
titleRKteork4 = Прекрасно!
RKrk = Республика Конго
opisanieRKkr = Республика Конго, бывшая колония Франции, получила независимость. Президентом страны был избран Фюльбер Юлу, который считается достаточно авторитарным человеком, но достаточно грамотным управленцем. Во внешней политике он избрал путь сближения с Западом, прежде всего с Францией, и уничтожения социалистических идей в Конго, противостояние "красной угрозе". Парламент во многом поддерживает его, да и в колониальном правительстве он был не последним человеком, так что используя его идеи о свободной Африке, которые в значительной части консолидируют народы Африки, мы сможем обеспечить Республике Конго успех на международной арене и добиться экономических преференций от западных стран.
titleRKrk = Авторитаризм - наше всё.
PNrk = Повышение Налогов
opisaniePNrk = Хоть и Республика Конго смогла добиться значительных успехов в развитии экономики, но это всё нивелируется всё повышающимся и повышающимся бюджетным дефицитом, который не даёт нам в должной мере развивать сферы экономики. Выход есть - налоги. Налоги сейчас являются основой нашего бюджета, и чтобы бюджет был полон, нам нужно поднять налоги. Многие жители Конго не обрадуются, услышав эту новость, но что поделать, когда страна нуждается в средствах?
titlePNrk1 = Драть с них три шкуры!
titlePNrk2 = Да нет, мы найдём другой выход.
NVPrk = Недоразумение в Парламенте
opisanieNVPrk = В эту среду в парламенте шло заседание, на котором присутствовал президент Конго. Депутаты спорили на тему западных инвистиций и бюджетных растрат. В один момент один из участников жаркого спора указал на президента и сказал, что президент виновен в неэффективной экономической политике страны и, мол, мы, депутаты, тут совершенно ни при чём. Обомлев от такой наглости, президент вытащил из-за пазухи огнестрельное оружие и пригрозил депутатам: "Если вы не решите текущую проблему, то я лично вас всех здесь перестреляю!" После этого парламент заработал в привычном режиме. Такая выходка обошлась Конго в пару-тройку осуждений ООН, что плохо восприняло население, но оно того стоило, теперь у нас появились лишние средства.
titleNVPrk = Инициатива была в руках президента!
PLP = Посадка Лидеров Профсоюзов
opisaniePLP = Профсоюзы, как известно, являются рассадниками коммунистических идей, что недопустимо в современном Конго. Пускай они скрывают свои истинные намерения, но мы-то знаем, что все они являются агентами СССР в Конго. В тюрьму их!
titlePLP = Посадить их всех!
GPP = Государственный Переворот
opisanieGPP = Посадка деятелей профсоюзов была не самым лучшим нашим решением, ведь теперь под стенами президентского дворца собралась толпа протестующих, которая намерена отправить нас в отставку, а проще говоря - свергнуть. Новое правительство объявило о вставании на рельсы построения коммунизма. Президент Конго смог сбежать из страны, но мы остались в ней и нам, видимо, предстоит встретиться с толпой и объяснить им, что мы играем на их стороне...
titleGPP = Оу, я, таки, за вас?
PGP = Попытка Государственного Переворота
opisaniePGP = Оппозиция, которая ещё осталась недобитой, решилась на государственный переворот путём массовых протестов. Жаль, что у них ничего не вышло. Армия быстро разогнала протестующих, а лидеры оппозиции были пойманы и посажены в тюрьму, где они будут отбывать свои последние годы. Переворот не удался, хотя они были близки к победе.
titlePGP = Посадка оппозиции - очень важное дело.
IRK = Интеграция Конго
opisanieIRK = Наш ближайший сосед - Конголезская Народная Республика, тоже решила идти по пути социализма, что не может не радовать социалистическое движение. Нам предлагают начать интеграцию двух государств для создания одного большого центральноафриканского социалистического государства. Пойдём ли мы на жто и если да, то не приведёт ли это к разрушительным последствиям? Похожие проекты уже были в странах Северной Африки и на Ближнем Востоке, но пока что они не увенчались успехом.
titleIRK1 = Это будет полезно для народов Конго.
titleIRK2 = Отдавать им часть полномочий? Нет уж!
ZAR = Центральноафриканская Республика
opisanieZAR = Центральноафриканская Республика наконец получила долгожданную независимость. Наше государство располагает огромным запасом полезных ископаемых, а также большим количеством агроклиматических ресурсов, но пока что является одним из беднейших государств мира, что мы должны исправить. Президент Давид Дако является родственником прошлого премьер-министра переходного правительства Бартелеми Боганды, который считается отцом-основателем Центральноафриканского государства. Посмотрим, сможет ли он отстроить государство так, как это хотелось бы большему проценту населения страны.
titleZAR = Посмотрим на его работу.
VPZAR = Военный Переворот Бокассы
opisanieVPZAR = В новогоднюю ночь в стране произашел военный переворот, возглавляемый начальником штаба вооружённых сил Жаном Беделем Бокассой. Однако Бокасса не был изначальным лидером заговора, а стал им после того, как нейтрализовал прошлого, который являлся начальником жандармерии. Президент побоялся предпринять хоть какие-то меры, поэтому был очень быстро арестован заговорщиками. Многие уже объявили Бокассу вечным президентом, хотя он таких заявлений не делал, но уже ясно, что он просто так не уйдёт. Бокасса является достаточно эксцентричным человеком, можно только представить, какими выходками он будет удивлять зарубежных послов.
titleVPZAR = Президент оказался нерешительным.
ZARimp = Центральноафриканская Империя
opisanieZARimp = 4 декабря 1976 года на чрезвычайном съезде партии Бокассы было обявлено о принятии имперской конституции ЦАР и создании новой императорской династии - Бокасса. "Республика будет реорганизованна нами в Первую Центральноафриканскую Империю во имя сохранности и во блага Африки!" - вот так народы была объявлено создание империи Бокассы. Разумеется, послы разных стран очень удивились подобному раскладу событий, но нот протеста ни от кого не возникло.
titleZARimp = Правь, Император! Слава тебе!
ZAIteo = Теократическая Африка
opisanieZAIteo = В бывших колониях Бельгии раньше творилось чёрт побери что, но с приходом нового вероучения всё устаканилось. Жаль, что не для нас. Глава это церкви предлагает императору Бокассе принять их веру, которая основывается на старинных верованиях наших предков. Сам император Бокасса множество раз выступал за внедрение традиций в нашу культуру, за "возвращение к земле предков". Это удачная возможностьналадить отношения с Конго, а также распространить своё влияние на другие колеблющиеся страны, что вы думаете об этом?
titleZAIteo1 =  Пора отринуть Христа!
titleZAIteo2 = Христос нам ещё понадобится...
PBsssr = Побег Повара в Посольство
opisaniePBsssr = В июне 1970 года в Москву с официальным визитом приезжал президент Центральноафриканской республики Жан Бедель Бокасса. В поездке ему очень понравилась руская кухня, в результате чего он попросил откомандировать вместе с ним советского повара. И всё бы хорошо, но по прошествии времени повар наткнулся на хранящееся на президентской кухне в холодильнике человеческое мясо, после чего в ужасе бежал в посльство, где и рассказал об этом. Послы были ошелемлены и отправили повара домой. Кто бы знал, что африканский президент употребляет в пищу лидеров оппозиции?                                                                                                                                                                     ....
titlePBsssr = Ужасное зрелище!
SBzar = Свержение Бокассы
opisanieSBzar = В стране сейчас не лучшие времена, ведь императора Бокассу свергли заговорщики, используя поддержку Франции. Говорят, что они были недовольны школьной формой, которую мы обязали приобретать всем школьникам. Вместе со свержением Бокассы начали ходить слухи о его людоедстве. Теперь мы знаем, что оппозицию Бокассы сам Бокасса и съел...
titleSBzar = Кто бы мог подумать!
GPBF = Государственный Пеереворот
opisanieGPBF = Президент Республики Верхняя Вольта Морис Ямеого был свергнут главой национальных вооружённых сил Верхней Вольты Абубакар Ламизана. По его распоряжению президент был арестован, а власть узурпирована, в стране началась военная диктатура. Мировое сообщество не осудило действия Абубакара Ламизана, видимо, у мировых светил есть дела поважнее. Однако вовезло и нам, ведь мы не отправились в тюрьму, в отличие от бывшего президента...
titleGPBF = Как жаль, что мы не сядем вместе с ним.
GPBF2 = Чехарда Диктатур
opisanieGPBF2 = С начла 1980-х годов в стране начинается настоящая чехарда диктатур, диктаторы сменяют друг друга с такой переодичностью, что многие и понять не могут, кто сейчас находится у власти. Пока это будет продолжаться, в стране будет нестабильная ситуация и кризис, который будет действовать на нас во всех сферах государства. Лучше не начинать споры с соседними государствами, если мы хотим остаться суверенным государством.
titleGPBF2 = Тяжёлые времена.
IIKDU = Информационное Событие
opisanieIIKDU = Здравствуй, игрок. Это событие сделано, потому что моя лень не позволяет мне делать события нормально, поэтому ты сейчас и перебрался с Индокитая на французскую колонию. Тебе предлагается игра за другие колонии, объявляющие независимость от Франции и Великобритании. Скоро появится новое событие, в котором ты сможешь выбрать эту колонию. У меня лишь одни вопрос: хочешь ли ты играть за другие колонии, или же ты хочешь оставить всё, как есть? Если откажешься, то событие не появится, если согласишься, то сможешь поиграть за другие колонии.
