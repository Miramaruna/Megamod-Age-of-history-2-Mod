opisanieSHhru = 12 октября 1964 года Брежнев связался с Н. С. Хрущёвым, находившимся на отдыхе в Пицунде, и попросил его приехать на заседание Президиума ЦК КПСС, начавшееся на следующий день. На заседании, проходившем 13—14 октября, Хрущёв был подвергнут критике за многочисленные ошибки, допущенные в работе, создание культа своей личности, грубость по отношению к членам партии и тому подобное. Хрущёв согласился подписать заявление об отставке, и вечером того же дня Пленум ЦК КПСС освободил его от должности Первого секретаря ЦК КПСС и вывел из состава Президиума ЦК «по состоянию здоровья», а также признал нецелесообразным в дальнейшем совмещение постов руководителя партии и правительства. На следующий день Хрущёв был освобождён от должности главы Президиума СССР.                                                                                                                                                                                  ...
titleSHhru = А при Сталине его бы расстреляли...
