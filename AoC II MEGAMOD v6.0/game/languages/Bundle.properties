GAO59 = Генеральная Ассамблея ООН
opisanieGA059sov = К середине века в Африке стали значительно сильны антиколониальные и сепаратистские настроения, сильны и панафриканисты. Колониальные правительства уже готовятся самостоятельно объявлять независимость колоний. Представитель СССР в ГАООН намерен предложить проект освобождения стран Африки от колониализма. Мы собираемся предложить его на Генеральной Ассамблеи ООН 1960-го года в августе-сентябре. Если мы не предложим этот проект, то станет возможным массовое кровопролитие в Африке, которое приведёт к большому количеству жертв.
titleGAO59sov1 = Нужно предложить этот проект.
titleGAO59sov2 = Это может стать выгодным.
opisanieGAO59fra = Представитель СССР в ООН готовит проект освобождения африканских стран от колониализма. У этого процесса есть основания: национализм и сепаратизм в колониях. Многие колониальные правительства комплектуются в основном из местных жителей, знающих специфику местных территорий. Они же и являются основными сподвижниками идеи об отделении колоний от метрополии. Многие люди в нашем правительстве согласны с тем, что колонии уже являются опасным очагом нестабильности для Франции, что от колоний нужно избавиться. Как мы поступим?
