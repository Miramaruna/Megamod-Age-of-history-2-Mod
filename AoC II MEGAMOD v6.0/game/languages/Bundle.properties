sinhai2 = Превращение Китая в полуколонию, утрата им части своего суверенитета, серия проигранных войн, цепь унижений и контрибуций — всё это беспокоило господствующие силы страны, возмущало китайских патриотов и великоханьских шовинистов. Последней каплей стала национализация компании по строительству железных дорог, что ударило по миллионам налогоплательщиков в Чэнду. В городе состоялись мятежи, которые насильно подавлялись. После последних действий вся провинция Сычуань объявила о своей независимости, а в Синьцзине началось вооружённое восстание. Хотя и восстание было подавлено, оно дало начало для революции. Доведенный народ, понимающий, что Маньчжурская династия погубит Китай, поднял восстание с целью свержения монархии.
