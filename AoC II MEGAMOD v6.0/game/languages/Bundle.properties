nachalo = Судетский Кризис Набирает Обороты 
opisanieNachala = Немцы, проживающие в Судетской области, явно хотят присоединиться к нашей великой державе, но Чехословакия думает иначе. Мы ясно дали знать, что если не добьёмся мирного урегулирования данной ситуации, то нам придётся прибегнуть к силе оружия. Возможно, Великобритания сможет разрешить этот вопрос, нам следует пригласить британского премьерминистра для обсуждения этого вопроса.
