byzantfall2 = Турки-мусульмане уничтожили последний существующий православный оплот на Балканах. Можно считать, что мы последний оплот Православного христианства в Европе. Многие Византийские беженцы бегут к нам - в Москву, что-бы не стать жертвами геноцида Турками, при этом принося их технологические знания, деньги и культуру.
