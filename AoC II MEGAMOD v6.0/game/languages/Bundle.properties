RSK = Партизанское Военные Формирования
opisanieRSK1 = Коммунисты Конго не собираются сдаваться просто так. Таким образом, они формируют организованные военные группировки, поддерживаемые Восточным Конго, а также другими коммунистическими странами в регионе. На сей рас они напали на Колвези и захватили его. В недалёком прошлом этот город был крепким оплотом Государства Катанги, теперь же в нём прячутся коммунисты и мы должны выгнать их из города!
opisanieRSK2 = Жадовиль сыскал большую славу в Ирландии за счёт сражения ирландских миротворцев и боевиков Катанги. Ирландцы сражались долго и упорно, но были вынуждены сдаться, когда у них закончились боеприпасы и продовольствие. Интересно, но этот город снова сопротивяется центральному правительсву, но уже в качестве обороняющихся приходятся коммунисты. Они захватили государственные учреждения и охраняют все подходы к городу. Нам нужно избавиться от них.
opisanieRSK3 = Небольшой город Пепа находится в близи озера Танганьика. Близко и граница с Танзанией. Через территорию Танзании и через озеро коммунисты перебрасывают свои формирования, а также осуществляют снабжение своих партизан. Сегодня мы обнаружили крупный лагерь недалеко от Пепы, который нужно немедленно изничтожить.
opisanieRSK4 = Граница Западного и Восточного Конго проходит таким образом, что в одном месте есть узкое горлышко, заблокировав которое можно оставить без снабжения южную часть страны. Так и произашло, партизаны-коммунисты смогли захватить это пространство и удерживать довольно продолжительное время. Если мы ничего не предпримем, то бывшие катангские сепаратисты могут взбунтоваться вновь.
titleRSK = В бой!
VVK = Вывод Войск из Конго
opisanieVVK = Многие говорят, что ввод войск в Конго стал большой ошибкой США, но командование заявляет, что всё не так плохо. Войска направляются домой, они покинут Конго в ближайшее время. Это ли не хорошая новость?
