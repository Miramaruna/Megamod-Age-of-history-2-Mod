alsaceul1 = Эльзасский ультиматум
alsaceul2 = По всей видимости мы готовы. Германскую империю внутри терзают восстания демократов-социалистов. Самый лучший момент, что-бы бескровно вернуть свои земли.
alsaceul3 = Мы унизим их в отместку за Франко-Прусскую!
alsaceul4 = Мы признаем Эльзас-Лотарингию за Германией. (Первая Мировая по событиям не начнётся)
alsaceul5 = Эльзасский ультиматум
alsaceul6 = Французские представители сегодня приехали в Страссбург, требуя удовлетворения Французских претензий на Эльзас-Лотарингию. Они серьёзно полагают, что могут требовать от нас наши коренные земли.
alsaceul7 = Наглости им не занимать!
alsaceul8 = Это единственный выход... (Первая Мировая по событиям не начнётся)
alsaceul9 = Эльзасский ультиматум, отказ
alsaceul10 = Немецкие наглецы выдворили наших дипломатов. Их войска начали стягиваться к границе. Кажется, началось...
alsaceul11 = Неужели это - начало конца?
alsaceul12 = Эльзасский ультиматум, согласие
alsaceul13 = Германские войска и пограничники покинули Эльзас-Лотарингию, но никакого ответа от Германского правительства мы не услышали. Мы можем воспринимать это за молчаливое согласие. Многие Французы начали возвращаться на свою историческую родину...
alsaceul14 = В одиночку противостоим их натиску.
delhich1 = Перенос столицы
delhich2 = С 1757 по 1911 год столицей Британской Индии является Калькутта. Но в то же время Дели служит политическим и финансовым центром нескольких империй Древней и Средневековой Индии, в особенности Империи Великих Моголов. В начале 1900-х годов британской администрации было сделано предложение перенести столицу Индийской империи из Калькутты в Дели. В отличие от Калькутты, расположенной на восточном побережье Индии, Дели находится в Северной Индии, и правительство Британской Индии считало, что управлять страной будет легче из Дели. 
delhich3 = Мы сделаем центр Индии столицей Индии.
delhich4 = Оставим как есть.
deckorfu1 = Декларация Корфу
deckorfu2 = Закончились переговоры Югославского комитета и Сербии. В ходе заключенного соглашения предусматривается объединение Сербии, Черногории и земель Австро-Венгрии в единое Югославское государство.
deckorfu3 = Мы объединим южных славян!
burrebel1 = Бурское восстание
burrebel2 = С вступлением в Первую Мировую войну, многие буры увидели в этом возможность восстановить ранее независимую бурскую Республику. Такие генералы, как Манье Мариц, Христиан де Вет и Кристиан Бейерс вступили на сторону сепаратистов. Они уже захватили некоторые города со складами боеприпасов. Они пользуются поддержкой местного населения и призывают в армию новых солдат. По всей видимости их поддерживает Германия. Такое явно усложнит войну в Юго-Восточной Африке, а на грани стоит факт существования Доминиона.
burrebel3 = Пора показать им их место.
burrebel4 = Мы воплотим идеал свободной и независимой Южной Африки! (Играть за буров)
burrebel5 = Бурская Африка
burrebel6 = Буры помнят те кровавые Бурские войны, в ходе которых мы потеряли свою независимость. Мы простили, но не забыли. Настал час добиться своей независимости.
burrebel7 = В атаку!
chihist1 = Цинская империя в 20 веке
chihist2 = Куча гражданских войн, восстаний и войн с большими колониальными державами, которые просто не оставляют возможности на мирное развитие Китаю. С этим всем нам приходится считаться, а ведь когда-то Китай был истоком цивилизации. Впереди назревает новая война. Мы должны определить курс нашего развития, ведь на кону наших будущих решений стоит судьба Китая.
chihist3 = Всё только хуже...
serbiarun1 = Голгофа
serbiarun2 = После разгрома сербской армии и полной оккупации нашей страны, останки наших войск начали скрытое отступление в Албанию, где, при поддержке наших союзников, мы передислоцировались на остров Корфу. Греческие власти, видимо, не против нахождения здесь нашей армии.
serbiarun3 = Это ещё не конец! 
lonpec8 = Взятие Стамбула
lonpec9 = После ожесточенных боёв войска Балканского союза смогли занять центр Стамбула, после чего наши войска отступили в Малую Азию. С падением столицы, мы подписали себе смертный приговор, ведь теперь наше мнение, если и будет учитываться, то от него будет зависеть то, какой напиток будут подавать на мирной конференции.
lonpec10 = Подайте нам вина...
gerkomrev1 = Коммунистическая революция
gerkomrev2 = Ступор Германии во внешней политике возмутил воинственный Германский народ. Люди выходят на улицы с лозунгами "Долой Монарха", все требуют смещения монархического порядка на замену Социалистическому.
gerkomrev3 = Мы не потерпим социалистов в Германии!
gerkomrev4 = Вильгельм, пора на пенсию! (Играть за Социалистов)
hitlerprolog1 = Пивной путч
hitlerprolog2 = Сегодня в пивном зале Мюнхена собралось три тысячи человек, чтобы послушать речь фон Кара, фон Лоссова и фон Зайсера, но они оказались заперты в одной из комнат нацистами. После того, как оцепенение закончилось, некий незнакомец побежал в середину зала, вскочил на стол, выстрелил в потолок из пистолета и в наступившей тишине прокричал: «Национальная революция началась!». Этим незнакомцем был Адольф Гитлер. Затем он обратился к публике: «Баварское правительство и правительство рейха низложены, образуется временное правительство рейха, казармы рейхсвера и земельной полиции захвачены, рейхсвер и земельная полиция уже выступают под знамёнами со свастикой!». Гитлер с пистолетом в руке стал уговаривать их занять посты в новом правительстве, но безрезультатно. Через некоторое время в пивную прибыл генерал Людендорф, героя Первой мировой войны, который до того ничего не знал о путче, но узнав, сразу же поддержал Гитлера. По приезде Людендорфа Кар, Лоссов и Зайсер объявили, что присоединяются к походу на Берлин. Собравшиеся нацисты под знамёнами со свастикой и военными штандартами колонной направились к центру города на Мариенплац...
hitlerprolog3 = Закройте им дорогу! Нельзя пропустить нацистов!
hitlerprolog4 = Что может случиться?..
invafga1 = Вторжение в Афганистан
invafga2 = После вхождения в войну на стороне Центральных держав мы официально оказались в войне с нашим главным соперником - Великобританией. В ходе так называемой "Большой игры" мы забрали себе Среднюю Азию, а Индию и Афганистан уступили Великобритании. Теперь же нам не нужно соблюдать никакие соглашения, ибо теперь никакая бумага на английском не стоит ни гроша. Мы можем вторгнуться в Афганистан, чтобы через него пройти в Индию - житницу шёлка и чая. Эдакий Индийский поход.
invafga3 = Афганистан - последний оплот Индии, и скоро падёт Кабул, а за ним и Индия!
invafga4 = Это плохая идея.
noyaberrev1 = Ноябрьская революция!
noyabrrev2 = С оккупацией большей части всё большей и большей территорий нашей страны немцы перестали верить в победу. Немцы больше начали ассоциировать себя левыми демократами, которые требовали прекращения войны. На севере страны, в Киле, уже развилось восстание против нашего режима. Части флота отказываются от всех наших приказаний. Похоже, выбора перед нами не остаётся...
noyabrrev3 = Мы сдаём наши полномочия...
noyabrrev4 = Для меня любой социал-демократ – враг империи и отечества!
versalmir1 = Версальский мир
versalmir2 = Ещё во время войны Франция предлагала начать переговоры с нами, если мы откинем Монархию. С падением Монархического режима, благодаря Ноябрьской революции, Антанта стала готова к переговорам с нами. Мы потеряем все свои колонии, снизим численность войск, обязуемся платить огромнейшие контрибуции и демилитаризуем всю нашу западную границу.
versalmir3 = Нам ничего не остается, кроме как согласиться.
germaniasda1 = Германия сдаётся!
germaniasda2 = Успех Мёз-Аргоннского наступления позволил сломить натиск Германской Императорской Армии. Поражение на фронте привело к свержению монархии и позволило начать мирные переговоры с Германией. Германия капитулировала и по условиям мира теряет все свои колонии и выплачивает огромную контрибуцию. Остальные решения будут приниматься в Версале.
germaniasda3 = Война, которая закончит все войны.
leninsw1 = Выезд Ленина
leninsw2 = При содействии Германских властей, Ленин, русский революционер и социалист, отправился на поезде в Германию. По предположению разведки, его намереваются отвезти в Россию, где будет проведена попытка Революции. Сейчас он находится на Швейцарско-германской границе, где ожидает выезда поезда через границу.
leninsw3 = Удачного пути!
leninsw4 = Задержите его, он слишком опасен для всего мира!
carolusrexpmv1 = Новый Каролус Рекс?
carolusrexpmv2 = В начале прошлого века Россия сумела навсегда приструнить шведские амбиции, отобрав у нас Финляндию. Швеция стала относительно нейтральной державой. Но, как и все другие, мы не оставили надежд на возвращение былого могущества Шведского Великодержавия, и мы продолжали наращивать вооружение и подготавливать армию. Имея хорошие отношения с Германией, мы можем рассчитывать на её поддержку в войне, а наши действия могут привести к большому распылению сил России на множество фронтов. Когда-то они отобрали у нас Финляндию и Аландские острова, может, настал час вернуть должок?
carolusrexpmv3 = Бойтесь меня! Вы умрёте от моего меча!
carolusrexpmv4 = Поверьте мне, вам не выиграть эту битву!
norsweu1 = Реставрация Шведско-Норвежской унии?
norsweu2 = После развала унии в 1905 году мы не оставляли надежд на её возрождение, всячески предлагая её новые концепты. Норвежцы решительно отвергали все эти предложения, но с потеплением наших отношений и возрастанием их симпатий к нашему королю они согласились.
norsweu3 = Пусть существует уния вечно!
leninsw5 = Коммунистический переворот
leninsw6 = После задержания Ленина, все революционеры, укрывавшиеся в нашей стране, взяли штурмом тюрьму, где находился Ленин. Сейчас же они направляются к зданию Генеральной Ассамблеи. Похоже, они собираются устроить государственный переворот.
