opisaniePUNkrf3 = Риму очень не понравились наши действия, которые послужили поводом для ещё одной войны между нашими государствами. Видимо, это последняя война сдля Карфагена, так давайте же покажем, на что мы способны!
titlePUNkrf3 = Эта война снанет последней не только для нас, но и для тысяч солдат армии римлян!
VAsiv = Владыка Америки
opisanieVAsiv = Наша власть достигла всех городов нашего континента, больше у нас не осталось ни врагов, ни союзников. Наше государство состоит из многих народов, но лишь один из них смог подчинить другие. Боги дали нам возможность основать империю, а разве мы можем им отказать?
titleVAsiv = Да здравствует новая Империя!
RGgal = Рим в Галлии
