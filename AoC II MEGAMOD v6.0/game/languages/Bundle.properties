liniyaS = "Линия Сталина"
opisanieLiniiS = Наша "западная греда" готова. Мы готовы отразить любой удар западных стран. Латвийские газеты назвали наши оборонительные рубежи "Линией Сталина". Скорее всего это название будет использоваться западной прессой для пропаганды. Мы всегда будем сталкиваться с непониманием...
