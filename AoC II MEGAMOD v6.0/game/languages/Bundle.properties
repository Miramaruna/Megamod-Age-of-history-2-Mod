epilg2 = В ходе Земского собора был избран новый царь, кандидатура которого послужила компромиссом для всех участников собора. Уже неважно кто одобряет победившего кандидата и насколько сильно, главное - вытащить нашу страну из ямы, выбрать для неё самый благоприятный путь...
