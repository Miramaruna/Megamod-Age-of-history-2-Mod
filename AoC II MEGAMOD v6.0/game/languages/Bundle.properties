unipeace11 = Фрицы нас плохо знают, нас Британцев, если прижмут, все глотки грызть начнём!
unipeace12 = Мир с Германией
unipeace13 = Тотальный разгром Британской армии силами Германской имперской армии на Британском острове не оставляет нам выбора, кроме подписания унизительного мира на условиях Германии. Скорее всего они потребуют большую часть наших колоний, хотя уже понятно, что самое ужасное начнётся после мира, а не из-за него.
unipeace14 = Битва за Британию проиграна...
unipeace15 = Мы продолжим сопротивление.
unipeace16 = Мир с Великобританией
unipeace17 = Британская армия была разгромлена нашей могущественной Германской имперской армией. Похоже теперь они согласны на любые наши условия. Мы получим большую часть их колонии по плану Германской Центральной Африки. Такая потеря колоний ознаменует крах Британской колониальной Империи.
unipeace18 = Нужно больше денег, денег, денег, денег...
unipeace19 = Даже мне не набирай.
dominionvb1 = Падение Великобритании
dominionvb2 = Ужасные новости недавно разразили нашу страну! Великобритания была захвачена! Монарх и его королевская семья бежали в Канаду. Ныне официальная Британская власть неспособна защищать свои колонии. 
dominionvb3 = Настал конец Британского империализма. Свобода!
dominionvb4 = Мы, как колония, должны спасти метрополию!
dominionvb5 = Королевская семья бежит в Канаду
dominionvb6 = Великобритания была захвачена. Британское правительство и королевская семья планирует эвакуироваться к нам - в Канаду, в надежде когда нибудь вернуться обратно, на родные острова. Но, так как ныне останки Великобритании не в силах защитить свои колонии, мы можем отказать им.
dominionvb7 = Мы поможем им вернуться домой.
dominionvb8 = Канадская свобода дороже земли предков.
britrev1 = Всеобщая стачка
britrev2 = С нарастающим кризисом предприниматели и владельцы шахт объявили требование правительству. Рабочий день будет увеличен с 7 до 8 часов, а зарплаты будут снижены вдвое. В Правительстве уже считают, что страну настигнут стихийные шествия профсоюзов и прекращения работы. Как мы отреагируем?
britrev3 = Объявить чрезвычайную ситуацию и принять требования.
britrev4 = Принять сторону рабочих. Ничего не предпринимать.
britrev5 = Вставай Ливербасс, ты станешь новым Осовцем! (Играть за рабочих)
britrev6 = На встрече с правительством нам предложили отменить новые условия. Однако нам не предложили гарантий этому.
britrev7 = Мы прекратим забастовки. (Конец игры)
britrev8 = Только революция изменит ситуацию!
britrev12 = Падение Лондона
britrev13 = Рабочие с винтовками достигли королевского дворца, где уже опустели все комнаты, включая парламент. Вся королевская семья и члены парламента уже бежали в Канаду, в надежде ещё когда-нибудь вернуться. У них это не выйдет, ведь рабочий с винтовками лучше десятерых роялистов!
britrev14 = Слава Революции!
britrev16 = Падение Лондона
britrev17 = Рабочие с винтовками достигли королевского дворца. В такие важные для Великобритании минуты всё британское правительство и королевская семья погрузились на конвои и под прикрытием флота отправилось в Канаду. Надеемся, что там нас примут.
britrev18 = Прощай, Британия.
britrev19 = Слабость Британии
britrev20 = Сейчас в Великобритании идёт гражданская война. Мы можем воспользоваться моментом и аннексировать, утерянный ещё 200 лет назад, Гибралтар.
britrev24 = Сейчас в Великобритании идёт гражданская война. Мы можем воспользоваться моментом и распространить свою автономию на Ботсванну.
britrev21 = Распад Великобритании
britrev22 = Канада отказалась принять наше правительство и королевскую семью. Губернаторы наших колоний всё больше отказываются признавать нашу власть. Похоже, это конец для империи.
britrev23 = Смерть.
britrev9 = Всеобщий локаут
britrev10 = Проигнорировав требования предпринимателей и владельцев шахт их поддержание стало просто невыгодным, из-за чего по всей стране прокатилась волна локаутов, а за ней и стихийные шествия профсоюзов. Бастуют уже и предприниматели и рабочие, которым нечем прокормиться. Похоже одними демонстрациями это не закончится...
britrev11 = Слышь, шахтёр, не грусти, ведь приказ есть приказ...
britrev15 = На рассвете вперёд, выходит рота шахтеров, выходит чтобы победить и чтобы не голодать... (Играть за рабочих)
irrev1 = Ирландская война за независимость
irrev2 = Воспользовавшись нашим положением в мире парламент Ирландии принял решении о независимости. Патриотично-настроенные Ирландцы уже начали боевые действия. Однако наши войска по прежнему располагаются в крупных городах. Как мы поступим, Король?
irrev3 = Ирландия - часть Империи. Их идеи - полная чушь.
irrev4 = Признаем Ирландию независимой.
irrev10 = Да здравствует Ирландия! (Играть за Ирландию)
irrev5 = Компромисс с Ирландией?
irrev6 = Ирландцы согласны пойти на компромисс с нами и стать нашим доминионом, также за нами останется протестантское население Северной Ирландии. Как мы поступим?
irrev7 = Пора прекратить кровопролитие.
irrev8 = Продолжим борьбу.
irrev9 = Компромисс с Великобританией
irrev11 = С освобождением Дублина мы думаем, что британцы станут согласны на компромисс с нами. Мы станем доминионом, а за ними останется протестантское население Северной Ирландии.
romcap1 = Бухарестский мир
romcap2 = Еризис на фронте и политический кризис в Российской Империи сводят все наши усилия в прах. Вся Румынская общественность требует от правительства мира. Быть может пора нам сложить оружие? Немцы получат от нас проходы в Карпатских горах и передать им концессию на нефтепромыслы, мы признаем Добруджу за Болгарией, но Центральные Державы не будут против нашего расширения в будущем. Нам ничего не мешает аннулировать этот договор в будущем. 
romcap3 = Если они того потребуют...
romcap4 = В бой! За Кароля!
stockholmfall1 = Падение Стокгольма
stockholmfall2 = Начало компании против России не имело никакого успеха в заснеженных лесах Финляндии. Русское командование обхитрило нас, и, спланировало высадку в Стокгольм - нашу столицу. Теперь нам под дулом пистолета предлагают мир на условии репараций России и сокращения рыболовства на Балтийском море. 
stockholmfall3 = Нам ещё повезло, что они не потребовали Шведской стали.
stockholmfall4 = Мы ещё не дошли до Полтавы, а они смеют мир предлагать?
helsingfors1 = Падение Гельсингфорса
helsingfors2 = Гельсингфорс - город основанный нашим предком-королём Густавом Вазой. Этот день однозначно войдёт в историю, ведь наши шведские войска вновь вошли в город, утерянный ещё столетие назад. Там наши войска в отличие от местных великолепно изъяснялись на шведском и танцевали, за что пользовались популярностью у местных женщин. Вряд ли мы этот город потеряем вновь.
helsingfors3 = На Нотебург!
helsingfors4 = Россия предлагает мир
helsingfors5 = Учитывая бессмысленность северного фронта и наши недавние победы в финляндии Россия предложила нам мир. Россия признает финляндию за нами, однако взамен мы выйдем из Центральных держав. А дальнейшее разбирательство с её жителями останется за нами.
helsingfors6 = Мы согласны.
helsingfors7 = Мы ещё не дошли до Полтавы!
helsingfors8 = Швеция требует нашего подчинения
helsingfors9 = 
helsingfors10 = Финляндия подчиняется
dvajap1 = Тридцать требований
dvajap2 = Воспользовавшись тем, что все Великие Державы сейчас находятся в состоянии войны, а внутриполитическая обстановка в Китае худшая за последние столетия, мы можем предъявить Китаю пять переченей требований: признание германского циндао за нами, продлить срок аренды Рёдзюна и ЮМЖД, смешание наших предприятий в китае с китайскими, запрет Китаю сдавать в аренду земли вдоль китайского побережья и, то что скорее всего осудили бы западные державы, в Китай будут приглашены Японские специалисты, советники и министры. Китай фактически станет нашим вассалом. Но так как Великие державы в состоянии войны, то мы не ожидаем реакции с их стороны.
dvajap3 = У Китая одно будущее - стать нашим сырьевым придатком.
dvajap4 = Не будем тревожить весь мир.
dvajap5 = В такой абсолютно нестабильной обстановке Япония буквально предоставила нам ультиматум: признанить германское циндао за Японией, продлить срок аренды Даляня и ЮМЖД, смешание наших предприятий с японскими, запрет сдавать в аренду земли вдоль китайского побережья и в Китай будут приглашены Японские специалисты, советники и министры. Китай фактически станет Японским вассалом. Если мы откажемся, то это может повлечь войну.
dvajap6 = Сперва узнаем мнение европейцев.
dvajap7 = Мы безоговрочно согласны.
dvajap8 = Эти стервятники ничего от нас не получат.
dvajap9 = Тридцать требований, согласие
dvajap11 = Китай принял все наши требования. Теперь можно считать Китай подвластным нам.
dvajap12 = Японские щупальца дотянутся и до тихого океана!
dvajap13 = Тридцать требований, отказ
dvajap14 = Китай отказался от нашего милосердного предложения и отказался. Впрочем, с их феодальной экономикой мы можем не ожидать боя от них и объявить войну. Однако вряд ли наши союзники после станут нам доверять.
dvajap15 = Ударим по Пекину!
dvajap16 = Оставим Китай в покое.
dvajap17 = Тридцать требований, осуждение со стороны европейцев
dvajap18 = Китайцы раскусили наш план и афишировали наши требования. Европейцы уже выступили с резким осуждением нас, особенно по пятому переченю требований. Мы можем попробовать настоять на всём остальном, кроме пятого требования, или вовсе не менять требования ультиматума.
dvajap19 = Мы сократим до двадцати одного требования.
dvajap20 = Требования неизменны.
dvajap21 = Вообще отступим.
dvajap22 = Двадцать одно требование
dvajap23 = Благодаря афишированию западу требований со стороны Японии они отступились и предложили нам договор без последнего переченя требований.
dvajap24 = Мы согласны.
dvajap25 = Мы не согласны.
dvajap26 = Двадцать одно требование, согласие
dvajap27 = Китай согласился на все требования нового предложения.
dvajap28 = Достаточно.
dvajap29 = Двадцать одно требование, отказ
dvajap30 = Китай отказался от нашего и так уменьшенного переченя требований. 
dvajap31 = Война!
dvajap32 = Отступим.
dvajap33 = Тридцать требований, Япония стоит на своём
dvajap34 = Несмотря на осуждение со стороны европейцев Японии они решили настоять на том ультиматуме, который составлен сейчас.
dvajap35 = Мы согласны...
dvajap36 = Мы не согласны.
dvajap37 = Тридцать требований, согласие
dvajap38 = Китай согласился на все требования ультиматума.
dvajap39 = Достаточно.
dvajap40 = Тридцать требований, отказ
dvajap41 = Китай отказал нам в нашем ультиматуме. 
dvajap42 = Война!
dvajap43 = Отступим.
porbri1 = Великобритания требует задержать немецкие суда
porbri2 = Сегодня мировые державы находятся в состоянии Первой Мировой войны. Великобритания - наш 700-летний союзник, является участницей Антанты и воюет с Германией. Британцы просят нас задержать и конфисковать немецкие суда в наших портах. Такие действия могут повлечь объявление Германии нам войны...
porbri3 = Союз - это союзные обязательства...
porbri4 = Мы не можем это сделать.
kappor1 = Великобритания выходит из войны
kappor2 = В Великую войну мы вступили по инициативе Великобритании, по обязательствам нашего 700-летнего союза. Но теперь, когда в Лондоне машут бумажками о подписании мира, должны ли мы тоже выйти из войны? Германии от нас много не нужно, лишь Кабинда для соединения с морем её новой колонии в Конго.
kappor3 = Мы подпишем мир.
kappor4 = Если вступили, то воевать до конца!
agad1 = Оккупация Феса
agad2 = Недавно французские войска были введены в марокканский город Фес, под предлогом восстановления порядка и защиты граждан. Стало ясно, что Марокко переходит под Францию. Всё наше влияние на Марокко, начиная с Танжерского кризиса, в миг исчезло. Должен ли Кайзеррейх что-то предпринять?
agad3 = Отправьте флот, мы должны указать место Французам!
agad4 = Реквием играет тихо.
agad5 = Восстание в Фесе
agad6 = Недавно вспыхнуло антиколониальное восстание в окрестностях Феса. Недовольные новыми условиями содержания, отряды Аскари разгромили европейские и еврейские кварталы столицы. Своими силами мы не способны его подавить, поэтому мы предпримем попытку обратиться за поддержкой к нашему протектору - Франции.
agad7 = Франция поможет нам!
agad8 = Мы должны поддержать повстанцев! 
agad9 = Восстание в Фесе
agad10 = После восстания недовольных отрядов Аскари в Фесе наш протекторат Марокко напрямую попросил у нас поддержку в подавлении восстания. Стоит подметить, что Германия будет очень недовольна, если мы введём войска в Фес.
agad11 = Это отличный шанс, чтобы прочно укрепиться в Марокко!
agad12 = Марокко должен сам решать свои проблемы.
agad13 = Фесский трактат
agad14 = Обезумевшая Германия после ввода нами войск в Марокко потребовала компенсаций, посчитав полный переход протектората Марокко под наш контроль. Это вполне может быть поводом для войны!
agad15 = Отдайте им часть Конго.
agad16 = Отдайте им Север Марокко.
agad17 = Франция ничего не должна наглым Фрицам!
agad18 = Фесский договор
agad19 = После длительных переговоров Франция предложила территории в Конго, в обмен на наш отказ от претензий на Марокко.
agad20 = Это позор для Германии...
agad21 = Фесский договор
agad22 = Побоявшаяся нашего гнева Франция предложила нам Северную часть Марокко.
agad23 = Франция должна быть под подошвой!
agad24 = Фесское несоглашение
agad25 = Геройствующая Франция, считающая себя неуязвимой, решительно отвергла наши требования насчёт компенсации. Они готовы к войне.
agad26 = Порождены ли их действия истиной? Сейчас мы это и узнаем.
agad27 = Мы должны сдержаться. Не начинать же войну из-за колонии?
morag1 = Фесский договор
morag2 = Ввод войск в Фес привёл к кризису в отношениях Германии и Франции. Сегодня было постигнуто соглашение, по которому Германия получает часть Конго, а мы лишаемся суверенитета и делим свою территорию между Францией и Испанией.
morag3 = Выполняя свое предназначение...
morag4 = Фесский договор
morag5 = Ввод войск в Фес привёл к кризису в отношениях Германии и Франции. Сегодня было постигнуто соглашение, по которому мы лишаемся суверенитета и делим свою территорию между Францией и Германией.
morag6 = Выполняя свое предназначение...
morag7 = Фесский договор
morag8 = Кризис Франко-Германских отношений из-за Марокко привел к заключению договора, по которому мы получили сплошную полосу на Севере Марокко. Наше влияние в Марокко позволило нам стать участником этого договора.
morag9 = Сравнится ли это с Айгунским договором?
marokkog1 = Восстание в Фесе, отказ Франции
marokkog2 = Отказ Французского правительства в помощи для подавления антиколониального восстания привёл к тому, что отряды Аскари смогли продолжить нести разруху в нашей столице. Еще немного, и они вовсе займут её. Последнее, что мы можем предпринять - обратиться за помощью к Германии. Это очень рискованный шаг, так как самая протяженная граница у нас с Французским Алжиром. В случае войны у нас вряд ли удастся выстроить фронт по всей границе.
marokkog3 = Германии мы нужнее.
marokkog4 = Что-ж... 
marokkog5 = Восстание в Фесе
marokkog6 = Недавно недовольные отряды Аскари подняли восстание в Фесе, Марокко. Французские власти уже отказались помогать своему протекторату в подавлении восстания, поэтому Марокко решил обратиться за помощью к нам. Мы уже давно ведем дипломатическую войну с Францией за влияние в Марокко, поэтому их отказ дает нам полный карт-бланш на дальнейшие действия. Но станем ли мы?..
marokkog7 = Французские глупцы сдали колонию, мы должны этим воспользоваться!
marokkog8 = Во владении Марокко нет ни стратегической, ни ресурсной пользы. 
tankibritania1 = ТАНКИ!
tankibritania2 = Бронированные военные машины не являлись новинкой к этому времени, однако они могут передвигаться только по построенным дорогам, а на фронте есть лишь прорытые траншеи, ямы от артиллерийских бомб и слякоть. Проекты боевых машин на гусеничном ходу существовали еще до начала войны, однако первый прототип был завершён лишь в Январе 1916 года. Вскоре была произведена первая партия из 100 танков. Для сохранения секретности технологии они транспортировались под названием Танк (резервуар для воды). Лишь сейчас пришло время их использовать...
tankibritania3 = Танки ведут путь.
russiapmw1 = Российская империя в 20 веке
russiapmw2 = На 1910 год Россия пребывает в ужаснейшем состоянии. Промышленность, которая должна была быть построена еще в 19 веке, только начинает открываться в России. Грамотность среди населения крайне низкая, только 30% умеют читать. Благодаря реформам Николая II этот показатель вырос в два раза, хотя и того недостаточно для развития науки. Россия пытается строить из себя непобедимого колосса когда внутри неё происходят революции и восстания. Проигрыш в Русско-японской войне и революция 1905 года уничтожают весь наш дипломатический вес и престиж. Хотя войска России полны боевого духа, но этого не хватит без эффективного содержания и снаряжения. России нужны новые радикальные реформы, либо переворот в её системе...
russiapmw3 = Только время покажет...
russiapmw4 = Мы приведём Россию к победе!
romanpmw1 = Румыния и Мировая война
romanpmw2 = Уже как половина Европы была вовлечена в новый Мировой конфликт. Наших амбиций без помощи Антанты или Центральных держав никак не достичь, поэтому перед нами стоит выбор. Недавние победы Брусиловского прорыва показали, что Австро-Венгерский фронт скоро рухнет, а Французское правительство и вовсе обещает нам земли от Баната и Трансильвании до Венгерских земель у Дуная и Буковину. Мы сможем многое получить по миру с Центральными державами, но обещания не гарантируют победу Антанты. Если мы выступим против Антанты, то точно сможем заполучить Бессарабию. Выбор за вами, король.
romanpmw3 = Мы освободим Трансильванских Румын!
romanpmw4 = Дурная идея. Лучше поможем в разгроме России.
romanpmw5 = Наша армия небоеспобна для такого.
usamob1 = Мобилизация!
usamob2 = После начала войны было принято много разных мер по расширению экономической и военной отрасли. Американской армии придётся многому научиться. Так США за Первую мировую войну смогла призвать более 4 млн человек.
usamob3 = Боже благослави Америку!
mexrev1 = Мексиканская революция
mexrev2 = Недовольный диктатурой Диаса народ поднял мятеж против режима. Франсиско Мадеро и Сапата Эмилиано фактически возглавили две революции.
mexrev3 = Да как они смеют?!
mexrev4 = Сотрём диктатуру Диаса! (Играть за Хунту)
mexrev5 = Отставка Диаса
mexrev6 = С падением Мехико Порфирио Диас бежал со страны во Францию. Это ознаменует конец революции и победу либералов...
mexrev7 = Диас лишь желал стране лучшего...
mexrev8 = Победа в гражданской войне
mexrev9 = После взятия крупных городов трус диктатор Диас бежал во Францию. Это положило конец тридцателитней диктатуре. Ещё неизвестно что нас ждёт в будущем...
mexrev10 = Диас больше не достигнет истины!
mexrev11 = Победа в гражданской войне
mexrev12 = После подавления революции все её лидеры бежали в США. Леволиберальная угроза уничтожена, теперь Диасу ничего не помешает.
mexrev13 = Это конец?
mexrev14 = Трагическая декада
mexrev15 = После свержения Диаса Мадеро был избран президентом, однако его неспешность к решению аграрного вопроса сплотила против него его же товарищей. Сперва начались беспорядки и восстания, но в последствии против него начали восставать его же генералы. Таким образом в феврале в Мехико прошёл военный переворот, были освобождены все политзаключённые, но не взят Мадеро. По итогу доверенный генерал Уэрта предал Мадеро, арестовал его и по его приказу Мадеро был убит по дороге в тюрьму.
mexrev16 = Всё вернулось на свое место.
georgv1 = Коронация Георга V
georgv2 = Недавно скончался король Великобритании, император Индии, фельдмаршал Австрийский, Дядя Европы и миротворец Эдуард VII. Его сын, герцог Йорский и принц Уэльйский, Георг V был правозглашён новым королём и короновался в Вестмистерском аббатстве. Точно в момент его коронации были запущены двое башенных часов на здании Royal Liver Building — самые большие часы Великобритании.
georgv3 = Боже, храни Короля!
mexrev17 = Восстание конституционалистов
mexrev18 = Антиконституционные действия нашего нового президента Уэрты были сравнимы с политикой Диаса. Богатые северные штаты не признали диктатуру Уэрта. Правительство штата Коауила отказалось признать новое правительство Мексики. Уэрта полностью заменил состав кабинета министров, поставив там своих приверженцев. Новый диктатор приказал сфальсифицировать выборы, но из-за трудностей избирательного процесса они были объявлены несостоявшимися. Конституционалисты объявили о непризнании власти Уэрты и начали ожесточённое сопротивление против нового диктатора. 
mexrev19 = Мы уничтожим диктатуру и во второй раз! (Играть за конституционалистов)
mexrev20 = Федералы окажут нам поддержку.
albm1 = Формирование правительства
albm2 = После получения независимости Албании началось формирование правительства. Временное правительство желает создания Республики, когда как Великие державы требуют от нас установления наследственной Монархии. Какое будущее ожидает Албанию?
albm3 = Под давлением Великих держав мы станем Монархией.
albm4 = Мы построим Республику на патриотизме!
balkanfree1 = Сербское единство
balkanfree2 = После повстанческих войн против Османских варваров, мы получили независимость с помощью братского русского народа. В такое непростое время Сербия должна ориентироваться на решения Москвы. Сербия должна стать гегемоном на Балканах, чтобы объединить всех южных славян в одно государство!
balkanfree3 = За Великую Сербию!
balkanfree4 = Черногорское единство 
balkanfree5 = Черногория является очень древним государством, единственным государством, которое Османы не могли покорить на Балканах. В такое непростое время Черногория должна ориентироваться на решения Белграда. Черногория должна стать плацдармом для победы на Балканах! 
balkanfree6 = За Великую Черногорию!
balkanfree7 = Болгарское единство 
balkanfree8 = После повстанческих войн народов Балканского полуострова, мы приобрели огромнейшие территории на Балканах с помощью России. Однако, по решению Берлинского трактата Болгария была разделена на три части и унижена. В такое непростое время Болгария должна найти себе надежных союзников, чтобы не стать вновь поглощённой. Болгария должна стать вновь Великой, как во времена Симеона Великого! 
balkanfree9 = За Великую Болгарию!
balkanfree10 = Греческое единство 
balkanfree11 = Именно Греция первой получила независимость от османского ига. Греция является преемником всей древнегреческой и византийской культуры. В такое непростое время стоит вспомнить о старых союзах с Великобританией. Греция должна стать Великой, как по плану Иоанниса Колеттиса! 
balkanfree12 = За Великую Грецию!
mexrev21 = Победа конституционалистов
mexrev22 = После генерального сражения под Гвадалахарой Уэрта подал в отставку и бежал со страны. Это знаменует победу конституционалистов.
mexrev23 = Что Уэрта, что Диас, те и те бежали...
mexrev24 = Мексика будет свободна!
mexrev25 = Победа над конституционалистами.
mexrev26 = После подавления революции все её лидеры бежали в США. Леволиберальная угроза уничтожена, теперь Уэрте ничего не помешает вести бонапартистскую политику.
mexrev27 = Это конец?
mexrev28 = Четвёртая мексиканская революция
mexrev29 = После окончания третьей революции был созван Конвент командиров революционных армий, где делегаты были разделены на фракции: сторонники Вильи, сторонники Каррансы и группа офицеров армии Обрегона. Общим решением конвента было принято решение, по которому главнокомандующие Конституционалистской армией Карранса и Вилья должны подать в отставку. Временным президентом был избран Эулалио Гутьерреса. Однако Карранса не стал мириться с решением Конвента и бежал в Веракрус, после чего Конвент признал его мятежником. С этого момента начинается четвёртая революция в Мексике...
mexrev30 = Мы восстановим демократию! (Играть за Каррансу)
mexrev31 = Мы уничтожим последнюю угрозу Мексики!
mexrev32 = Победа Каррансы
mexrev33 = После сокрушительной победы Каррансистов под городом Селая, наши командиры ушли в подполье. Мы складываем оружие, больше сопротивление не имеет смысла. 
mexrev34 = Невозможно... 
mexrev35 = Победа Каррансы
mexrev36 = После сокрушительной победы под городом Селая, командиры противника ушли в подполье. Их войска сложили оружие и знамёна. 
mexrev37 = Их знамёна на земле – символ нашей победы! 
mexrev38 = Победа над Каррансой
mexrev39 = После уничтожения всех войск Каррансы, тот не способен больше вести борьбу. Мы проиграли в этой войне, время снять с себя воинский мундир. 
mexrev40 = Это конец.
secondbal1 = Вторая балканская война
secondbal2 = Итоги Лондонской конференции не удовлетворили Болгарских националистов. Македония - законная часть Болгарии, была разделена между Грецией, Сербией и нами. Пользуясь тем, что бывшие союзнические армии распологаются на нашей территории, мы можем воспользоваться неожиданностью и отхватить своё силой!
secondbal3 = Мы исправим несправедливость Лондонского мира своей рукой!
secondbal4 = Мы должны отказаться от подобных планов.
secondbal5 = Амбициозная Болгария, недовольная итогами Лондонского мира, развязала Вторую Балканскую войну! Её войска, без объявления войны, уже вторглись в нашу Македонию и ведут её оккупацию.
secondbal6 = Не стоило доверять Болгарам!
secondbal7 = Болгары слишком некомпетентны.
rsbw1 = Интервенция в Болгарию
rsbw2 = Ещё во время Первой Балканской войны мы требовали изменения границы в Южной Добрудже по линии Тутракан-Балчик. Сейчас Болгария осталась без Союзников, что дает хороший шанс отхватить своё силой!
rsbw3 = Мы покажем свое величие!
rsbw4 = Это слишком опасный план.
rsbw5 = Реваншистски настроенные войска, возглавляемые раваншистски настроенными генералами-младотурками, решили ринуться на отвоевание малой части потерянных земель с Первой Балканской войны. Должны ли мы им помешать?
buhpec1 = Бухарестский мир
buhpec2 = С потерей огромного количества территорий наше правительство приняло решение о капитуляции и подписания мира. Болгария более не способна сражаться.
buhpec3 = Как на это отреагирует Фердинанд?!
buhpec4 = Константинопольский мир
buhpec5 = С потерей огромного количества территорий Болгарское правительство приняло решение о капитуляции и подписания мира. Болгария более не способна сражаться. Однако Вторая Балканская война знаменует роспуск Балканского союза...
buhpec6 = Теперь Болгары никому не помешают.
titanic1 = Гибель Титаника
titanic2 = Гордость Британского кораблестроения, Титаник, сегодня затонул по пути в США. Халатность руководства и экипажа привела к тому, что корабль столкнулся с Айсбергом. В этой трагедии погибло около 1000 человек.
titanic3 = Эта трагедия серьёзно испортит наш имидж...
francfer1 = Сараевское убийство
francfer2 = Сегодня в Сараево было совершено убийство наследника австрийского престола Франца Фердинанда. Франц посетил Сараево для "осмотра" новоприобретённой Боснии, но здесь его и поджидали участники террористической организации "Молодая Босния". Первое покушение с использованием гранаты не удалось, но позже его на улицах города встретил Гаврила Принцип, который и убил наследника. Гаврила попытался совершить самоубийство после покушения, но вовремя был схвачен и отправился в тюрьму. В этом покушении явно замешано сербское правительство.
francfer3 = Сербы не знают границ своей наглости! Отправьте ультиматум!
francfer4 = Мы начнем с превентивного удара!
francfer5 = Австро-Венгрия не готова к войне...
okkross1 = Оккупация России
okkross2 = После захвата нашими войсками Санкт-Петербурга, мы можем установить марионеточное правительство, впротивовес вражеской нам России. Это будет вторая легитимная сила на землях русских, а чтобы заслужить полное доверие русских мы должны захватить Москву. Мы установим монархом марионеточной России Вальдемара Прусского, сына брата Вильгельма II Генриха Прусского, из рода Гогенцоллернов. В России он примет новое имя - Владимир Русский. Новое правительство будет подчиняться прямым указам из Берлина. 
okkross3 = Коронуйте Владимира Русского.
okkross4 = Мы намеренны завоевать Россию целиком!
gpvgir5 = Мы продолжим оккупацию.
francfer15 = Австро-Венгерский ультиматум
francfer6 = После убийства Франца Фердинанда все обвинения насчёт убийства пошли на Сербию. Хотя это было недалеко от правды, но нам был вручен ультиматум, с требованием допустить службы Австро-Венгрии к ведению расследования насчёт убийства. Согласие приведёт к отказу от собственного суверенитета. 
francfer7 = Мы слишком ослаблены, чтобы вести очередную войну...
francfer8 = Сербия будет расчитывать на союзников!
francfer9 = Австро-Венгерский ультиматум, согласие
francfer10 = Зажатая в угол Сербия согласилась на все условия ультиматума. Теперь мы управляем внутренними делами Сербии.
francfer11 = Теперь Сербия под полным надзором.
francfer12 = Австро-Венгерский ультиматум, отказ
francfer13 = Сербия отвергла ультиматум, так как посчитала, что лишится всего суверенитета. Грядёт мировая война...
francfer14 = Война! Готовьтесь к мобилизации!
rsf1 = Нападение на Сербию
rsf2 = Австро-Венгры, возомнившие, что настал час войны, объявили войну Сербии. По договоренностям мы должны вступить в войну на стороне Сербии. Если мы отступим, это уничтожит всё наше влияние на Балканах и приведёт к внутренним беспорядкам.
