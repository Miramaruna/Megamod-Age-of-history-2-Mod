novgor2 = Господин Великий Новгород — гордый наследник вольной русской традиции. Справедливое вече чутко слышит глас свободолюбивого народа, а властные князья свято хранят православную веру от посягательств еретиков. Переселение с юга людей, напуганных жестокими набегами половцев, дает нашим купцам хорошую прибыль. Слава всемогущему Богу за то, что, воистину, кроме вечных кровавых войн с нашими братьями нет ничего, что поколебало бы спокойствие и процветание новгородской земли.
