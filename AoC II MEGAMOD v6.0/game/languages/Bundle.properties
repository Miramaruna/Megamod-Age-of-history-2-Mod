titleVLsel = Пора выгнать Ахея из своего дворца!
GVsel = Гражданская Война
opisanieGVsel = Мятежники смогли нарастить достаточные силы, чтобы объявить себя независимым государством. Молон объявил себя царём Мидии, а так же заявил, что готов бороться с нами до самого конца. Государство Селевкидов ослабло как никогда, внутренние конфликты раздирают нас на части.
titleGVsel = Это очень плохо, сможем ли мы оправиться от этого?
AVsel = Антиохова Война
opisanieAVsel = Наш царь Антиох III Великий подготовил войска для завоевания Эллады, нас поддержат Этолия, а также Мессения. Однако, Рим имеет большое влияние в регионе и он явно не будет согласен с тем, что мы хотим захватить такой лакомый кусок.
