VSKK = Восстание На Востоке
opisanieVSKK = Мы думали, что, уничтожив большую часть социалистического движения в Конго, мы сможем избежать дальнейших волнений социалистов, но это оказалось не так. Восточная часть страны преимущественно является сельской местностьи и так вышло, что среди сельского населения ведётся активная коммунистическая пропоганда. Большое количество молодёжи заинтересовалось движением социалистов, что в итоге привело к масштабному восстанию на востоке. Эти люди называют себя "Симба", они довольно разрознены, но активны. Нам нужно усмерить их, пока это не привело к очередной революции.
