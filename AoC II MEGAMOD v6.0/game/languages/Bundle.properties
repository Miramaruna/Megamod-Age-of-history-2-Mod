moscovy1 = Москва в 1444
moscovy2 = Объединив под собой множество русских княжеств Москва является почти доминирующей силой на русских землях. Главный наш конкурент на объединение России - Новгородская Республика, которая опасается нашего нападения и ищет себе союзников. Но главным соперником в собирании земель Киевской Руси является княжество Литовское на Востоке. Москва должна любыми методами выжить.
