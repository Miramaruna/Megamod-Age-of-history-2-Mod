russlav = Изгнание Варягов
orusslav = Варяги досаждают славянам и финно-уграм, и навязывают нам дань. В очередной раз они прибыли за данью, но были выбиты с славянских земель. "Изгнали варяг за море, и не дали им дани, и начали сами собой владеть" - говорят соплеменники. Мы добрососедствуем с нашими славянскими и угорскими соседями, но без чёткой власти могут возникнуть противоречия между нами; наша независимость может начаться сейчас, но кто будет защищать нас от врагов, если не варяги?
trusslav1 = Будем сами собой владеть!
trusslav2 = Пускай возвращаются!
VNkrf = Восстание Наёмников
opisanieVNkrf = После поражения в Сицилийской войне и выплате Риму большой военной контрибуции, мы столкнулись с тем, что наша наёмная армия осталась без жалования. Узнав о том, что мы не сможем выплатить им обещанную сумму, те подняли мощнейшее восстание, которое смогло объединить ливийцев и наёмников в борьбе с Карфагеном. Так как вся наша наёмная армия выступила против нас, нам пришлось прибегнуть к призыву граждан в армию. Эта война может стать последней для Карфагена, но у нас ещё есть шансы подавить восстание и восстановить свою власть. 
titleVNkrf = Народное ополчение в действии.
VNkrf2 = Падение Столицы
opisanieVNkrf2 = Бунтовщики смогли взять Карфаген штурмом! Теперь в их власти часть казны Карфагена, а так же все отрасли жизни горожан. Повстанцы установили свою власть в городе и создали своё собственное правительсво. Больше их целью не является выплата жалования. Их цель - установление своей собственной власти.
