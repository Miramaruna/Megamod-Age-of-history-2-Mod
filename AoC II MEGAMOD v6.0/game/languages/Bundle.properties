opisanieVstrechiN = На встрече мы выразили свою твердую позицию. "Мы не отдадим Чехословакию на растерзание Германии и её союзников, чего бы это не стоило!" - прозвучало из уст нашего премьерминистра. Руководство Германии заявило, что Германия продолжит стоять на своём. Наша же позиция не изменится больше.
aga = Это было правильное решение!
opisanieVstrechiNG = На встрече премьерминистр Великобритании отказался передавать нам Судетскую область. Так же он заверил нас, что если мы попытаемся применить силу, то Великобритания и Франция не будут стоять в стороне. Нам придется искать другие пути.
ladno = Германия ищет другие пути.
opisanieVstrechiFN = Встреча германского и британского руководства в Годесберге вынудило Германию прератить агрессивную внешнюю политику хотя бы на время.
opisanieVstrechiDG = На встрече в Годесберге мы потребовали удовлетворить наши претензии на Судетскую область. Премьерминистр Великобритании заверил нас, что Судетская область будет передана до 28 октября. Что же, нам остаётся только ждать.
diplomat = Германия приростает новыми землями!
GermIshet = Германия Ищет Другие Пути
opisanieGerm = В связи с тем, что мы не смогли дипломатически решить вопрос Судетской области, нам придется решить этот вопрос по-другому. На данный момент у нас есть два варианта - это военное вторжение и дестабилизация обстановки в Чехословакии. Нам нужно выбрать с умом.
