lit = Литовская угроза
lit2 = Все сильнее разрастается и крепнет новая сила на Балтике — Литва. Взращенное борьбой племен и войнами с немецкими рыцарями, молодое государство запада готовит свои силы для навязывания своего владычества соседям. Их соседи — мы. Русские земли уже встречались с угрозой литовских князей. Не должен ли теперь богоизбранный князь новгородский разбить литовцев, пока они не готовы ударить первыми?
lit3 = Выступаем
