chi19131 = Вторая революция
chi19132 = После окончания революции Юань Шикай наращивал мощь своей личной армии и сокращал республиканскую армию Юга. Республиканцы не были против, поскольку считали, что Китай уже стал страной буржуазного закона и порядка. Постепенный роспуск правительства, заговоры Юань Шикая, перевод армии в боевую готовность и огромнейшие займы от западных держав открыли республиканцам глаза. Республиканцы не хотели войны, но Юань Шикай делал всё, что-бы её начали республиканцы. Республиканцы стали готовиться к нежелательной им войне...
