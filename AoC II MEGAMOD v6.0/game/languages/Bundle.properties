opisaniePMmid2 = После того, как мы поддержали мятежников на территории Мидии, царь Антиох затаил обиду на нас и после того, как разделался с повстанцами, решил выступить против нас. Однако, всё может закончиться и без жертв, если мы признаем власть Селевкидов над Атропатеной. 
