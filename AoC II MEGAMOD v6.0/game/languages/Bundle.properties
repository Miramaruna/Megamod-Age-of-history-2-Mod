rusinflu3 = Балканы будут свободны!
rusinflu4 = Российское давление
rusinflu5 = Сегодня российские дипломаты надавили на нас, потребовав, чтобы мы забыли на время о противоречиях и сформировали союз нацеленный против Осман. Желание выгнать Осман с Балкан слишком велико, мы должны согласиться.
rusinflu6 = За единую Болгарию!
rusinflu7 = Велеть свою ноту будут Сербии!
rusinflu8 = Балканский союз
rusinflu9 = После давления России на Болгарию, последняя стала согласна на союз с нами.
rusinflu10 = Освободим Балканы!
rusinflu11 = Союз с Болгарией? Что...
rusinflu12 = Славянские народы Балкан объединились в один союз, чтобы прогнать Осман с полуострова. Должны ли мы присоединиться к ним?
rusinflu13 = Это не наш час...
austinf1 = Объединение Балканских народов
austinf2 = Националистически настроенные Балканские страны объединились в один союз, чтобы прогнать Осман с полуострова. Это может привести к националистическим мятежам внутри нашей империи...
austinf3 = Это не к добру...
austinf4 = Националистически настроенные Балканские страны объединились в один союз, чтобы прогнать нас с полуострова. Это может привести к националистическим мятежам внутри нашей империи...
ultim1 = Война с Османами
ultim2 = Османская империя - главный враг всех народов Балкан. Мы вручили ультиматум османам на уменьшение количества войск в регионе и открытия национальных школ, что привело к полному отказу нам. Сегодня настал день, который запомнит история...
ultim3 = Свободу Балканам!
lonpec1 = Лондонский мир
lonpec2 = Османская империя приняла свое поражение на Балканах. После давления со стороны Великих держав она согласилась на мир. Мы не можем не подписать мир.
lonpec3 = Это новая страница в истории Балкан!
lonpec4 = Мир с Балканами?
lonpec5 = После полного разгрома наших войск на территории полуострова мы можем подписать мир со странами Балканского союза. Некоторые Великие державы будут недовольны, если мы не согласимся...
lonpec6 = Это полный разгром...
lonpec7 = Скорее Босфсор пересохнет, чем Османская империя сдастся!
porrev1 = Португальская революция
porrev2 = Рост республиканских настроений, неспособность королей защитить интересы Португалии и цареубийство в Лиссабоне, привели к неэффективности монархии. Последний король был незаинтересован в управлении страной, что дало повод республиканцам-революционерам провозгласить Республику.
porrev3 = Слава Республике!
lenrep1 = Ленский расстрел
lenrep2 = 4 апреля на приисках Ленского золотопромышленного товарищества началась забастовка более чем двух тысяч рабочих. Годами недовольство рабочих росло из-за тяжких условий труда, а так же из-за запрета рабочим иметь дополнительный заработок. Поводом для забастовки послужило то, что рабочие получили не качественное мясо для употребления в пищу. Шествие проходило мирно, но по приказу жандармского ротмистра Трещенкова солдаты открыли огонь по рабочим. При расстреле погибло 270 рабочих.
lenrep3 = Ужасное происшествие.
cprus1 = Дружба с Германией?
cprus2 = Выход из Антанты ознаменовал полный разрыв всяческих договоренностей между Францией и Россией. Германия, пользуясь этим кризисом, предложила нам вступить в Центральные державы.
cprus3 = Мы не можем доверять ни Фрицам, ни Багетчикам.
cprus4 = Выпьем же за наших новых товарищей!
cprus5 = Дружба с Россией?
cprus6 = Выход из Антанты ознаменовал полный разрыв всяческих договоренностей между Францией и Россией. Мы можем предложить России вступить в Центральные державы и поддержать их некоторые планы.
cprus7 = Лучше держаться нейтралитета.
cprus8 = Российская военная машина может помочь нам в назревающей войне.
grec1 = Война с Османами
grec2 = Объявив всем альянсом ультиматум Османам, который они отклонили, мы исполняя союзнический долг должны вступиться в войну, где мы намереваемся проявить себя.
grec3 = За Великую Грецию!
grec4 = За Великую Сербию!
grec5 = За Великую Черногорию!
egypfww1 = Смещение Хедива
egypfww2 = После начала Первой мировой войны, Великобритания решила поставить у нас пробританского султана, который будет яростно выступать за войну на стороне Антанты, тем же сместив Аббаса-паша, который вёл независимую политику.
egypfww3 = Прогоним Османов из Ирака и Леванта навсегда!
egypfww4 = Мы начнем антиколониальное восстание!
smertn21 = Смерть Николая II
smertn22 = Николай II умер. Его престол должен был унаследовать его сын Алексей, но на похоронах его не было. Более того, он не пришёл на свою коронацию. Обыскав все царские резиденции и дачи Алексей не был найден. До тех пор, пока не будет найден Алексей, Российскую империю возглавит Регент без царя Сергей Таборицкий, из Общества Престолонаследия Российской Империи.
smertn23 = ГДЕ ОН?!
germaninf1 = Германия вводит войска!
germaninf2 = Мы примем это.
germaninf3 = Мы не приемлим этого.
germaninf4 = Для установления надёжной власти Германия разогнала Центральную раду. После был созван Всеукраинский съезд, где Германия настояла на Павле Скоропадском.
albanrev1 = Албанское восстание
albanrev2 = Албанские крестьяне перестали платить налоги и стали нападать на гарнизоны. Они требуют автономии в составе империи, но можем ли мы позволить им это?
albanrev3 = Откажите им в старых правах.
albanrev4 = Они и вправду заслуживают этого.
albanrev5 = Победа Албанского восстания
albanrev6 = Албанские повстанцы после занятия всех ключевых точек в Янинском и Шкодерском вилайете провозгласили независимость. Их уже успели признать некоторые страны, что гарантирует их неприкосновенность...
albanrev7 = Кризис продолжается...
albanin1 = Албанская независимость
albanin2 = 
