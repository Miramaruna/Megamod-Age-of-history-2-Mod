SV = Восточный Вопрос
oSVang = Российская империя является большой угрозой нашему влиянию в Средиземном море, а так же на Ближнем Востоке. Сейчас Россия ведёт успешную компанию против Османской империи, победа над которой даст ещё большее влияние России в регионе. Нам нужно решить, остановить Россию, или же нет.
