yanshik5 = Янь Шикай
yanshik6 = Юань Шикай прибыл в Пекин в окружении 2 тысяч преданных ему солдат и офицеров. Взяв под свой полный контроль армию, он отстранил от руководства военными делами маньчжуров и заменил их своими ставленниками. Тем самым династия Цин полностью оказалась в его руках. 16 ноября Юань Шикай сформировал своё правительство и предложил сотрудничество республиканскому Югу. Основу первого кабинета Юань Шикая составили старые цинские чиновники из числа его друзей, знакомых и единомышленников, то есть стойких консерваторов. В секретном послании он умело запугал императрицу и князей возможностью физического уничтожения членов императорского дома. Но как главнокомандующий он проявил себя отлично.
yanshik7 = Он и спасение и враг Китая!
monqin1 = Монгольская революция
