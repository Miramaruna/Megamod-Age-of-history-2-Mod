perevorot = Государственный Переворот!
opisaniePerevorota = После не самых популярных решений, королю Румынии пришлось отречься от престола и сбежать в Югославию. Было создано новое правительство, в котором большинство мест заняла "Железная Гвардия". Фактически был совершён переворот в стране.
novoeVremya = Новый период в истории Румынии.
avstriyaVOsi = Примирение с Германией
opisanieAvstriiVOsi = Германия уже давно хочет включить Австрию в свой состав, но нас категорически не устраивает такой вариант. Однако, сейчас Германия является сильным государством и с помощью своей силой она может завладеть нашими территориями. Мы можем найти копромисс и остаться независимыми.
kompromiss = Нам нужен компромисс.
opisanieAvstriiVOsiG = Австрия хочет присоединиться к Оси. В скором времени мы присоединим её к нашему Рейху!
avstriyaVOsiG = Союз с Австрией
aoaoa = Австрия и Гермнания - братья на век!
predlojenie = Советское Предложение
opisaniePred = Руководство СССР предложило нам обмен территориями около Ленинграда. Они предлагают нам обширные земли в Карелии в обмен на территории на Карельской перешейке. Стоит ли нам соглашаться?
daFin = Выгодное предложение!
netFin = Надувательство!
BZM = Битва за Москву
opisanieBZM = Уже полгода длится Великая Отечественная война, а мы терпим крупные поражения. Вермахт смог продвинуться вглубь нашей Родины, захватить множество крупных городов, железнодорожных путей и промышленных центров. Но сейчас мы должны провести контратаку под Москвой, дабы отбросить от неё немецкие силы. В бой! За Родину! За Сталина!
titleBZM = Отступать некуда - позади Москва!
bliczkrig = Германский Блицкриг
opisanieBlicz = Тактика молниеносной войны хорошо показала себя как на Западном, так и на Восточном фронте. Но уже полгода мы не можем добраться до Москвы и захватить СССР. Наши цели не были достигнуты в назначенный срок, а наступление на Москву застопорилось. Наше командование готовит новую наступательную операцию на южном направлении. От нас требуется держать оборону под Москвой и сдерживать предстоящее наступление Красной Армии.
titleBlicz = Война из молниеносной превращается в затяжную.
rumArm = Величие Румынии 
opisanieRumArm = Вместе с нашим союзником Германией мы вторглись на территории СССР в июне 41-го. Нашей целью было возвращение утраченных территорий в Бессарабии, и мы добились этого. Однако, план Барбаросса не был реализован полностью, но Германия готовит новое наступление на Кавказ, чтобы отрезать СССР от нефти. Это наступление планируетсся на лето 42-го года, там понадобится наша помощь.
titleRumArm = Нужно подвести дополнительные силы.
VelFin = Война в Карелии
opisanieVelFin = После авиаударов СССР по нашим аэродромам, мы оъявили войну СССР. На первых порах наше наступление в Карелии шло неплохо, но наступление осени и неблагоприятная местность застопорили наше продвижение. Наши цели - Кировская железная дорога и Мурманск, не были достигнуты, СССР по-прежнему получает помощь от Созников по морю. Нам нужно закончить начатое и к лету отрезать СССР от поставок Союзников.       
titleVelFin = Готовьте наступление!
YugPar = Югославские Партизаны
opisanieYugPar = Наши оккупационные власти в Югославии очень не нравятся народонаселению, что заставляет их брать оружие и сражаться за свою тщетную независимость. Нам придётся бороться с этим.
titleYugPar = Видимо, усташи переборщили с геноцидами...
titleYugParH = Что эти сербы о себе возомнили?
YugPar2 = Народно-Освободительная Армия Югославии
opisanieYugPar2 = "Красная Армия на пороге! Союзник идёт!" - такие выкрики слышутся в рядах подполья так называемой НОАЮ. Мы могли бы проигнорировать их, но тот факт, что с приближением союзных сил югославские партизаны всё набирают и набирают свою силу, заставляет нас предпринимать отчаянные действия. НОАЮ подняло крупнейший бунт с самого начала войны и они намеренны идти до конца.
titleYugPar2 = Что же, мы тоже.
KomS = Ставка Верховного Главнокомандования
opisanieKomS = Ввиду возможных сложностей на фронте, Ставка Верховного Главнокомандования решила направить дополнительный силы на отдельные участки фронта. 
titleKomS1 = Подкрепление отправится на Север.
titleKomS2 = Подкрепление отправится в Центр.
titleKomS3 = Подкрепление отправится на Юг.
titleKomS4 = Отправить подкрепление в тыл.
KomG = Верховное Командование Вермахта
opisanieKomG = Ввиду возможных сложностей на Восточном фронте, Верховное Командование Вермахта решило направить дополнительные силы на отдельные участки фронта.
titleKomG1 = Подкрепление отправится на Север.
titleKomG2 = Подкрепление отправится в Центр.
titleKomG3 = Подкрепление отправится на Юг.
titleKomG4 = Отправить подкрепление в тыл.
africaIt = Африканские Неудачи 
opisanieAfricaIt = Наши имперские амбиции привели нас к вступлению в войну, которая должна была привести нас к величию и восстановлению Римской империи. Однако, кроме поражений эта война ничего не принесла. Союзники наступают на Триполитанию, мы потеряли колонии в Эфиопии, Сомали и Эритреи. Хоть мы и смогли завладеть новыми территориями на Балканах, но это нивелируется нашими поражениями в Африке. Нам нужно срочно перехватить инициативу в Афике и разромить Союзников!
germaniyaPomogi = На защиту Итальянской Африки!
africaBr = Североафриканская Кампания
opisanieAfricaBr = Довольно неумелое командование Италии терпит поражение за поражением в Африке. Они уже потеряли колонии в Восточной Африке, теперь их последний плацдарм - Триполитания. Для борьбы с нами Германия направила в Африку целый корпус под командованием Эрвина Роммеля. Африканский корпус Германии смог изрядно потрепать нас, но близится конец года, и наступательные возможности немецкого корпуса начали исчерпываться. Мы смогли развить своё наступление и отбросить врага назад. Время добить поражённого зверя!
titleAfrBr = Покажем Роммелю!
SrFr = Свободные Французские Силы
opisanieSrFr = Франция не не погибла тогда в 1940-м году! Она потерпела поражение, но не проиграла войну! Франция продолжает сражаться, сражаться за свою свободу! Наши силы под предвадительсвом Де Голя теснят итальянцев и немцев в Африке. Рано или поздно мы дойдём и до Парижа!
titleSrFr = Пора выгнать оккупантов из наших домов!
Vishi = 
opisanieVishi = 
titleVishi = 
AmAr = Война в Европе
opisanieAmAr = Сегодня 11 декабря 1941 года Германия и Италия объявили войну нашему государству. Уже несколько лет в Европе и других частях света ведётся большая война, в которую втянули и нас. Видимо, придётся нашим войскам отправляться в Европу во второй раз.
titleAmAr = Готовьте конвои!
tunisBr = Тунисская Кампания
opisanieTunisBr = Войска Союзников "выдавили" немцев из Ливии, после чего те отступили в Тунис, где пополнились подкреплением с материка. Тунис является важной точкой для нашего дальнейшего наступления как в Северной Африке, так и в самой Европе.
titleTunisBr = Передавайте привет Роммелю!
MAo = Мароккано-Алжирская Операция
opisanieMAo = Силы союзников начали высадку в Северной Африке! Наши силы уже заняли некоторые ключевые города, дальнейшее наступление в этом направлении может привести к полному вытеснению вражеских сил из Африки.
titleMAo = Теснить врага со всех сторон!
AfrNash = Конец Североафриканской Кампании
opisanieAfrNash = Войска Союзников окончательно вытеснили войска Оси из Африки. Теперь мы можем планировать высадку в Европу, не боясь удара под бок.
titleAfrNash = Второй фронт должен быть открыт как можно скорее!
sicilia = Высадка в Сицилии
opisanieSicilia = Силы Союзников планируют совершить высадку на Сицилию - территорию Италии. Если высадка окажется удачной, то мы сможем открыть второй фронт, чем поможем СССР, отвлекая и сковывая чать вражеских войск.
titleSicBr1 = С каждым днём враг всё слабее.
titleSicBr2 = Враг подождёт до следующего раза.
normandia = Высадка в Нормандии
opisanieNormandia = После успешной высадки на Сицилии и последующего наступления вглубь Италии, наступление застопорилось. Исходя из этого, союзные войска разработали план высадки в Северной Франции. Эта операция может положить начало конца Германии и её военной машины. 
titleNorm1 = Прогоним Германию из Франции!
titleNorm2 = Не нужно спешить с такими решениями.
yugFrancii = Южно-Французская Операция
opisanieYugFr = Силы союзников готовы начать высадку на юге Франции, чтобы ударить с двух фронтов одновременно. Мы скорейшим образом сможем нейтрализовать режим Виши!
titleYF1 = Приступайе!
titleYF2 = Не нужно спешить с подобными вещами.
NSF = Северная Франция, Мы дома!
opisanieNSF = Вермахт отступает перед нашим натиском! Мы тесним немцев по всему направлению, а Северная Франция снова под нашим контролем!
titleNSF = Hourra!
OPF = Освобождение Парижа
opisanieOPF = Наши войска вошли в нашу столицу - Париж. Мы смогли вытеснить неприятеля из города, после чего мы начали разминирование важных столичных объектов, что были заминированны незадолго до освобождения Парижа. Дальше только один путь - к Рейну!
titleOPF = Радуйся, Франция, сегодня ты спасена!
PRV = Падение Режима Виши
opisaniePRV = Коллаборационисты из правительства Виши капитулировали перед нами, предатели проиграли!
titlePRV = Долой предателей!
OFr = Освобождение Франции
opisanieOFr = Германские силы были вытеснены с территории Франции. Примите наши поздравления, французы!
titleOFr = Долой оккупацию!
moskvaRip = Москва Потеряна!
opisanieMoskvaRip = Несмотря на титанические усилия Красной Армии, мы не смогли сдержать неприятеля и тот вошел в Москву. Руководство СССР удалось спасти и вывести из города. Эвакуация населения прошла успешно, большая часть населения вывезена в тыл. Битва за Москву не уветчалась успехом для нас, но мы в силах всё исправить. Мы направим силы, чтобы отбить Москву у врага.
titleMosRip = СССР не падёт, пока жив его народ!
moskvaRipG = Вермахт в Москве!
opisanieMoskvaRipG = Группа армий "Центр" добилась целей, поставленных нами в самом начале войны. Москва взята, а это значит, что наш враг сломлен. Однако, он наверняка попытается отбить этот город, ведь он очень важен для него.
titleMosRipG = Защищать город любой ценой!
moskvaNash = Возвращение Москвы!
opisanieMoskvaNash = Москва была отбита нашими силами! Мы прошлись военным парадом по Красной площади в честь Этого события! Мы не можем допустить повторную потерю столицы.
otbili = Ура, товарищи!
moskvaNashG = Москва Потеряна!
opisanieMoskvaNashG = Части Красной Армии смогли отбить город, нам пришлось отступить. Противник снова располагает крупным железнодорожным узлом, а так же промышленными мощностями.
otbiliG = Война ещё не проиграна!
kirovRip = Потеря Связи с Мурманском
opisanieKir = Финские войска смогли развить наступление в заполярье и отрезать нас от Мурманска. Фины захватили участок Кировской железной дороги, по которой Союзники поставляли нам Ленд-лиз. Мы должны восстановить связь с северным портом во что бы то ни стало.
titleKir = Это тяжёлое поражение... одно из них...
kirovRipF = Союзные Поставки в СССР
opisanieKirF = Наши войска смогли добиться прекращения поставок Союзников в СССР, перекрыв жизненно важную артерию - Кировскую железную дорогу. Красная армия попытается вернуть контроль над ней, чего мы должны избежать любой ценой.
titleKirF = Финский шаг от Балтики до Белого моря!
Novr = Захват Новороссийска
opisanieNovr = Вермахт смог захватить портовый город Новороссийск, где после оккупации Крыма располагался Черноморский флот. Мы успели вывести весь флот до того, как к враг подобрался к портам, мы перевели флот в другое место дислокации. Так как враг продвигается слишком быстро, нам портребуется задействовать дополнительные людские ресурсы, чтобы постараться остановить Вермахт.
titleNovr = Дополнительные воска не бывают лишними!
Groz = Падение Грозного
opisanieGroz = Вермахт дошел до Грозного и уже близок к захвату наших нефтяных промыслов. Мы должны остановить его здесь!
titleGroz = Несчастье!
kerch = Керченский Десант
opisanieKerch = Силами Черноморского флота было проведено стратегическое наступление в Крыму. Его целью было отвлечение противника и деблокация Севастополя. В целом операция прошла успешно, мы смогли вытеснить противника с Керченского полуострова и занять хорошие позиции в Крыму. 
titleKer = Крымский фронт открыт!
kerchG = Высадка в Керчи!
opisanieKerchG = Противник совершил десантную операцию в Крыму! Он смог оттеснить нас из Керчи и развить наступление на полуострове. Это является угрозой потери Крыма, а так же сковывания наших действий на Южном направлении. 
titleKerG = Манштейн должен с этим разобраться!
opisanieKerch2 = Силами Черноморского флота было проведено стратегическое наступление в Крыму. Его целью было отвлечение противника и сковывание его действий. В целом операция прошла успешно, мы смогли оттеснить противника с Керченского полуострова и занять хорошие позиции в Крыму, однако, дальнейшее продвижение застопорилось.
pStal = Враг под Сталинградом!
opisaniePStal = Вражеские войска смогли вновь прорваться вглубь нашей страны, но и ещё добраться до самой Волги! Нам придётся привлечь дополнительные резервы, чтобы сдержать этот натиск.
titlePStal = Мобилизуем резервы!
Stal = Сталинградская Битва
opisanieStal = Враг дашёл до Волги! Он пытается отделить юг нашей родины от центра, тем самым лишить нас важных ресурсов. Мы не можем допустить такого расклада событий, так что враг не должен продивинуться дальше! Ни на улицу, ни на шаг!
titleStal = Враг не пройдёт!
StalG = Войска в Сталинграде
opisanieStalG = Наши доблестные солдаты наконец дошли до Волги, войдя в Сталинград. Столкнувшись с активным сопротивлением врага, наши силы были скованны в горде. Нам приходится проходить через тяжёлые городские бои Сталинграда. Нам нужна только победа, так что долго здесь задерживаться мы не можем, нужно двигаться вперёд!
titleStalG = Проедем на танках до степей Казахстана!
peremirie = Перемирие с Финляндией
opisaniePeremirie = После нашего наступления в Карелии мы смогли сильно ослабить Финляндию и она приняла наше предложение перемирия. Война в Карелии закончена, но на территории Финляндии ещё остались войска Вермахта. Они находятся в Лапландии, мы должны вытеснить их оттуда чтобы не допустить их внезапной атаки.
titlePer = Придётся выгонять немцев из Лапландии.
peremieieF = Перемирие с СССР
opisaniePerF = Советские войска оказались сильнее, чем мы могли предполагать. Они вытеснили нас из завоёванных территорий Карелии, после чего вынудили нас подписать мир. Мы согласились встать на сторону союзников, но Германию это не устроило. Германские войска остались в Лапландии и не собираются уходить. Нам нужно выгнать их, или же пусть это делают другие?
titlePerF = Кому-то придётся сделать это!
LenRip = Ленинград Потерян!
opisanieLenRip = Вражеские войска смогли взять Ленинград! Наша оборонительная операция полностью провалена, но мы смогли вывести некоторую часть войск по "Дороге жизни".
lenRip = Война ещё не проиграна!
lenRipG = Ленинград Под Нашим Контролем!
opisanieLenRipG = Группа армий "Север" смогла овладеть Ленинградом! Наши войска смогли встретиться с войскаами Финляндии на старой границе СССР. Советы успели вывезти большую часть населения и промышленных предприятий на восток. Нам нужно перегруппироваться и продолжить наступление.
titleLenRipG = Город за городом будет взят и СССР перестанет существовать!
kazanRip = Потеря Казани!
opisanieKazanRip = Наши войска под Казанью потерпели поражение, мы не смогли сдержать натиск войск Вермахта. Население частично эвакуировано, частично осталось в городе. Часть гарнизона смогла отступить, но в городе ещё остались очаги сопротивления.
kazanIh = Военная машина Германии берёт верх...
kazanRipG = Казань Взята!
opisanieKazanRipG = Наши войска вошли в город Казань! Красная Армия была наголову разбита нашими войсками, а этот город даст нам большое количество военных предприятий, вывезенных сюда в самом начале войны.
kazanIhG = Очередная победа германской военной машины!
