holspa = Война в нижних землях
holspa1 = Нидерланды — страна, расположенное на берегу Северного моря в месте пересечения европейских торговых путей. В XVI веке на территории страны располагалось 17 провинций, объединенных в один великий союз. Среди них можно отметить графства Голландия, Зеландия, Артуа, сеньории Мехельн, Фрисландия, Оверэйссел и епископство Утрехтское. В начале XVI века территория, на которой располагались провинции, находилась под руководством испанских Габсбургов. Но их власть не была основной, поскольку устройство было иное. Испанский правитель имел несколько наместников, главным из них был генеральный штатгальтер, во время службы которого действовали рычаги власти в виде советов. В 1556 году сменился руководитель страны — трон был принят Филиппом II, сыном Карла V, который стал королем не только Нидерландов, но и Испании. Местом рождения Филиппа II хоть и значилась Фландрия, но вырос он в Испании и высказывал не самые лестные речи об отцовской родине. Именно со смены власти и начали появляться предпосылки войны за независимость Нидерландов. Ситуация в провинциях накалялась с каждым годом, но Филипп не спешил предпринимать какие-либо меры. В итоге, северные провинции восстали против власти Габсбургов как по культурным, так и по экономическим причинам. Южные провинции до сих пор остаются в составе испанских Нидерландов, но тем не менее, стабильность среди граждан оставшихся провинций также подвержена угрозе с севера. .
