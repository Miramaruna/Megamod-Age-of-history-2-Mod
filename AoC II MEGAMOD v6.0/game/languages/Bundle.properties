tBRmirn = Лучшее, что могло произойти в этой войне!
AUmir = Перемирие с Пруссией
oAUmir = Австрия утихомирила буйного короля Пруссии, теперь он готов пойти на переговоры и отдать всё, что он когда-то забрал у нас. Осталось лишь собраться на конференцию.
tAUmir = Хорошо.
AUmirn = Мирное Соглашение
oAUmirn = Австрийская армия не смогла приподнести Фридриху II достаточно доводов для сдачи своих войск, поэтому нам приходится довольствоваться тем, что есть. Мы потеряем все претензии на Силезию, в замен чего Пруссия признает наше право на престол Модены в Италии. Это большее, на что мы можем расчитывать.
tAUmirn = Статус-кво сохранён...
AUmirn2 = Мирное Соглашение
oAUmirn2 = Пруссия уступила нам в военном искусстве, что и привело их к поражению в войне. Теперь Силезия вновь принадлежит нам, а с территориальными приобретениями России она сама разберётся.
tAUmirn2 = Пруссия поставлена на место!
PRmirn = Мирное Соглашение
oPRmirn = Пруссия не только смогла выжить в этом жестоком противостоянии, но и показать Европе, что Фридрих II действительно Великий правитель. Австрия отказывается от всех претензий на наши земли, а мы взамен признаём за ними право на Модену в Италии. Дальнейшее противостояние Пруссии и Австрии покажет, кто сможет объединить Германию под своим началом.
tPRmirn = Пруссия вознеслась над Европой!
BRfwar = Стычки в Америке
oBRfwar = Уже второй год подряд происходят сражения на территории Америки между французскими колонистами и англичанами. Формально война ещё не объявлена, но она уже идёт полным ходом в колониях. Нам нужно объявить о начале войны, чтобы потом мы смогли забрать себе территории, которые завоюем.
tBRfwar = Проклятые французы!
FRbwar = Стычки в Америке
oFRbwar = Уже второй год подряд происходят сражения на территории Америки между французскими колонистами и англичанами. Формально война ещё не объявлена, но она уже идёт полным ходом в колониях. Нам нужно объявить о начале войны, чтобы потом мы смогли забрать себе территории, которые завоюем.
