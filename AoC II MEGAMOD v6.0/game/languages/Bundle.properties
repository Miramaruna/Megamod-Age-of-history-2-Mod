yanshik1 = Янь Шикай
yanshik2 = Ветеран Японо-Китайской войны, командующий и всекитайский палач Юань Шикай в прошлом был приговорен к смерти Императрицей, но отказавшись от всех своих постов отправился в ссылку. После начала революции он стал очень востребован как Генерал. Предложив ему пост наместника Хугуана он отказался, потребовав взамен на свою помощь пост Премьер-министра Китая. Больше не осталось времени на переговоры, пора решить.
