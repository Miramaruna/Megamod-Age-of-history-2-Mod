opisaniePUNrim2 = Римские войска достигли Карфагена и уже стучатся в его ворота. Главы Карфагена согласились заключить мир на наших условиях. Мы снова спустили Карфаген с небес на землю, кто бы мог подумать? По условиям мира Карфаген теряет территории в богатой серебром Испанией, а так же ещё некоторую часть своих территорий. Так же у Карфагена отбирается право начинать любые войны без согласования с Сенатом Рима. Карфаген, фактически, становится нашим вассалом.
titlePUNrim22 = Вот и пал Карфаген... Снова.
PUNkrf = Война с Римом
opisaniePUNkrf = В ответ на нашу агрессию в сторону Сагунта, Рим объявил нам войну. Мы ждали этого и чательно готовились. Ганнибал собрал огромную армию в Иберии, а так же договорился с галльскими прелеменами о проходе войск через их земли. Мы вторгнемся в Италию с той стороны, с которой Рим ждать не будет.
