NMF = Меморандум Марокканского Султана
opisanieNMF = Северная Африка в нынешнее время является очагом нестабильности, которая очень сильно влияет на Францию, и Султан Марокко Мухаммед бен Юсуф тоже понимает это. Марокканское общество твёрдо убеждено в том, что Марокко должно стать независимым государством и это желание подогревает политическая элита Марокко. Мухаммед бен Юсуф составил и подготовил пакет меморандумов, которые в своей сути должны сделать Марокко независимым государством с монархической формой правления. Согласны ли мы с такими действиями?
titleNMF1 = Отказать в принятии меморандума и арестовать Султана.
titleNMF2 = Принять требования Султана.
BSM = Берберские Партизаны Марокко
opisanieBSM = Кризис в Магрибе разгорается с новой силой. После ареста Султана Марокко начались постоянные восстания на территории Марокко. Эти восстания организовывают в основном берберы, но есть и те, которые недовольны смещением Султана. В годовщину ареста Султана поднялся огромный бунт, который будет очень трудно устранить. Марокко для французов потерян на долгие годы, может пустим его в свободное плаванье?
titleBSM1 = Возможно, стоит сделать ставку на Султана.
titleBSM2 = Мы можем противостоять разрозненным племенам.
DIM = Испанское Марокко
opisanieDIM = Когда-то у нас были колонии по всему миру, но сейчас остались лишь в Африке, и нас хотят лишьть этих колоний. Марокко получило независимость и яро претендует на территории, занимаемые нами в Африке. Испанская Сахара, Ифни, Испанское Марокко - все эти территории оспаривает новообразованное государство. На нас так же давит и ООН, требуя осдать хотя бы Северную часть наших колоний. С другой стороны, если мы отдадим эту часть, то у нас останутся Сеута, Мелилья и другие заморские провинции, которые в нашем законодательстве не являются колониями.
titleDIM1 = Стоит уступить часть территорий.
titleDIM2 = Что нам мнение ООН?
DIM2 = Война Ифни
opisanieDIM2 = Марокко смела напасть на наши заморские провинции в Африке. Свои действия они объясняют прибытием в Ифни Испанского Легиона, которая была выслана в Африку для подавления политических выступлений. Война не была объявлена, так что пока что это лишь пограничный конфликт.
titleDIM21 = Очередная колониальная заварушка...
DIM3 = Осада Ифни
opisanieDIM3 = Марокканские войска, используя численное приемущество, вытеснили испанские гарнизоны из окрестностей Сиди-Ифни и начали осаду города. Город был отрезан от основных частей испанской армии и оборонялся лишь гарнизоном, но осода оказалась бескровной, марокканцы посчитали город неприступным и переключились на другие театры боевых действий.
titleDIM3 = Стервятники!
DIM4 = Атака Эль-Аюне
opisanieDIM4 = Эль-Аюне - крупнейший город Западной Сахары. Он подвергся атаке марокканской армии. Атака не удалась, и марокканцы были вынуждены отступить на юго-восток. Военные победы Испании не оспоримы!
titleDIM4 = Стервятники!
DIM5 = Испано-Марокканские Соглашения
opisanieDIM5 = Военная кампания в Африке завершена, Испания при поддержке Франции смогла разбить превосходящие силы противника, но военные победы не идут в счёт дипломатических, так что между Испанией и Марокко был заключён договор, который передал во владения Марокко Мыс Хуби, но при этом Испания сохранила Ифни. Но пока что Марокко не снимает своих претензийс Западной Сахары и Ифни.
titleDIM5 = Конец конфликтам.
DIM6 = Передача Ифни
opisanieDIM6 = Испано-Марокканские отношения с момента независимости Марокко были очень напряжёнными. Реакционные круги Марокко грезят о Великом Марокко, а наше присутствие в Африке совершенно не сходится с этой идеей. Марокко требует передать Ифни, принадлежащее пока что Испании. Грубо.
titleDIM61 = Мы согласны на передачу.
titleDIM62 = Ифни наше!
DIM7 = Мадридские Соглашения
opisanieDIM7 = Испания не может больше держать заморские провинции. С целью избавиться от самой крупной - Западной Сахары, в Мадрид прибыли представители Марокко и Мавритании. Были достигнуты соглашения, по которым бывшая колония делилась между Марокко и Мавританией. Теперь Испания сможет избежать кризисов!
titleDIM7 = Мадридский сговор.
DIM8 = Независимость Экваториальной Гвинеи
opisanieDIM8 = Последние заморские провинции объявляют независимость от метрополии. С этим мы уже ничего не поделаем.
titleDIM8 = Хорошо.
RNA = Ратификация Декларации Независимости Австрии
opisanieRNA = За годы оккупации Автрия была полностью избавлена от влияния нацизма. Печальный опыт объединения Германии подсказывает нам, что Австрия должна избежать подобной учести и быть единой. Все наши партнёры уже ратифицировали Декларацию Независимости Австрии. Наша очередь.
titleRNA = Справедливо.
SOM = Независимость Сомали
opisanieSOM = По решению ООН Сомали должно было стать независимым государством. Проблема была в разделении Сомали на две части - Британскую часть и Итальянскую часть. Со временем мы решили разногласия и проблемы с логистикой. Теперь Сомали может приступать к самостоятельной жизни.
titleSOM = Они так быстро обретают независимость...
SFCD = Что с Сааром?
opisanieSFCD = Саарская область попала под наш протекторат после окончания Второй Мировой войны и должна была стать одной составляющей частью нашей сферой влияния на Германию, но что-то пошло не так и эта затея не совсем получилась. Саарской области пора возвращаться в состав Германии, или нет?
titleSFCD1 = Пускай идёт!
titleSFCD2 = В составе Франции будет лучше.
BKbel = Брюссельская Конференция Круглого Стола
opisanieBKbel = В Брюссель для переговоров прибыли делегаты из Конго от 15 политических партий, а также от местных вождей. Темой переговоров стал вопрос о независимости Конго, который муссировался долгое время. Делегация настаивает на полной независимости Конго, но в вопросе государственного устройства нового государства случился раскол. На одной чаше весов делегаты, предлагающие федеративное государственное устройство, в котором провинции будут обладать широкой автономией. На другой делегаты, которые предлагают унитарное государство. Мы смогли выбить для себя разрешение на военное присутствие в Конго, а также на передвижение в колонии, которые остались внутри Африки. Если мы откажем в праве на независимость этим народам, то, возможно, державы покрупнее заставят нас сделать это.
titleBKbel1 = Мы направим своих представителей в Конго(играть за Конго).
titleBKbel2 = Мы дадим вам независимость, а там уж сами решайте.
titleBKbel3 = Независимое Конго? Ха!
KKdkon = Конголезский Кризис
opisanieKKdkon = Уже с первых дней обретения независимости в Конго начались усугубляться противоречия. Провинции хотят широкую автономию, вплоть до независимости, а в правительстве произашел раскол между президентом и премьер-министром. Провинции Южное Касаи и Катанга объявили о своей независимости и настроены они очень серьёзно.
titleKKdkon1 = Чёрт с ними! Мы забьём их и приструним!
titleKKdkon2 = Мы будем бороться за независимость(Играть за Катангу)!
titleKKdkon3 = Построим монархию в Касаи(Играть за Касаи)!
titleKKdkon4 = Целостность государства? Нам это не интересно.
IVK = Интервенция в Конго
opisanieIVKbel = Сразу же после обретения независимости в Конго вспыхнула гражданская война. Начались белые погромы, в которых страдают огромное количество белокожих жителей Конго. Ситуация обострилась, когда в Бельгию начали прибывать беженцы. Мы в силах попытаться остановить этот беспорядок, но как на это отреагирует ООН? Стоит ли повременить с этим?
titleIVKbel1 = Без интервенции метрополии конгозийцам не выжить.
titleIVKbel2 = Пускай этим вопросом занимается ООН.
opisanieIVKdkon = Бельгийские войска совершили интервенцию в свою бывшую колонию. Объясняется это тем, что Бельгия стремится защитить белое население Конго. Они захватили Матади, а также вторглись через свои колонии в Руанде и Бурунди в город Кабало. Это разделило президента Касавубу и премьер-министра Лумумбу. Патрис Лумумба призвал бороться с интервенцией, которую поддержал Жозеф Касавубу, надеясь на поддержку бельгийцев в подавлении сепаратистов на юге страны.
titleIVKdkon = Общество стремится расколоться ещё сильнее...
KKbel = Конголезский Кризис
opisanieKKbel = Мы отказали Конго в независимости. Они отказали нам в поставках ресурсов. Они напали на наши колониальные военные части. Наши солдаты храбро сражались, но смогли удержать лишь запад страны. Если мы не согласимся на дальнейшее ведение переговоров, то война может растянуться на довольно продолжительное время.
titleKKbel1 = Войне быть!
titleKKbel2 = Ладно, давайте сядем за стол переговоров.
KVdkon = Катангская Война
opisanieKVdkon = В ходе длительных боёв и военных стычек в провинции Катанга, мы смогли одержать победу над сепаратистами, возглавляемыми Моизом Чомбе, и восстановить мир и порядок.
titleKVdkon = Одним очагом сепаратизма меньше.
OVKdkon = Военная Операция в Касаи
opisanieOVKdkon = Провинцию Южное Касаи постигла участь быть центром кровавой войны. Жителям этой провинции, конечно, не позавидуешь, но теперь они хотя бы находятся в составе нашего государства. Больше здесь не будут умирать люди... От войны, разумеется.
titleOVKdkon = Одним очагом сепаратизма меньше.
MKOON60 = Миротворческая Миссия ООН
opisanieMKOON60 = Конголезский кризис с каждой неделей набирает обороты. Таким образом, в конфликт попыталась вмешаться Бельгия, что является нарушением нейтралитета Республики Конго. Многие представители стран-участниц ООН осудили подобные мероприятия. Было принято решение вмешаться в конфликт и остановить кровопролитие. Однако, чтобы перебросить миротворцев ООН нужны огромные мощности, которые есть только у нас. Так что от нас зависит то, насколько успешной окажется миссия ООН в Конго.
titleMKOON601 = ООН призвана рассудить этот конфликт. 
titleMKOON602 = Мы не будем оказывать никакую помощь.
MKOONbel = Вмешательство ООН
opisanieMKOONbel = ООН вмешалось в конфликт в Конго. От нас потребовали вывести войска из Республики Конго, или же нас заставят это сделать.
titleMKOONbel1 = А кому нужна вайна?
titleMKOONbel2 = А кому нужна ООН?
MKOONbel2 = Прекращение Интервенции в Конго
opisanieMKOONbel2 = Миротворческий контингент ООН смог блокировать наши войска в Конго, после чего мы были вынуждены вывести войска. Миротворческая миссия сработала против нас очень хорошо. Для многих бельгийцев вторжение в Конго было бессмысленным, но сейчас эта проблема уже достаточно подогрела общество.
titleMKOONbel3 = Страна недовольна.
MKOONdkon = Миротворческий Контингент ООН
opisanieMKOONdkon = Миротворцы Организации Объединённых Наций смогли часттично урегулировать военные действия между Конго и югом страны, но они не намерены проиявлять поддержку центральному правительству в деле подавления сепаратизма. Многие в правительстве разочаровались в миссии ООН.
titleMKOONdkon = Они не помогут нам? Кому нужно перемирие?
PSSK = Призыв СССР
opisaniePSSK = Премьер-министр Лумумба окончательно разочаровался в миротворческих силах ООН, после того как они отказались помочь центральному правительству в подавлении мятежа на юге страны. Он намерен обратиться за помощью к СССР. Он надеется попросить материальную поддержку, а также выслать военных инструктаров. "Если ООН не хочет решать проблему Конго, то мы сами должны взять на себя такую ответственность" - говорил он в разговоре с правительством. Поддержим ли мы его?
titlePSSK1 = Оружие и финансы - вот что нам нужно(Перейти на сторону Лумумбы)!
titlePSSK2 = Чем СССР лучше ООН(Перейти на сторону Касавубы)?
PSSKsov = Просьба Помощи из Конго
opisaniePSSKsov = Сейчас в Конго идёт гражданская война, сепаратизм силён. Миротворческий контингент ООН и Генеральный Секретарь ООН Даг Хаммаршёльд не намерены подавлять сепаратизм в стране. Разочаровавшись в ООН, премьер-министр Патрис Лумумба обратился к СССР за помощью в техническом и материальном плане. Также он бы хотел видеть военных советников СССР в Конго, чтобы те инструктировали Национальную Армию Конго. Мы можем приобрести нового союзника на Чёрном континенте, если всё выдастся удачно.
titlePSSKsov1 = Нужно поддержать Лумумбу всеми возможными способами!
titlePSSKsov2 = Отправить ограниченную поддержку.
titlePSSKsov3 = Мы откажем им.
PLK = Победа над Касавубой
opisaniePLK = Совместными усилиями и с поддержкой СССР мы смогли противостоять диктаторским замашкам Касавубы и Мобуту. Нам осталось лишь побороть сепаратизм на юге страны, который раскалывает общество Конго на борющиеся части.
titlePLK = Свобода Африке!
KNR = Конголезская Народная Республика
opisanieKNR = 20-й век - век перемен. Конго освободилось от колониального и буржуазного владычества, настал час социализма в Африке! Наши ближайшие союзники помогут нам с этим, но для этого нужно наладить отношения между странами.
titleKNR = Ура социалистическому Конго!
ALdkon = Арест Лумумбы
opisanieALdkon = После того, как Лумумба попытался попросить помощи у СССР, его обвинили в предательстве и работе на советские спецслужбы. Президент Касавуба отстранил его от должности, но это не одобрил парламент. Не взирая на это, Лумумба был арестован и отправлен  к себе домой на домашний арест. Это возмутило партию его сторонников, которые аккумулировались в Стэнвилле, где они провозгласили оппозиционное правительство. Они провозгласили Лумумбу главой правительства, хотя он фактически не может им являться. Его заменяет на своём посту Антуан Гизенга.
titleALdkon = В опале ему самое место!
PVS = Правительство В Стенливилле
opisaniePVS = При поддержке СССР и лояльных премьер-министру сил, Лумумба был выкран из под ареста в Леапольдвилле. Сейчас он направляется в Стенливилль, чтобы возглавить правительство, противостоящее Касавубе. С поддержкой СССР мы освободим Конго от всей западной нечести!
titlePVS = Лумумба будет в Стенливилле вовремя!
UL61 = Убийство Лумумбы
opisanieUL61 = 17 января 1961 года Премьер-министр Патрис Лумумба, а также его соратники Жозеф Окито и Морис Мполо были убиты в Катанге. После изнурительных пыток их расстреляли, после чего уничтожили останки при помощи кислоты; Моиз Чомбе и власти Катанги сбросили вину за их убийство на местных жителей, но многие и не сомневаются, что это убийство совершили сподвижники Чомбе и Касавубы. 13 февраля об этом стало известно широкой зарубежной публике, после чего на центральное правительство Конго посыпались обвинения в военных преступлениях. Правительством в Стэнвилле теперь руководит ближайший соратник Лумумбы Гизенга.
titleUL61dkon = Жестоко, но такова война... и политическая борьба.
titleUL61pvs = Жестокостью наши противники не обделены...
opisanieUL61sov = 17 января 1961 года Премьер-министр Патрис Лумумба, а также его соратники Жозеф Окито и Морис Мполо были убиты в Катанге, мы же узнаём об этом спустя почти месяц. Лумумба и его соратники были жестоко уничтожены сподвижниками Касавубы и Чомбе, вероятно, что в этом замешаны и западные спецслужбы. Резолюции ООН, которые требовали освободить Лумумбу, были проигнорированы центральным правительством Конго. Во многих странах социалистического блока, и даже блока западного, это событие повергло общество в негодование, прошли многочисленные шествия в память борца за независимость Конго. На его место пришел Антуан Гизенга, идейный продолжатель Лумумбы.
titleUL61sov = Будем надеяться, что его не пстигнет та же участь.
opisanieUL61yug = 13 февраля 1961 года мировой общественности стало известно, что месяцем ранее конголезский премьер-министр Патрис Лумумба и его соратники Жозеф Окито и Морис Мполо были убиты сепаратистами Катанги. Их останки растворили в кислоте, после чего сожгли, а эти действия списали на местных жителей. Общество в социалистических и западных странах возмутилось такой жестокости конголезского кризиса, вледствии чего прошло большое количетсво политических шествий, включая и Югославию. Дошло до того, что шествующие разгромили посольство Бельгии в Белграде. Место конголезского лидера оппозиции занял Антуан Гизенга, который является идейным соратником почившего Лумумбы.
titleUL61yug = Печальное событие.
opisanieUL61bel = 13 февраля 1961 года мировой общественности стало известно, что месяцем ранее конголезский премьер-министр Патрис Лумумба и его соратники Жозеф Окито и Морис Мполо были убиты сепаратистами Катанги. Их останки растворили в кислоте, после чего сожгли, а эти действия списали на местных жителей. Бельгийское общество возмутилось тем, что Бельгия участвует в этом жестоком конфликте на стороне сепаратистов, а наши военные инструктора обучают солдат в Катанге. По всей стране прошли массовые шествия против войны в Конго; многие считают, что мы напрямую виноваты в этом убийстве и, возможно, участвовали в совершении убийства.
titleUL61bel = Бельгии придётся осмыслить свою политику.
opisanieUL61usbr = 17 января 1961 года Премьер-министр Патрис Лумумба, а также его соратники Жозеф Окито и Морис Мполо были убиты в Катанге, мы же узнаём об этом спустя почти месяц. Лумумба и его соратники были жестоко убиты сподвижниками Касавубы и Чомбе. Это вызвало глубочайшее международное возмущение, демонстрации и шествия прошли в Лондоне и Нью-Йорке, а также в других странах Запада. Шествия прошли и в социалистических странах. Поговаривают, что в этом замешаны также спецслужбы Бельгии и США, но прямых доказательств пока что ни у кого нет. Новым главой оппозиции Конго стал Антуан Гизенга, сопартиец Лумумбы и его верный соратник.
titleUL61usbr = Жестокий конфликт и жестокие люди.
