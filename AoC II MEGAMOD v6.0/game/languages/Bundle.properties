halhin = Бои на реке Халхин-Голе
opisanieHalkin = Несколько месяцев подряд на монгольско-маньчжурской границе шли военные действия между армией Японии и марионеточного режима Маньчжоу-го с одной стороны, и армиями СССР и Монголии с другой. Приграничные провокации Японии не прошли бесследно, они смогли разжечь военный конфликт. Наша победа кардинально повлияла на геополитическую обстановку в регионе. Мы подписали перемирие с японской стороной, что может привести к подписанию пакта о нейтралитете, который обезопасит нас на востоке.
hal = Эта победа очень важна для нас.
arit = Соглашение Ариты-Крейги
opisanieArit = Великобритания признала наши завоевания в Китае! Это соглашение закрепило над нами право захваченных территорий в Китае, но в то же время мы не должны мешать британцам в их делах в Китае.
arik = Договор есть договор.
vtorjenieV = Германия Наносит Первый Удар!
opisanieVtorjeniyaV = Вооруженные силы Германии начали вторжение на территорию Чехословакии. Германия выбрала путь войны.
