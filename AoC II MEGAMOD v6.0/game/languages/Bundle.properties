minin2 = Ураа дааа!!!!
zemsk = Земский собор
zemsk1 = Уже третий год на Руси нет государя. Самые влиятельные бояре образовали между собой Семибоярщину, которая пыталась выбрать себе Польских и Шведских принцев на трон московский, но в народе Семиборящину никто маломальски не уважал. Обычный люд, дворяне, купцы, большинство в нашем государстве хотело, чтобы на трон взошёл новый, не запятнавший себя сотрудничеством с захватчиками или лжедмитриями... Для этого был созван Земский собор, в котором приняли участие представители всех сословий, которые в ходе более чем одного месяца обсуждений избрали на царствие...                                                                                                                                                                                                                                                                       .
