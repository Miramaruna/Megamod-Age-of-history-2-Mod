ok = Ясно.
anshlusVse = Аншлюс Австрии
opisanieAnshlusVse = Германия присоединила Австрию! Кто бы мог подумать, что немцы начнут объединение? Германия заявила, что присоединение было совершенно легитимным и то, что абсолютное большинство населения высказалась За присоединение.
pyat = Второй Пятилетний План
opisaniePyat = Второй пятилетний план развития народного хозяйства СССР официально был завершён. Мы смогли запустить 4500 новых крупных предприятий, наладить электрификацию, а так же транспортную систему.
