titleAGP = Шакалы! Стервятники!
VMA = Восстание Исламистов
opisanieVMA = В стране идёт борьба между коммунистами и исламистами за власть, а правительство в Кабуле вынуждено бороться со всеми проявлениями этой борьбы. В один прекрасный момент исламисты решили пойти против Кабула, они подняли восстание в отдельных провинциях страны, и мы вынуждены подавить их.
titleVMA = К оружию!
ARA = Апрельская Революция
opisanieARA = Мухаммед Дауд пытался провести реформы в стране, но все они оказались провальными. Борьба разных политических группировок привела к возвышению среди них коммунистов, которые в итоге провели государственный переворот. Президент республики был убит, а страна была провозглашена социалистической. Страна находится на волоске от отгрытого гражданского противостояния исламистов и коммунистов.
titleARA = Афганистан выстоит.
IRA = Переговоры с Исламистами
opisanieIRA = Борьба с исламистами в Афганистане станет непростой задачей для Кабула, ведь они имеют широкую поддержку среди населения страны. Пока что они способны на переговоры и открытое противостояние ещё не началось. У нас есть шанс уговорить их и создать с ними коалиционное правительство.
titleIRA1 = Исламисты представляют большую угрозу для страны.
titleIRA2 = Мы готовы сотрудничать с ними.
NGVA = Пожар Гражданской Войны
opisanieNGVA = Нестабильность в стране тянется с ещё не далёкого 1973 года; сейчас наступила новая точка кипения, новое противостояние. Исламисты объявили джихад правительству Кабула, нам нужно противостоять им. Мы просим правительство СССР поддержать нас, но пока что они молчат. Пожар войны разгорается всё сильнее!
titleNGVA = Когда это закончится?
NGVAS = Война в Афганистане
opisanieNGVAS = Правительство Афганистана просит нашей помощи. Исламисты-моджахеды ведут вооружённую борьбу против просоветского режима в Афганистане и создают большую угрозу для советской Средней Азии. Наркотрафик, опасные идеи, американские дотации - всё это представляет угрозу для СССР. Кабул множество раз просил нас о военной помощи, но пока что мы молчали. Пришло время выразить свою позицию.
titleNGVAS1 = Пора вводить войска.
titleNGVAS2 = Это военная авантюра!
NGVAS2 = Отступление Исламистов
opisanieNGVAS2 = Операция советских войск в Афганистане вынудила отступить моджахедов. Сейчас они попрятались в горах, но скоро грядут новые столкновения, и нам нужно быть наготове!
titleNGVAS21 = Первоначальные успехи.
RSA = Моджахеды Атакуют!
opisanieRSA = Очередной день в Афганистане - очередная военная операция. Моджахеды нападают на наши позиции, нам нужно угомонить их.
titleRSA = К оружию!
VSVA = Вывод Войск из Афганистана
opisanieVSVA = Война в Афганистане лежит тяжким бременем на плечах СССР. С каждым годом общество всё негативнее и негативнее относится к этой операции. Многие страны откровенно называют нас захватчиками и интервентами. В военном плане мы, конечно же, в выйгрыше, но политическая ситуация для нас очень плачевная. Нам нужно либо выводить войска, либе же продолжать дорогую операцию.
titleVSVA1 = Политически мы проиграли...
titleVSVA2 = Военная операция ещё не закончена!
ZOIB = Зона Оккупации Ирана
opisanieZOIB = Иран был поделён между Великобританией и Советским Союзом в недалёком 1941-м году, чтобы тот ненароком не встал на сторону Германии. Сейчас же мы должны вывести войска и освободить Иран от иностранного вмешательства. Великие державы в этом регионе соперничают друг с другом, и если кто-то не согласится оставлять Иран в покое, то вторая сторона поступит также, так что нам нужно не допустить развязывания кризиса на пустом месте.
titleZOIB1 = Мы выводим войска, как и договаривались.
titleZOIB2 = Войска остаются.
ZOIS = Зона Оккупации Ирана
ZOIS2 = Зона Оккупации Ирана
opisanieZOIS = Иран был поделён между Великобританией и Советским Союзом в недалёком 1941-м году, чтобы тот ненароком не встал на сторону Германии. Сейчас же мы должны вывести войска и освободить Иран от иностранного вмешательства. Великие державы в этом регионе соперничают друг с другом, и если кто-то не согласится оставлять Иран в покое, то вторая сторона поступит также, так что нам нужно не допустить развязывания кризиса на пустом месте.
titleZOIS1 = Мы выводим войска, как и договаривались.
titleZOIS2 = Войска остаются.
OON46 = Резолюция Совета Безопасности ООН
opisanieOON46 = 30 января Совет Безопасности принял резолюцию, которая призываает СССР и Иран разрешить спор о нахождении советских войск на территории Ирана. В последующие месяцы в ООН будут приняты ещё пара резолюций, которые также будут касаться советских войск в Иране. Правительство СССР ждёт подписания с Ираном нефтяной концессии, но пока что правительство Ирана затягивает процесс.
titleOON46 = Хорошо.
NSP = Северные Провинции
opisanieNSP = Красная Армия ушла, но сепаратисты в северных регионах всё ещё остались. Видимо, Советский Союз рассчитывает на то, что марионеточные государства смогут выдержать натиск регулярной армии Ирана; возможно, они не так далеко от правды.
titleNSP1 = Нужно вернуть контроль над ними.
titleNSP2 = Эти провинции не важны.
IKus = Советские Войска в Иране
opisanieIKus = Агрессивные действия советского правительства в Иране не смог остановить никто, в том числе международное давление ООН. Многочисленные жалобы в ООН не смогли остановить экспансию советских интересов в Иране. Получается, что СССР действует из империалистических побуждений?
titleIKus = Советская империя...
ISR = Иранская Народная Республика
opisanieISR = Северный Иран остался под советской оккупацией, мировая общественность негативно отреагировала на наши действия, но сейчас, кажется, всё устаканилось. Мы не допустили распространение у южных границ западного антисоветского блока, так что время подумать, что же делать с Северным Ираном.
titleISR1 = Создать просоветский режим.
titleISR2 = Оставить в составе СССР.
NNI = Национализация Нефти
opisanieNNI = Иран находится в тяжком положении. В стране происходят бурные протесты из-за нефтяной кампании британцев, которая высасывает из страны все нефтяные соки. Премьер-министр был убит после публичного отказа от национализации нефти, Меджлис разделён на сторонников Моссадыка и Шаха Ирана. Принятие решений стало очень опасным действием, так что нужно решить их с умом...
titleNNI1 = Нефть должна принадлежать Ирану.
titleNNI2 = Не нужно ворошить пчелиный улей.
NPI = Нефтяной Переворот
opisanieNPI = Прошло некоторое время после национализации нефти Ирана, за это время на Иран были наложены всяческие санкции и запреты, которые сильно ударили по экономике страны. В конечном итоге Шах в сговоре с лояльными себе силами устроили государственный переворот, после чего национализация нефти была отменена и всё вернулось на круги своя. Нефть снова была распределена между зарубежными компаниями, экономика Ирана трещит по швам.
titleNPI = Шах, вы навредили Ирану!
SRI = Социалистическая Революция.
opisanieSRI = Иран находится в состоянии политического и экономического кризиса. Постоянно идут забастовки на малочисленных предприятиях, нефтяные ресурсы полностью принадлежат зарубежным команиям и доход в казну Ирана не приносят, в тяжёлом положении находится и многие социальные слои. Народная партия Ирана уже долгие месяцы проводит митинги со своими сторонниками, которые в последнее время приняли общенациональный характер. Сила уличных демонстраций вынудила Шаха, пускай и с борьбой, отдать власть в руки НПИ. Произошла социалистическая революция в Иране.
titleSRI = Долой Пехлеви! Да здравствует социализм!
IRI = Исламская Революция
opisanieIRI = Недовольство населения Ирана политикой правления Шаха, притеснения со стороны государства религиозных шиитов и высылка аятоллы Рухоллы Хомейни из страны, трудное социально-экономическое положение в стране - всё это стало точкой кипения для монархического Ирана. В стране произошла Исламская революция, положившая начало для становления первой исламской республики. Исламский мир, в частности Саудовская Аравия, выразил озабоченность к происходящему в Иране, но что они могут сделать с выбором народа?
titleIRI = Долой Пехлеви! Да здравствует Республика!
GPY = Государственный Переворот в Йемене
opisanieGPY = Йеменское королевство постиг кризис, который привёл к попытке государственного переворота со стороны военщины. Страна разделилась на два лагеря: лоялисты монархии и республиканцы. Какой лагерь выбрать нам?
titleGPY1 = Перейти на сторону республиканцев.
titleGPY2 = Остаться с монархистами.
KGVY = Конец Гражданской Войны
opisanieKGVY = По прошествии долголетнего противостояния две стороны конфликта сумели достигнуть договорённостей и закончить гражданскую войну в Йемене.
titleKGVY = Договорённости... Фух!
UYBR = Южный Йемен
opisanieUYBR = Многие арабские страны находятся под управлением Великобритании долгие годы. Но настаёт время, когда нам нужно избавить себя от бремени колониальных владений...
titleUYBR1 = Они могут быть свободными.
titleUYBR2 = Британия не может лишиться колоний.
NOAE = Объединённые Арабские Эмираты
opisanieNOAE = Многие арабские страны находятся под управлением Великобритании долгие годы. Но настаёт время, когда нам нужно избавить себя от бремени колониальных владений...
titleNOAE1 =  Они могут быть свободными.
titleNOAE2 = Британия не может лишиться колоний.
NKBR = Независимость Кувейта
opisanieNKBR = Многие арабские страны находятся под управлением Великобритании долгие годы. Но настаёт время, когда нам нужно избавить себя от бремени колониальных владений...
titleNKBR1 = Они могут быть свободными.
titleNKBR2 = Британия не может лишиться колоний.
NBBR = Независимость Бахрейна
opisanieNBBR = Многие арабские страны находятся под управлением Великобритании долгие годы. Но настаёт время, когда нам нужно избавить себя от бремени колониальных владений...
titleNBBR1 = Они могут быть свободными.
titleNBBR2 = Британия не может лишиться колоний.
NKAT = Независимость Катара
opisanieNKAT = Многие арабские страны находятся под управлением Великобритании долгие годы. Но настаёт время, когда нам нужно избавить себя от бремени колониальных владений...
titleNKAT1 = Они могут быть свободными.
titleNKAT2 = Британия не может лишиться колоний.
NMbr = Независимость Малави
opisanieNMbr = Деколонизация Африки - процесс долгий. Сегодня на повестке дня вопрос о независимости Малави. ООН и мировая общественность ждут от нас правильных решений!
titleNMbr1 = Их право - выбирать.
titleNMbr2 = Наше право выше их.
KSC = Копипаста с Чапаевщины
opisanieKSC = А то, что до Фиделя и товарища Че Куба была столицей проституции и наркоты, слыла излюбленным местом отдыха у зажиточных американцев, т.е. по факту, была курортной зоной, где большая часть всего принадлежало либо американцам, либо их компаниям. То что американцы несколько раз после Кубинской революции безуспешно пытались высадится и силой подавить бывшую непокорную по факту колонию сша эт не? Они не фашисты?
titleKSC = чАПАЕВЩИНА ПОДПИСЫВАЕМЯ!!!!!
BrKam = Британский Камерун и Плебисцит
opisanieBrKam = Деколонизация идёт полным ходом и давление ООН на колониальные державы становится сильнее с каждым годом. Проблема Южного Камеруна стоит перед правительством Великобритании достаточно давно, но теперь эта колония является подмандатной территорией ООН и мы должны освободить её от нашего управления. В Южном Камеруне проживают англоговорящие народы, которые не хотят интегрироваться в соседние государства, как этого хочет ООН, а хотят создать своё независимое государство. Мы должны провести плебисцит, в котором жители Южного Камеруна смогут выбрать дальнейшее будущее своей страны. Но вопрос в том, что мы позволим им выбрать.
titleBrKam1 = Плебисцит с выбором между Камеруном и Нигерией.
titleBrKam2 = Плебисцит с выбором между Камеруном и Нигерией, и независимостью.
BrKam2 = Британский Камерун и Плебисцит 
titleBrKam21 = Плебисцита не будет, мы передадим их Нигерии.
titleBrKam22 = Плебисцит с выбором между Нигерией и независимостью.
FRKkam = Федеративная Республика Камерун
opisanieFRKkam = Мы возвращаем свои старые земли! Британский Камерун вновь стал частью нашей страны, что не может не радовать. Мы воспринимаем это как подарок Великобритании, хоть этим и недовольно население Британского Камеруна. Но чтобы это воссоединение смогло состояться, мы были вынуждены принять новую конституцию, которая преобразовывает нашу унитарную республику в федерацию, но мы сможем это пережить.
titleFRKkam = Хорошо получилось.
NYK = Нигерийский Камерун
opisanieNYK = Плебисцит, проведённый в Южном Камеруне, показал, что население этого региона хочет стать частью Нигерии. У них не было особого выбора, но всё же мы лучше, чем какая-то независимость или автономия в составе Камеруна, верно?
titleNYK = Да.
BrKam3 = Независимая Амбазония
opisanieBrKam3 = Жители Южного Камеруна проголосовали за независимость своей страны. Что же, мы не можем им перечить, особенно когда за нами наблюдает ООН.
titleBrKam3 = Ладно, это их право.
NBRB = Колониальные Проблемы
opisanieNBRB = Нынешние бельгийские колонии находятся в странном положении. Они находятся вглуби африканского континента, доступ к ним имеется только по суше, а путь туда пролегает по неспокойной земле нынешнего Конго. Бельгия больше не может контролировать эти территории, наша власть до последнего момента остаётся лишь номинальной. Нам придётся отпустить их в свободное плаванье.
titleNBRB1 = Придётся дать им вольность.
titleNBRB2 = Колонии - мой дом(Играть за Бурунди).
titleNBRB3 = Колонии - мой дом(Играть за Руанду).
NDF = Независимость Джибути
opisanieNDF = Деколонизация Африки - процесс долгий. Сегодня на повестке дня вопрос о независимости Джибути. ООН и мировая общественность ждут от нас правильных решений!
titleNDF1 = Дать им вольность!
titleNDF2 = Они ошибаются.
SRP = Военный Переворот
opisanieSRP = Крч Али Бей насрал в штаны, после чего мы скинули его с крыши. Власть наша кста
titleSRP = Норм.
PNS = Проект Новой Столицы
opisaniePNS = Говорят, что Бразилии следует перенести свою администрацию в другой город, так как старая столица не отвечает современным требованиям. Был разработан проект постройки нового города-столицы, который, правда, обойдётся нам в кругленькую сумму, но явно поднимет престиж нашей страны в Латинской Америке.
titlePNS1 = Хорошая идея!
titlePNS2 = Сколько, сколько? Нет, это слишком дорого.
BNSB = Перенос Столицы
opisanieBNSB = Постройка новой столицы закончена, самое время собирать чемоданы и переносить администрацию туда!
titleBNSB = Да, давай, ура!
JenK = Женевская Конференция 
opisanieJenIF = Сегодня в Женеве собрались представители Французской республики и делегация сепаратистов Вьетнама.
titleJenIF = Интересно.
KBV = Переселенцы с Севера
oKBV = Голод, внезапно охвативший северные земли, вызвал массовое переселение на юг, в том числе и на наши земли. Люди приходят, требуется больше еды, чтобы не наступил голод. Когда их стало слишком много, мы начали прогонять их. Некоторые уходили мирно, но некоторые брались за оружие, чтобы отвоевать себе землю для посевов. Их стало настолько много, что мы уже не справляемся с их натиском. Наш единственный выход - миграция на юг. Нам, скорее всего, будут противостоять местные жители и государства, но это наш единственный шанс на спасение!
tKBV = Нам ничего не остаётся, кроме как переселяться.
KBV2 = Вторжение Дорийцев
oKBV2 = Дорийское вторжение с севера загнало нас в тупик, из которого не так много выходов. Переселяясь, дорийцы опустошают наши земли, грабят города, расхищают хранилища с зерном. Мирные жители в панике бегут к побережью, пытаются уплыть из страны, чтобы не попасть под удары дорийцев. Многие из них от безвыходности берут в руки оружие и присоединяются к общему хаосу. Скорее всего наше государство падёт под ударами дорийцев, так что нам нужно принять окончательное решение.
tKBV21 = Нужно ретироваться!
