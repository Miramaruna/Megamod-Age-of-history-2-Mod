novrus2 = Великая Русь в 6744 году от сотворения Мира в хаосе. Со смертью Мстислава православные братья-князья стали в обиде друг на друга, война стоит на пороге каждого дома. Битва на Калке наглядно показала, что держава не выстоит перед грядущей внешней угрозой без единства и могучего государя. Мелочные стремления мещанских полководцев и жадность бояр погубит страну. Смерть в пепле или единство — без решения этого вопроса нам не удержаться на лице Земли.
