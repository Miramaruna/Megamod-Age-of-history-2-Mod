koalicziyaVN = Коалиция не Собрана!
opisanieKoalicziiVD = Мы смогли зажать Германию в кольцо врагов, загнать её в угол, из которого немного выходов. Германия должна осознавать, что её попытки агрессии выйдут ей боком, а мы выйдем победителями!
opisanieKoalicziiFD = Мы смогли зажать Германию в кольцо врагов, загнать её в угол, из которого немного выходов. Германия должна осознавать, что её попытки агрессии выйдут ей боком, а мы выйдем победителями!
opisanieKoalicziiPD = Германия зажата в кольцо врагов, загнана в угол, из которого немного выходов. Германия должна осознавать, что её попытки агрессии выйдут ей боком, а мы выйдем победителями!
opisanieKoalicziiCD = Мы смогли зажать Германию в кольцо врагов, загнать её в угол, из которого немного выходов. Германия должна осознавать, что её попытки агрессии выйдут ей боком, а мы выйдем победителями!
opisanieKoalicziiVN = Наша коалиция не состоялась в полном составе, но нам хватит и этих сил. Германия должна считаться с нами.
opisanieKoalicziiFN = Наша коалиция не состоялась в полном составе, но нам хватит и этих сил. Германия должна считаться с нами.
opisanieKoalicziiCN = Наша коалиция не состоялась в полном составе, но нам хватит и этих сил, чтобы защитить себя.
