oFRwar = Настало время для очередной войны за наши интересы в колониях. Великобритания не отдаст нам свои земли просто так, нам нужно заставить её сделать это, используя силу, как это и было всегда. Великобритания должна быть смещена с позиции первой морской державы, её флот существует за счёт колоний, которые нам предстоит отнять. В бой!
tFRwar = Вперёд к победам!
BRwar = Английская Коалиция
oBRwar = Настало время для очередной войны за наши интересы в колониях. Франция не отдаст нам свои земли просто так, нам нужно заставить её сделать это, используя силу, как это и было всегда. Если мы сможем победить, то подорвём гегемонию Франции в Европе, что на руку нам и нашим союзникам. В бой!
tBRwar = Вперёд к победам!
PRwar = Пруссия в Войне
oPRwar = Пруссия готова выступить против Австрии и её союзников. Австрийская гегемания в Германии будет прекращена с нашей победой! Смерть или величие!
tPRwar = Вперёд к победам!
AUwar = Австрия в Войне
oAUwar = Пруссия в изоляции, а это значит, что самое время вернуть себе недавно утраченные земли! Над сСилезией вновь установиться власть императора!
tAUwar = Вперёд к победам!
BRwpru = Субсидирование Прусской Армии
oBRwpru = Пруссия - загнанный зверь. Сейчас её теснят Россия и Австрия, имея значительный численный перевес. Если Пруссия проиграет, то Австрия сможет вернуть себе Силезию, потерянную в недавних силезских войнах, что вновь усилит её позиции в Центральной Европе, чего бы нам не хотелось. В добавок Россия имеет планы на Восточную Пруссию, но пока что не ясно, какие.
tBRwpru1 = Это выгодно!
tBRwpru2 = Фридрих слишком распоясался, его нужно утихомирить!
tRUwar = Россия в Войне
oRUwar = Мы вступаем на этап борьбы за наши интересы в Прибалтике. Восточная Пруссия - провинция, которая должна быть занята нами как можно скорее, это позволит нам добиться нового расширения в Прибалтике. За Императрицу и Отечество!
tRUwar = Вперёд к победам!
PRbog = Осада Праги
oPRbog = Быстрый бросок в Богемии застал Австрию врасплох. Прусская армия быстро разгромила силы австрийцев и заняла Прагу. Если мы успеем подойти к Вене, то Австрии ничего не останется, как признать своё поражение.
tPRbog = Дорога на Вену открыта!
RUvprus = Восточная Пруссия
oRUvprus = Сословия Восточной Пруссии присягают на верность российской короне. Главнокомандующий русскими войсками Виллим Виллимович Фермор сыскал славу в этой войне. Под его руководством Россия заняла Восточную Пруссию, наснесла несколько тяжких поражений пруссакам, а теперь может угрожать Бранденбургу - центральным землям Пруссии. Если нам удастся получить Восточную Пруссию по итогам войны, то сможем обменять её на Курляндию и Семигалию у Польши, что усилит наши позиции в Прибалтике.
tRUvprus = Всё для России и Отечества!
PRven = Падение Вены
oPRven = Прусские сапоги шагают по венским улицам, горожане негодуют. Полководческое величие Фридриха теперь явно не будет оспариваться, как это было прежде. Мы вывели главного сухопутного союзника Франции из войны, теперь она не сможет продолжать войну. Скоро придёт время для заключения мирного договора, который не даст нам прироста территориями, но даст понять Европе, что на её арене появился новый мощный игрок!
tPRven = А мы прошлись по Вене маршем...
AUber = Рейд на Берлин
oAUber = Союзные войска вошли на улицы Берлина, Фридриха в городе не оказалось. Видимо, король Пруссии не обременёт таким важным делом как защита столицы от врага, нам это на руку. Сердце Пруссии теперь в наших руках, осталось лишь добить раненного зверя.
tAUber = Берлин взят!
RUpmir = Петербургский Мир
oRUpmir = Пётр III является большим поклонником короля Пруссии Фридриха II. Это и сыграло самую главную роль в его решении закончить войну на подписании Петербургского мирного договора, который лишает Россию всех территориальных приобретений, которые появились в ходе войны. Возможно, это решение не всем покажетс правильным, но это же решение царя.
tRUpmir = Ясно.
FRmir1 = Перемирие
oFRmir1 = Великобритания согласна пойти на уступки и завершить эту войну. Наступает пора перемирия в войне, но мирный договор ещё не заключён.
tFRmir1 = Хорошо.
FRmir2 = Перемирие
oFRmir2 = Великобритания согласна пойти на уступки и завершить эту войну. Наступает пора перемирия в войне, но мирный договор ещё не заключён.
tFRmir2 = Хорошо.
FRmirn = Мирное Соглашение
oFRmirn = Спустя долгие часы переговоров мы смогли придти к окончательному мирному договору. Франция получит обратно территории, которые были потеряны с подписанием Утрехтского мира. Также Франция получит британскую Канаду и семь колоний на севере основных владений Великобритании в Америке, и вместе с тем все острова в Карибском море.
tFRmirn = Лучшее, что могло произойти в этой войне!
BRmir1 = Перемирие
oBRmir1 = Франция согласна пойти на уступки и завершить эту войну. Наступает пора перемирия в войне, но мирный договор ещё не заключён.
tBRmir1 = Хорошо.
BRmir2 = Перемирие
oBRmir2 = Франция согласна пойти на уступки и завершить эту войну. Наступает пора перемирия в войне, но мирный договор ещё не заключён.
tBRmir2 = Хорошо.
BRmirn = Мирное Соглашение
