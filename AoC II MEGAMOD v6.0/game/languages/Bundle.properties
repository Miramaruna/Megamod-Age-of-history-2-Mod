titleAVrim = Хорошо.
AVkap = Союз с Селевкидами
AVkap = Царь Антиох в недавнем времени начал вторжение в Элладу, чем начал войну с Римом. Мы, как верный союзник, можем поддержать Антиоха в этой борьбе
titleAVkap1 = Пора выступить на стороне нашего союзника.
titleAVkap2 = Войны нам не к чему.
PEAVrim = Победа в Элладе
opisaniePEAVrim = Войска Селевкидов и их союзников были разбиты. Мы заключили перемирие с Этолией и Мессенией, и готовим вторжение во владения Селевкидов.
titlePEAVrim = Понятно.
PAVrim = Победа Рима и Союзников
opisaniePAVrim = После победы при Магнесии наших войск, армия Антиоха была разгромлена, а сам Антиох бежал. Мы навязали ему мирный договор, по-которому Селевкид должен был уступить часть территорий, а так же выплатить контрибуцию победителям.
titlePAVrim = Рим снова одержал победу!
PAVsel1 = Аламейский Мир
opisaniePAVsel1 = Антиох потерпел поражение в войне с Римом и теперь наша держава лишается части территорий, а так же вынуждена платить контрибуцию победителям.
titlePAVsel1 = Это печалит.
PAVsel2 = Победа Антиоха в Элладе
opisaniePAVsel2 = Мы смогли успешно завершить кампанию в Греции. Наши цели достигнуты, но мы ещё состоим в войне с Римом. Нам нужно добиться заключения мира с Римом.
titlePAVsel2 = Хорошо.
VOsel = Сабатаж Вассалов
opisanieVOsel = После нашего поражения в войне с Римом, наши вассалы решили покинуть состав нашей державы. Так же это стало возможным после смерти Антиоха III Великого.
titleVOsel = Печально.
PPpar = Парфянское Завоевание Персии
opisaniePPpar = Западная держава Селевкидов сейчас находится в упадке, что может сыграть нам на руку. Мы подготовили армию и уже можем выдвинуться в поход на Селевкидов. Что прикажете?
titlePPpar1 = Пора расширить свои земли!
titlePPpar2 = К чему нам войны?
opisaniePPpar2 = Западная держава Селевкидов сейчас находится в упадке, что может сыграть нам на руку. Мы подготовили армию и уже можем выдвинуться в поход в Мидию. Что прикажете?
PPpar2 = Парфянская Персия
opisaniePPpar2 = После захвата Багдада и некоторых ключевых городов, мы заключили мир с династией Селевкидов. Мы смогли заполучить под свой контроль всю Персию, что не может не радовать.
titlePPpar21 = Хорошо.
IUsel = Маккавейская Война
opisanieIUsel = Царь Антиох IV проводит в Иудее довольно жесткую политику эллинизации. Местному населению это сильно не нравится и это вырвалось в полномасштабное восстание евреев.
titleIUsel = Да как они посмели?
IUsel2 = Независимость Иудеи
opisanieIUsel2 = Войска Иудеи нанесли нашей армии серьёзное поражение, что вынудило нас подписать мир. После этого Иудея обрела независимоть. Наша держава становится всё слабее и слабее.
titleIUsel2 = Возможно, это к лучшему.
IUegi = Маккавейская Война
opisanieIUegi = Жители Иудеи недовольны тем, что мы навязываем им свою культуру. Это недовольство дошло до того, что они подняли восстание за независимость.
titleIUegi = О нет!
IUegi2 = Независимость Иудеи
opisanieIUegi2 = Войска Иудеи нанесли нашей армии серьёзное поражение, что вынудило нас подписать мир. После этого Иудея обрела независимость.
titleIUegi2 = Понятно.
VAarm = Великая Армения
opisanieVAarm = Держава Селевкидов сейчас очень неустойчива, что является хорошим шансом, чтобы вырваться из вассального рабства.
titleVAarm = Ура Великой Армении!
STOarm = Новая Столица Армении
opisanieSTOarm = Наш государь Тигран II возвёл новую столицу нашего царства - Тигранакерт. Государь Армении любит большие и величественные города и Тигранакерт будет олицетворять величие нашего государства.
titleSTOarm = Славься, новая столица Великой Армении!
MAsel = 
opisanieMAsel = 
titleMAsel = 
VSpon = Восстание Савмака
opisanieVSpon = Государь Понта Митридат VI Евпатор является наследником Боспорского Царства, что не сильно радует скифскую аристократию. Один из представителей скифской знати, Савмак, поднял восстание в Боспорском Царстве, однако, его поддержала только западная часть государства, восточная же часть осталась верной Митридату.
titleVSpon = Всякая знать стремится к власти, но в этот раз она её не получит.
VSpon2 = Скифская Знать Захватила Власть
opisanieVSpon2 = Армия аристократии Боспора смогла разбить наши немногочисленные отряды и захватить власть в государстве. 
titleVSpon1 = Мы не можем просто так оставить их.
titleVSpon2 = Ладно, пускай имеют свою независимость!
SBpon = Мятеж Боспора
opisanieSBpon = Перисад V был последним из династии Спартокидов. Он был принуждён отречься от престола и передать власть нашему царю Митридату VI. Однако, местная знать не захотела отдавать власть просто так. Она убила прошлого государя и захватила власть. Нужно что-то предпринять.
titleSBpon1 = Как они смеют?
titleSBpon2 = Пускай живут.
VBbos = Вассалитет Боспора
opisanieVBbos = Перисад V был последним из династии Спартокидов. Он был принуждён отречься от престола и передать власть правителю Понтийского Царства Митридату VI. Местная знать может быть недовольна нашим решением, особенно скифская знать. Мы можем отдать власть местной знати и противиться Понту, или же стать зависимым от него.
titleVBbos1 = Престол уже у понтийского царя.
titleVBbos2 = Знать захватит власть и будет сопротивляться Митридату.
PKpon = Покорение Колхиды
opisaniePKpon = Греческий мир уже давно знаком с Колхидой. Сейчас страна переживает внутреннюю анархию и распад. Многочисленные скиптухии лишь номинально подчиняются колхидскому царю. Мы можем покончить с этим и прекратить анархию на этих землях.
titlePKpon1 = Пора выдвигаться!
titlePKpon2 = Нам нужно уладить другие дела.
PKpon2 = Присоединение Колхиды
opisaniePKpon2 = Наши войска захватили столицу Колхиды. После вступления Митридата в столицу, он объявил себя наследником колхских правителей и персидских сатрапов, тем самым присоединив всю Колхиду.
titlePKpon21 = Эта война принесла свои плоды.
SVpon = Альянс с Вифинией
opisanieSVpon = 
titleSVpon1 = Это выгодное соглашение.
titleSVpon2 = Это соглашение не принесёт пользы, мы откажемся от него.
SPvif = Альянс с Понтом
opisanieSPvif = Понтийский царь Митридат VI предлагает нам союз против Пафлагонии. Нам достанутся внутренние области Пафлагонии, а всё остальное - Понту.
titleSPvif1 = Это выгодное соглашение.
titleSPvif2 = Это соглашение не принесёт пользы, мы откажемся от него.
NSVpon = Альянс Разорван!
opisanieNSVpon = Царь Вифинии посчитал, что ему больше не нужен союз с нами.
titleNSVpon = Будь они неладны!
KTpon = Трон Каппадокии
opisanieKTpon = 
titleKTpon = 
NPper = Наследие Пергама
opisanieNPper = Бездетный царь Пергама Аттал III скончался. Он завещал своё царство Риму, но с этим несогласны некоторые аристократы, а также его незаконнорождённый сын Аристоник. Мы можем поддержать его и не допустить попадание Пергама в руки Рима.
titleNPper1 = Поддержим Аристоника.
titleNPper2 = Этот юнец не имеет прав на трон!
opisanieNPrim = Бездетный царь Пергама Аттал III скончался. Он завещал своё царство Риму, но с этим несогласны некоторые аристократы, а также его незаконнорождённый сын Аристоник. Но Пергам решил выполнить последнюю волю скончавшегося царя, однако, Аристоник поднял восстание в столице. Нужно решать этот вопрост.
titleNPrim = Интересно.
STPpom = Союз с Арменией
opisanieSTPpon = В недавнем времени наш государь Митридат заключил союз с правителем Великой Армении Тиграном. По этому договору покорённая Каппадокия числилась за нами, как и Малая Азия, взамен Армения получит Сирию и часть Малой Азии.
titleSTPpon = Выгодно.
SMAarm = Союз с Митридатом Понтийским
opisanieSMAarm = Наш правитель Тигран хочет заключить союз с правителем Понта Митридатом VI. Согласно этому договору, покорённые города Каппадокии достанутся Понту, как и вся Анатолия. Нам же достанется Сирия, а так же территории на востоке.
titleSMAarm1 = Звучит интересно, стоит заключить данный союз.
titleSMAarm2 = Зачем нам это?
MVpon = Митридатова Война
opisanieMVpon = Вифинский царь Никомед вторгся в наши земли! В этом его поддержал Рим, в чём мы и не сомневались. Они давно пытаются ослабить нас, но у них ничего не выйдет, наш царь Митридат поведёт войско!
titleMVpon = Они поплатятся за содеянное!
MV2rim = Дарданский Мир
opisanieMV2rim = После затяжной войны время заключить мир. Мы требуем от понтийцев выплаты большой контрибуции, а большего нам и не нужно...
titleMV2rim = Война выграна и это главное.
Smau = Плачевная Война на Юге
opisanieSmau = Наша война с династией Сатавахана стала очень тяжелой для нас. Наша армия на юге была разбита и теперь наш противник обладает всей Южной Индией.
titleSmau = Плачевно.
Vmau = Конфликт с Царём Видарбхи
opisanieVmau = Наша война с Видарбхой стала довольно тяжелой для нашей армии. Мы потеряли значительные территории в Центральной Индии из-за плачевной ситуации в рядах наших войск.
titleVmau = Плачевно.
Scho = Новые Соседи
opisanieScho = Рядом с нами в недавнем времени образовалось несколько новых государств. Возможно, стоит наладить с ними отношения.
titleScho = Интересно.
PSshu = Конец Династии Шунги
opisaniePSshu = Последний царь из династии Шунга погиб. На место Шунги пришла династия Канва, теперь члены этой династии управляют нашей империей.
titlePSshu = Всё когда-то кончается. Даже династии...
VKSkit = Великая Китайская Стена
opisanieVKSkit = Набеги кочевников на наши земли стали невыносимы и мы решили отгородить наш двор от них. Постройка этой стены должно спасти нас от бесконечных набегов северных варваров.
titleVKSkit = Это будет выгоднее, чем постоянный грабеж нас.
PIcin = Первая Империя
opisaniePIcin = Объединение Поднебесной было очень сложным деянием для нашего государтсва. Мы смогли победить других правителей, которые так же хотели позариться на титул Императора Поднебесной, но у них ничего не вышло. Наше царство стало первой империей в истории Поднебесной. Её величие будет распростроняться на все граничащие государства.
titlePIcin = Славься династия Цинь!
YScin = Указ о Сожжении Недозволенных Сочинений
opisanieYScin = Император Китая Ши Хуанди построил своё государство на основе легизма. Он считает, что представители конфуцианста являются угрозой для централизованного государства Цинь; был создан указ об изъятии из частного владения конфуцианских сочинений и их скорейшего уничтожения. Вместе с этим указом могут начаться репрессии против конфуцианцев и им сочувствующих. Этот указ сделает нашу власть более прочной. Что прикажите?
titleYScin1 = Подписать указ.
titleYScin2 = Этот указ будет лишним.
ECScin = Претензии на Трон
opisanieECScin = После провозглашения империи многое изменилось. Многие династии потеряли контроль над своими владениями, которые вошли в состав нашего государства. Разумеется, не все довольны таким раскладом и время от времени случаются небольшие восстания, которые мы успешно подавляем. Однако, в этот раз восстание достигло невероятных размеров. Военноначальник Лю Бан решил противостоять нам и собрал довольно большое народное ополчение. Он направляется на столицу, мы не можем допустить её захвата.
titleECScin = Ужасное ненастье!
IHkit = Империя Хань
opisanieIHkit = Лю Бан со своим войском занял столицу нашего государства и свергнул династию Цинь. Он провозгласил новую империю Хань, которая возвысилась над всем Китаем.
titleIHkit = Новая династия - новая эпоха.
SCcin = Взятие Столицы
opisanieSCcin = Армия нашего царства взяла вражескую столицу. Наш соперник был растерзан своим собственным населением, а его земли вошли в состав нашего великого государства.
titleSCcin = Армия Цинь сильна и непобедима!
NZ = Неизведанные Земли
opisanieNZ = До сей поры мы не смели ходить в пустоши, ибо не известно, чего там можно ожидать. Но время не стоит на месте, пришло время разведать новые земли.
titleNZ = Звучит интересно.
TGtgu = Разделение Народа
opisanieTGtgu = Народы Тупи и Гуарани - родственные друг другу народы. Они веками жили бок о бок, но пришло время перемен. Тупи решили не сидеть на месте, а двигаться на север к Амазонке и к побережью. Мы можем пойти с ними, но устроит ли это всех? Возможно, стоит растаться на время с нашими сородичами и мигрировать на юг, что скажите?
titleTGtgu1 = Куда они - туда и мы!
titleTGtgu2 = Увидимся когда-нибудь ещё!
OPmol = Отделение Персии
opisanieOPmol = После удачного похода на Аббасидский халифат, персидские наместники поняли, что имеют достаточные ресурсы, чтобы жить самостоятельно. Они объявили свои земли независимыми от нашего государства и избрали одного из них в качестве монарха. Мы потеряли значительную часть территорий и ресурсов, награбленных в Багдаде и других городах Аббасидского халифата...
titleOPmol1 = Разрази их гром!
titleOPmol2 = Пусть живут, как жили.
BPMmol = Ближневосточный Поход
opisanieBPMmol = Аббасидский Халифат остаётся последней исламской силой в Персии, которая ещё не подченилась нам. Наместник Персии Хулагу хочет окончательно завоевать этот регион, после чего начать поход в Сирию.
titleBPMmol = Звучит многообещающе.
GHmol = Государство Хулагуидов
opisanieGHmol = После хорошо завершившегося похода на восток, наместник Персии Хулагу принял решение отсоеденить свои владения от нашей империи. Он основал новое государство и династию Хулагуидов, что правят в нём.
titleGHmol1 = Это должно было когда-то случиться(Продолжить игру за Монголию)...
titleGHmol2 = Присоединиться? Ладно(Играть за Хулагуидов).
BPMhul = Продолжение Ближневосточного Похода
opisanieBPMhul = Мы смогли награбить очень много из первой части западной кампании, прежде чем провозгласить наше государство. Мы можем отправить войска в Сирию, чтобы подчинить новые территории, или же выждать более удачного момента.
titleBPMhul1 = Самое время расчехлить наши сабли!
titleBPMhul2 = Наше государство нестабильно, стоит поумерить пыл.
VMegi = Свержение Айюбидов
opisanieVMegi = Наши поражения в Сирии против монголов и крестоносцев дают о себе знать. В Египте был убит султан из Айюбидов, что порадило внутри страны различные группировки, борющиеся за власть. На данный момент мы не контролируем ситуацию в Египте, лишь в Сирии, где терпим поражения...
titleVMegi1 = Как же так вышло(Продолжить игру за Айюбидов)?
titleVMegi2 = Что же, Бахриты очень даже ничего(Играть за Бахритов).
titleVMegi3 = Кутуз из Ануштегинидов - наш выбор(Играть за Ануштегинидов)!
MSegi = Мамлюкский Султанат
opisanieMSanu = Бахриты побеждены и спасаются бегством к своим прошлым хозяивам - Айюбидам. После поражения они снова служат им, возможно, нам стоит добить их.
titleMSanu1 = Что же, нужно добить врага!
titleMSanu2 = Пускай пресмыкаются перед своими хозяивами!
opisanieMSbah = Кутуз побеждён, а это значит, что теперь династия Бахритов теперь возглавляет новое государство - государство Мамлюков! Однако, Айюбиды ещё могут дышать, не самое время ли их добить?
titleMSbah1 = Что же, нужно добить врага!
titleMSbah2 = Пускай живут, как жили.
OCHmol = Обособление Улусов
opisanieOCHmol = На курултае в толине реки Талас правители Улуса Джучи и Чагатай признали друг друга независимыми государями и заключили друг с другом союз против великого хана Монголии, если тот попытается оспорить их независимость. Таким образом они не признали Хубилая новым великим ханом Монголии.
titleOCHmol1 = Негодяи(Продолжить игру за Монголию)!
titleOCHmol2 = Мы долго этого добивались(Играть за Золотую Орду).
titleOCHmol3 = Союз с улусом Джучи обеспечит нам безопасность(Играть за Чагатайский Улус).
NMord = Нападение Великого Хана Монголии
opisanieNMord = Мы ожидали, что великий хан Монголии может не согласиться с нашим отделением, поэтому заключили союз с Чагатайским ханством против великого хана. Вместе мы постоим за свою независимость!
titleNMord = Не зря мы были на курултае.
IUmol = Вопрос Объединения Китая
opisanieIUmol = На юге расположена китайская Империя Сун, которая уже долго сопротивляется нашей экспансии. Великий хан Монголии Хубилай перенял много из культуры Китая, потому теперь он хочет провозгласить себя императором Китая, но это можно сделать только тогда, когда существует только один Китай. Никаких других.
titleUImol = Время добить старого врага!
IUuan = Империя Юань
opisanieIUuan = Империя Сун больше не претендует на Поднебесную, так что мы займём её место. 
titleIUuan = Да здравствует новый Китай!
ZOGA = Американская Зона Оккупации
opisanieZOGA = Соединённые Штаты Америки, по итогам Второй Мировой войны, стали государством-победителем. На этом праве нам досталась часть побеждённой Германии, Южная часть Корейского полуострова, а также Япония. Нам предстоит демилитаризировать Германию и Японию, а также договориться о будущем Кореи, Японии и Германии с Советским Союзом и остальными странами-победительницами.
titleZOGA = Тяжёлые времена.
ZOGB = Британская Зона Оккупации
opisanieZOGB = Великобритания целых 6 лет противостояла сначала Германии, а затем и Японии, и по итогам Второй Мировой войны оказалась победителем. В наших руках судьбы многих стран, включая Германию, Ливию, Сомали и многих других. И хоть одна война закончилась, это не значит, что не наступит новая. На горизонте виднеется новое противостояние, но уже с другим монстром - Советским Союзом. Рано или поздно наступит момент, когда мы возмёмся за штыки и пойдём на новый фронт, но пока что мы можем договориться с противником...
titleZOGB = Тяжёлые времена.
ZOGF = Французская Зона Оккупации
opisanieZOGF = Франция, по итогам Второй Мировой войны, оказалась страной-победителем и получила свою собственную зону оккупации. Французское руководство больше не хочет видеть Германского Рейха, потому в своей зоне оккупации оно ведёт крайне антинемецкую политику. Франция хочет ещё сильнее раздробить Германию и возродить старые германские государства. У наших союзников противоположное мнение насчёт будущего Германии и нам придётся считаться с этим, или идти наперекор с их картиной будущего Германии.
titleZOGF = Тяжёлые времена.
ZOGS = Советская Зона Оккупации
opisanieZOGS = Отгремели последние залпы орудий под Берлином, союзные войска встретились на Эльбе. Советский Союз сильнее всех пострадал в этой войне, но в конце концов мы оказались победителем. Германия оказалась слишком опасной, чтобы дать ей второй шанс, так что мы поступили иначе. В наших руках не только судьба Германии, но и Кореи, а также всей Восточной Европы. В наши планы входит создать объединённую Германию, которая не будет вступать ни в какие альянсы и союзы, такая же позиция и по другим разделённым странам. Однако наши западные партнёры иного мнения. Нам придётся наладить диалог с Западом, если мы не хотим допустить новой, ещё более кровопролитной войны в мире.
titleZOGS = Тяжёлые времена.
JAOP = Японское Оккупационное Правительство
opisanieJAOP = Император Японии сдался врагу. Теперь страной руководит военное правительство, которое унижает Японию. Народ Японии никогда не забудет и не простит такого.
titleJAOP = Как же?... Император...
PSK = Правительство Северной Кореи
opisaniePSK = Оккупация Японии длилась очень долгое время, что порадило очень много проблем в переходном периоде Кореи. Но вот Япония повержена и у Кореи появляется шанс развиваться своим собственным путём. Но какое-то время нам предстоит быть марионетками в руках сильных держав.
titlePSK = Будем надеяться на лушее.
PYK = Правительство Южной Кореи
SAAR = Саарская Область
opisanieSAAR = Германский Рейх пал в тотальной войне, теперь судьба немцев зависит от четырёх государств-победителей. Нам остаётся только ждать и надеяться в лучшее.
titleSAAR = Новая Германия...
SRR = Социалистическая Республика Румыния
opisanieSRR = Товарищ Гро́за последний год вёл наше страну к светлому социалистическому будущему и наконец привёл. За прошедший год мы смогли побороть всех политических аппонентов, а Кароль II был вынужден покинуть Румынию, видимо, навсегда. Да здравствует Социалистическая Республика Румыния!
titleSRR = Победа социализма в отдельно взятом королевстве.
KRV = Недовольства Населения и Кароль II
opisanieKRV = Последние решения правительства плохо сказались на настроении населения страны. Видимо, путь социализма, к которому нас ведёт Петру Гроза, не подуше некоторым слоям населения. Пользуясь ситуацией, подпольные группировки начали агитировать людей брать оружие и идти свергать просоветский режим. Их поддержал король Румынии Кароль II. Складывается ситуация, напоминающая начало гражданской войны.
titleKRV1 = Пора восстановить монархию! Снова!
titleKRV2 = Куда?! Вернитесь обратно, мы строим социализм!
PSR = Победа Социалистов
opisaniePSR = Правительственные войска подавили мятеж роялистов, порядок в стране восстановлен!
titlePSR = Ура трудовому народу!
PMR = Победа Монархистов
opisaniePMR = Роялисты одолели коммунистическое правительство. В Румынию возвращается монархия!
titlePMR = Ура королю!
VPCS = Выборы 1946 Года
opisanieVPCS = Настало время парламентских выборов в Чехословакии. На выборах есть две основных силы: коммунисты и антикоммунисты. Обе стороны представляют из себя подобие тех двух политических миров, которые сложились после Второй Мировой войны, соответственно Восточный социалистический блок и Западный капиталистический. Выбрав один из них, Чехословакия непременно станет стороной конфликта двух сверхдержав - СССР и США. Выбрать путь нейтралитета мы сможем, возможно, позже, но не сейчас. Итак, выборы выйграли...
titleVPCS1 = Демократический Блок Чехословакии
titleVPCS2 = Коммунистическая Партия Чехословакии
CSR = Чехословацкая Социалистическая Республика
opisanieCSR = После смерти Бенеша правый блок в парламенте перестал быть опасностью для нас, что в итоге привело к отставке народных депутатов. Протестная активность коммунистов привела к отставке Бенеша, его место занял Клемент Готвальд из КПЧ. Обладая абсолютным большинством в парламенте, Готвальд объявил "Победный февраль" и об направлении к установлению социалистической модели экономики страны. Готвальд является закоренелым сталинистом, что не может не быть по душе сталинскому правительству СССР. Отношения между Чехословакией и СССР из-за этого улучшились и они уже готовы считать нас своими союзниками. 
titleCSR = Ура трудовому народу!
TCR = Третья Чехословацкая Республика
opisanieTCR = Коммунисты были загнаны в угол после нашей победы на выборах в парламент! Своими забастовками они только давали нам предлоги для введения всё больших ограничений на уличные собрания, что в итоге привело к аресту лидеров КПЧ и судебному процессу. Наши отношения с СССР сильно ухудшились, что проявилось в отказе в дальнейшем сотрудничестве между нашими странами. На фоне этого более ярко заиграла красками идея сближения с США и Западом в целом. Одноко внутри страны по большей части сильны нейтралистические настроения, что нужно учитывать, если мы собираемся присоединиться к западному блоку.
titleTCR = Коммунисты должны быть уничтожены.
SPB = Смерть Бенеша
opisanieSPB = 3 сентября 1948 года в возрасте 64 лет скончался президент Чехословакии Эдвард Бенеш. Бенеш был самым популярным политиком в Чехословакии, его заслуги перед Отечеством были высоки. Сочувствуя демократическим силам, Бенеш не ввязывался в борьбу их с коммунистами, из-за чего не нравился ни тем, ни другим. Его идеи о "славянской республике, мостом между демократическим Западом и славянским Востоком" достаточно популярны в чехословацком обществе, но им, скорее всего, не суждено будет сбыться. Эдвард Бенеш был похоронен в городе Сезимово-Усти, в своей вилле.
titleSPB = Печальные события.
NPCS = Новое Правительство
opisanieNPCS = После смерти Бенеша были проведены досрочные выборы, на которых победил бывший премьер-министр страны Ян Шрамек. Шрамек не является прожжённым антикоммунистом, но он понимает, какую опасность может представлять эта идеология, поэтому его действия будут направлены на сближение с западными странами. Вероятно, Советский Союз будет недоволен этим, но иного пути у Чехословакии нет; новое правительство нацелено на ухудшение отношений с СССР.
titleNPCS = Они ведут нас к свету!
NATOcs = Чехословакия и НАТО
opisanieNATOcs = Демократические силы Чехословакии окончательно решили втянуть Чехословакию в конфликт Запада и Востока, вступив в НАТО, предложение из которой уже поступило. Если мы совершим это действие, то мы окончательно порвём все связи с СССР и социалистическими странами Восточной Европы. Стоит ли?
titleNATOcs1 =  Так будет безопасней.
titleNATOcs2 = Мы только разозлим СССР.
NCS = Нейтралитет Чехословакии
opisanieNCS = В Европе окончательно образовались два политических блока, которые нетерпеливо ждут, как кто-нибудь из них анесёт удар первым. Чехословакии в этом смысле не повезло, ведь мы, возможно, станем полем боя для этих двух титанов. Однако Движение неприсоединения даёт нам возможность сотрудничать со всеми, в независимости от их политических доктрин.
titleNCS = Чехословакия меж двух огней.
PUpol = Беспорядки в Познани
opisaniePUpol = Рабочие Познани вышли на протестные акции из-за низких зарплат и трудной экономической ситуации в стране. Многотысячная толпа собралась в центре города, вскоре начались и беспорядки. Мы были вынуждены задействовать армию для подавления протестов. Беспорядки привели к смертям людей, в том числе к смертям полицейских. Многие были ранены, а зачинщики были арестованы и уже ждут свою меру наказания.
titlePUpol = Танки на площади? Не в первый раз!
POKT = Польский Октябрь
opisaniPOKT = Из-за громких протестов народа в конце октября, Польша оказалась на грани силового решения проблемы со стороны Советского Союза. Однако до драки дело не дошло, Польша ограничилась сменой партийно-государственного руководства и значительной либерализации режима. Советское вторжение было так близко...
titlePOKT = Десталинизация!
pol = Десоветизация Польши
DPNRopisanieDPNRpol = В Восточной Европе происходит значительная демократизация, разрешаются не коммунистические партии и некоторые даже выигрывают выборы... Так произашло в Польше. Из-за всенародных протестов поднялась популярность оппозиционных партий, что в итоге привело к их победе на выборах. Польша намеренна выйти из блока ОВД, что радостно приветствует товарищ Берия. Польша пришла к либерализму и демократии.
titleDPNRpol = Ура демократия!
DVsssr = Дело Врачей-Вредителей
opisanieDVsssr = В 1948 году умирает Андрей Жданов и умирает он от сердечного приступа. Его лечащий врач сообщала в ЦК о неправильных методах лечения партийного деятеля, что теперь может быть использовано нами в фабрикации уголовных дел против кремлёвских врачей, мол, сегодня эти вредители убили Жданова, а завтра что, Сталина? Товарищ Сталин считает, что существует сионистский заговор в кругах партии, и что лучше упредить этот заговор.
titleDVsssr1 = Начать процесс.
titleDVsssr2 = Да это же теории заговоров!
EAK = Еврейский Антифашистский Комитет
opisanieEAK = Еврейский Антифашистский Комитет был создан в годы войны для продвижения интересов СССР за рубежом. Товарищ Сталин воспринимал его как инструмент пропаганды за рубежом, но в последнее время этот "инструмент" ведёт себя слишком вольно. Члены комитета вовлекаются в документирование событий Холокоста, хотя наша политика направлена на представление преступлений фашистов над всеми гражданами СССР, а не только евреях. Мы уже прибегали в отношении ЕАК к жестоким методам во второй половине 1940-х, что мешает нам сделать тоже самое?
titleEAK1 = Всех к стенке!
titleEAK2 = Это будет ошибочным решением.
USM = Борьба с Еврейским Заговором
opisanieUSM = Министр государственной безопасности СССР Виктор Абакумов уже регулярно сообщает нам о контактах дочери Сталина с Исааком Гольдштейном. По утверждению Абакумова, Гольдштейн был подослан Соломоном Михоэлсом с целью сбора личной информации, чтобы потом передать её в американскую разведку. Абакумов уже совершил арест Гольдштейна, после чего он был допрошен. Гольдштейн дал показания против Михоэлса, а значит мы можем с ним расправиться. Смертную казнь мы отменили, но Михоэлс всегда может, например, случайно попасть под грузовик...
titleUSM1 = Поручите это Абакумову и Берии.
titleUSM2 = Не городите чушь!
LDsssr = Ленинградское Дело
opisanieLDsssr = После войны многие ленинградцы стали видными деятелями ЦК и правительства СССР, что несколько обострило обстановку внутри партии. Недавно нам стало известно о разговорах, которые ведутся в кабинетах секретарей ЦК А. А. Жданова и А. А. Кузнецова, о создании Российской Коммунистической Партии болшевиков, на подобии других национальных республиканских партий. Эта партия, видимо, должна взять на себя часть обязательств ЦК ВКП(б), что, как посчитал товарищ Сталин, недопустимо. Возможно, следует пройтись по руководящей верхушке Ленинграда, чтобы подобных эксцессов больше не повторялось.
titleLDsssr1 = Поручите Берии зачистить Ленинград.
titleLDsssr2 = Эти опасения напрасны.
SSTALsssr = Смерть Сталина
opisanieSSTAL = 5 марта 1953 года на "Ближней даче" скончался Иосиф Виссарионович Сталин, фактический глава нашей страны. Умер он от кровоизлеяния в мозг, врачи не смогли ему как-то помочь. Он будет похоронен со всеми почестями.
titleSSTAL = Трагедия!
SSTALsssr2 = Смерть Сталина
opisanieSSTAL2 = 5 марта 1960 года на "Ближней даче" скончался Иосиф Виссарионович Сталин, фактический глава нашей страны. Умер он от кровоизлеяния в мозг, врачи не смогли ему как-то помочь. Он будет похоронен со всеми почестями.
titleSSTAL2 = Трагедия!
SSTALsssr3 = Со Сталиным Всё Хорошо
opisanieSSTAL3 = Сегодня товарищ Берия приезжал к товарищу Сталину. Вместе они что-то обсудили, после чего Берия был вынужден удалиться. Товарищ Сталин в здравии и сильном духе, как всегда!
titleSSTALsssr3 = Рад слышать!
STALshiz = Заговор в Кремле
opisanieSTALshiz = Товарищу Сталину вновь кажется, что в партию пробрались враги. Он уже давно подозревает многих видных партийных деятелей в предательстве и заговоре, но пока что это лишь подозрения. Мы можем поручить расследование этого заговора нашим ближайшим соратникам в НГБ, но не являются ли они все предателями?
titleSTALshiz1 = Нужно искать заговорщиков! Все под подозрением!
titleSTALshiz2 = Брехня! Мы вычистили всех ещё в 1939-ом!
STALshiz2 = Первые Заговорщики Найдены!
opisanieSTALshiz2 = НГБ нашла часть заговорщиков в ЦК партии. Под давлением фактов они раскрыли другие имена, которые причастны к заговору против товарища Сталина. Это многие высокопоставленные работники партии и других государственных органов. В числе них есть и люди, которых мы считали активными сторонниками Сталина. Сейчас в стране ведётся разработка ракет, позволяющих выйти на земную арбиту. Мы должны запустить первое живое существо раньше, чем это сделают американцы, и предатели могут помочь нам в этом.
titleSTALshiz21 = Нет! Расстрелять!
titleSTALshiz22 = Их наказание будет другим...
STALshiz3 = Первые Полёты
opisanieSTALshiz3 = Первые испытания советских ракет прошли не совсем гладко. Мы пытались запустить наших политических оппонентов в космос, но многие из них разбились при старте или в ходе полёта. Что же, благодаря их жертве теперь мы знаем о недостатках нашей конструкции и исправим их. Но не стоит расстраиваться, ведь у нас остались ещё предатели партии!
titleSTALshiz3 = Плохо, но хорошо.
STALshiz4 = Первое Живое Существо в Космосе!
