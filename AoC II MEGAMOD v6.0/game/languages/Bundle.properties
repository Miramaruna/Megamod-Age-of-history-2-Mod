UNIRESULT2GPW = Мы оставим её себе.
UNITITLE2GPW = Великобритания во Второй мировой войне
UNIDESC2GPW = После капитуляции Франции, единственного союзника позволявшего воевать на суше, создавалась иллюзия, что мы совсем одни в бою с гигантами Германии и Италии. Сейчас же мы имеем в союзниках правительство Де Голля, США и Советский Союз. Мы должны победить в этой войне.
