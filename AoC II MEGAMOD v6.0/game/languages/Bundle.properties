VosiV = Подать заявку!
koalicziya = Антигерманская Коалиция
opisanieKoaliczii = Германия может быть окружена врагами, что сделает её агрессивную политику несостоятельной, мы сможем достичь мира в Европе, но для этого нам нужен союзник в виде Польши. Нужно организовать встречу в Лондоне.
