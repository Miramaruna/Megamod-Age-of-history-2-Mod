titleSPK1 = Они очень нам помогут.
titleSPK2 = Кому они нужны?
TMK = Теократическое Конго
opisanieTMK = Коммунизм в Конго является достаточно зонтичной идеологией, именно поэтому мы смогли выйграть в этой войне. Многие военные шли в бой с верой в высшие силы и почти все проводили ритуалы перед боем. Сформировалась целая религия, которая всё набирает и набирает обороты. Многие военные поддерживают религиозных деятелей и многие хотели бы, чтобы религиозный глава был главой государства. Разве мы можем перечить тем, кто является нашей опрой?
titleTMK = Выбор был сделан.
TMK2 = Старые Традиции
opisanieTMK2 = Религия, благодаря которой мы победили в войне, основывается на вере в наших предков. Большинство населения было давно христианизировано иезуитами и колонистами из Европы, но если мы и вправду желаем стать независимыми, нам необходимо вернуться к нашим корням. Мы должны вернуться к языку Киконго, позабыв Французский, отринуть Христианство, вернувшись к Фетишизму. Духи наших предков почувствуют своих потомков и дадут нам сил, чтобы мы могли противостоять колонистам!
titleTMK2 = Мы отринули Христа...
SKSS = Новые Участники ОВД
