opisanieOZSsssr = Представители нескольких оставшихся в состеве СССР союзных республик решили собраться в Москве и обсудить дальнейшее существование СССР. Переговоры длились с вечера по утро без перерыва. На встрече было решено расформировать СССР и провозгласить независимость оставшихся республик. Решение было принято единогласно, как таковых возражений не возникло. СССР прекратил своё существование сегодня, наступила новая эпоха либерализации Восточной Европы!
titleOZSsssr1 = Россия - правоприемник СССР!
