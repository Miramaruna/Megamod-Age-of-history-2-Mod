novkn2 = Неокрепший юноша, но грамотный политик и умелый полководец Александр Ярославич орлиными лапами держится за свое княжение в Новгороде. Однажды уже будучи изгнанным  боярами, потомок владимирцев больше не желает уходить с позором. Он хорошо выучил уроки пращуров и чутко следит за еретиками запада и таинственной силой востока. Или князь навсегда устранит угрозу шведов и немцев на западе, или будет смят историей — на все воля Божья.
