opisanieVetki = Руководство Германии приглашает нас на встречу в Годесберге, где будет обсуждаться вопрос Судетской области. Мы уже знаем, что Германия требует эти территории и, скорее всего, они вновь потребуют решить этот вопрос в свою пользу. Наша позиция должна быть тверда и ясна.
