koalicziyaG = Коалиция Собрана!
opisanieKoalicziiG = Против Германии была создана коалиция из четырёх государств: Франции, Великобритании, Чехословакии и Польши. Теперь мы окружены кольцом врагов, но разве это нас остановит?
