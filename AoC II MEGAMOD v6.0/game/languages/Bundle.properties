titleRVKM = Ура свободному Конго!
VPKM = Военный Переворот Мобуту
opisanieVPKM = Главнокомандующий войсками Жозеф-Дезире Мобуту имеет очень большое влияние внутри Конго как на граждан, так и на военных. Один раз ему удалось свергнуть Лумумбу, бросив его в опалу, теперь же он принялся за Касавубу. Мобуту совершил бескровный переворот в Конго и объявил себя президентом республики. Мы могли попробовать пойти против него, но наши ближайшие сторонники перешли на его сторону, перешли и мы.
titleVPKM = Всё лучше войны.
USK = Установление Перемирия
opisanieUSK = Восстание Симба оказалось сильнее, чем кто-либо предполагал. Мятежники сумели подчинить себе огромные территории Конго, примерно половину. Этот конфликт мог продолжаться и дальше, но ООН и США сыграли свою роль в перемирии. Президент Конго Касавуба и лидер повстанческого движения Пьер Мулеле в Женеве подписали договор о перемирии друг с другом. По всей видимости, повторяется сценарий разделения Вьетнама, но, может быть, на сей раз противники смогут договориться и прийти к компромиссу.
titleUSK = Ясно.
IUSA = Интервенция В Конго
opisanieIUSA = Конголезский кризис идёт уже несколько лет и никак не хочет заканчиваться. Недавно наши дипломаты посодействовали в том, чтобы остановить кровопролитие. С середины 1964 года в Конго идёт противостояние центрального правительства и повстанцев-коммунистов. Разумеется, распространение коммунизма в Африке является очень нежелательным для нас, а правительство Конго напрямую просит нас о помощи в этом конфликте. Мы можем помочь, но тогда это отнимет у нас огромное количество ресурсов на ведение боевых действий с партизанами. Нужно ли это?
titleIUSA1 = Нельзя допустить распространение коммунизма.
titleIUSA2 = США не нужны лишние конфликты.
IUSAdkon = Помощь США
