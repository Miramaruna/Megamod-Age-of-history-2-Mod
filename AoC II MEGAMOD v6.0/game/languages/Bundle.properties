stolypin2 = Какие бы не были жестокими реформы Столыпина, но нельзя отрицать его огромный вклад в экономическое развитие Российской империи. Столыпин находился в Киевском театре вместе с Николаем II по случаю открытия памятника Александру II. Охрана Царской семьи была осведомлена о планирующемся покушении на высокопоставленного чиновника или самого Царя от секретного осведомителя Дмитрия Богрова, который и был его убийцей. Он во время второго антракта подошёл к Столыпину и дважды выстрелил: первая пуля попала в руку, вторая — в живот, задев печень. После ранения Столыпин перекрестил царя, тяжело опустился в кресло и произнёс: «Счастлив умереть за Царя». По завещанию Столыпина он писал: «Я хочу быть погребённым там, где меня убьют». На Столыпина совершалось множество покушений, но это стало последним.
