rsf4 = Россия не готова к такой войне.
rsf5 = Австро-Венгры, возомнившие, что настал час войны, объявили войну Сербии. Мы, как главный друг Сербии должны вступить в войну на её стороне.
rsf6 = Вместе мы сильнее!
rsf7 = Черногория останется в нейтралитете.
rsf8 = Франция в опасности. Германцы наступают!
rsf9 = Кризис во Франко-Германских отношениях привёл к открытому конфликту - войне. Должны ли мы поддержать нашего союзника?
rsf10 = Помочь Франку.
rsf11 = Россия не готова к такой войне.
rsf12 = Нападение на Сербию
rsf13 = Австро-Венгры, возомнившие, что настал час войны, объявили войну Сербии. Хотя Сербия официально не является нашим союзником, но это нападение можно использовать как повод для войны!
rsf14 = Мы не допустим поражения, как в 1871!
rsf15 = Нужно выждать момента получше.
rsf16 = Нападение на Францию
rsf17 = После объявления войны Германией Франции наши дипломаты пытались восстановить мир считая, что будущее англо-германских отношений напрямую зависит от совместных миротворческих действий. Однако после стало ясно, что австрийцы не пойдут на уступки Сербии. 
rsf18 = Германия разбудила льва!
rsf19 = Британский нейтралитет дороже.
shlfn1 = План Шлиффена
shlfn2 = После нападения Францией на Австрию нам нужен надежный план по как можно скорейшему захвату Франции. В целях достижения этого мы решили использовать План Шлиффена, остается лишь вопрос о проходе войск через Бельгию.
shlfn3 = Мы вторгнемся без промедления!
shlfn4 = Отправьте ультиматум Бельгии.
shlfn5 = Мы пересмотрим план.
shlfn6 = Германский ультиматум
shlfn7 = Германия, воюющая с Францией, требует от нас право прохода войск, чтобы в минимальные сроки захватить Францию. Что мы ответим?
shlfn8 = Нас загнали в угол. 
shlfn9 = Германцы не будут просто гулять у нас во дворе!
shlfn10 = Германский ультиматум, согласие
shlfn11 = Загнанные в угол Бельгийцы согласились предоставить нам право прохода войск.
shlfn12 = Хорошо, что Бельгийцы оказались благоразумнее.
shlfn13 = Германский ультиматум, отказ
shlfn14 = Бельгия решительно отвергла наш ультиматум с требованием права прохода. Теперь проход мы будем прорубать силой.
shlfn15 = Они об этом пожалеют!
rsf21 = Нападение на Австро-Венгрию
rsf22 = Австро-Венгрия - наш надёжный союзник нуждается в помощи. Австрия атаковала Сербию, за которую впоследствии вступилась Россия. Мы уже дали обещание помочь Австрии, но станем ли мы?
rsf23 = Кайзеровский кулак ударит по Медведю!
rsf24 = Германия не готова.
ocpol1 = Оккупация Польши
ocpol2 = После оккупации части Польши мы можем правозгласить создание коллаборационистское Королевство Польское, управляемое нашим генерал-губернатором.
ocpol3 = Помощь нам не помешает.
ocpol4 = Их следует германизировать!
francfer15 = Сараевское убийство
francfer16 = Сегодня в Сараево было совершено убийство наследника австрийского престола Франца Фердинанда. Франц посетил Сараево для "осмотра" новоприобретённой Боснии, но здесь его и поджидали участники террористической организации "Молодая Босния". Первое покушение с использованием гранаты не удалось, но позже его на улицах города встретил Гаврила Принцип, который и убил наследника. Гаврила попытался совершить самоубийство после покушения, но вовремя был схвачен и отправился в тюрьму. В этом покушении явно замешано сербское правительство.
francfer17 = Война неизбежна.
francfer18 = Сегодня на другом конце света в Сараево было совершено убийство наследника австрийского престола Франца Фердинанда. Франц посетил Сараево для "осмотра" новоприобретённой Боснии, но здесь его и поджидали участники террористической организации "Молодая Босния". Первое покушение с использованием гранаты не удалось, но позже его на улицах города встретил Гаврила Принцип, который и убил наследника. Гаврила попытался совершить самоубийство после покушения, но вовремя был схвачен и отправился в тюрьму. В этом покушении явно замешано сербское правительство.
francfer19 = Глупые гайдзины устроили очередную войну.
OTTTITLEGW = Османская империя в Первой мировой войне
OTTDESCGW = После начала Первой мировой войны нам следует заключить секретный союз с одной из сторон, чтобы добиться своей выгоды с войны. Реваншистски настроенная Турция должна вернуть своё прежнее имя - империи.
OTTRESULTGW = Мы встанем на стороне победителей!
ottomanatwar1 = Не стоит забывать о старых союзах.
ottomanatwar2 = Мы объявим нейтралитет.
actsa1 = Акт о Южной Африке
actsa2 = Капская колония ещё с давних пор раздирается внутренними конфликтами в виде Буров и Этническими столкновениями белых и чернокожих. Мы можем сильно помочь им, если предоставим им большую автономию.
actsa3 = Мы предоставим им статус Домининиона.
actsa4 = Они останутся колонией!
actsa5 = Акт о Южной Африке
actsa6 = Великобритания приняла Акт о Южной Африке, по которому наша провинция войдёт в состав новообразованного Южно-Африканского союза. 
actsa7 = Правь, Британия!
itapmw1 = Первая мировая война
itapmw2 = Австрия - наш главный соперник, учавствует в глобальной Первой мировой войне. Мы можем вторгнуться в эту войну ради возвращения своих земель, как Истрия, Тироль и Далмация. Но мы также всё еще можем сохранить Тройственный союз, объявить войну Франции и понадеяться на захват Южных Французских территорий. Чью сторону мы выберем?
itapmw3 = Мы вступим на стороне новых союзников.
itapmw4 = Мы сохраним старый союз.
itapmw5 = Мы будем держать нейтралитет.
itapmw6 = Италия атакует!
itapmw7 = Итальянцы решили, что вместо соблюдения Союзнических обязательств они пойдут в атаку на нас! Но факт того, что фронт находится в горах - идёт в нашу пользу, нужно лишь занять оборону...	
itapmw8 = Мы разрушим их дом - Италию!
thirdfra1 = Третья Французская Республика
thirdfra2 = Третья Французская Республика была правозглашена после Франко-Прусской войны. В этой войне мы проиграли и были вынуждены отдать немцам Эльзас и Лотарингию. В будущем мы должны любой ценой унизить Германию, вернув наши земли и отобрав их колонии, но как скоро настанет это будущее?
thirdfra3 = Да здравствует Франция!
britishemp1 = Британская империя
britishemp2 = Британская империя вечно действовала самостоятельно, но в это время опасения насчёт нарушения Британской гегемонии становятся всё более реальными. Враг, который может побеспокоить нас и весь мир - Германская империя. В любом случае мы должны либо покинуть Антанту, признав будущее доминирование Германии в мире, либо принять бой...
britishemp3 = Способен ли Британский колосс проиграть подобную войну?
auhemp1 = Австро-Венгрия
auhemp2 = После подписания Австро-венгерского соглашения мы обрекли себя на погибель. Великая и независимая Австрийская империя канула в лету, и теперь мы всецело находимся под влиянием Германии. Всем известный факт, что мы одна большая лоскутная империя, и нарастающее напряжение в мире, ставят все За за скорое уничтожение нашей державы. Империя должна провести скорейшие реформы.
auhemp3 = Мы должны укрепить свою империю.
bulgpmw2 = После Второй Балканской войны нас оставили униженными на останках национальных земель Болгарии. Спустя непродолжительное время, Сербия была втянута в Первую мировую войну. Мы можем попробовать помочь в войне и рассчитывать на свои Македонские земли, но этим же разрушим все отношения с Россией - нашей освободительницей...
bulgpmw3 = Нам нужна только Великая Болгария!
bulgpmw4 = Мы продолжим оставаться в нейтралитете.
dominion1 = Вступление в войну
dominion2 = После объявления войны Великобританией Германии, мы, как колония и доминион, должны вступить на стороне нашего сюзерена.
dominion3 = За Короля!
bolgoc1 = Оккупация Сербии
bolgoc1 = После окончательного разгрома Сербии с помощью Болгарии, по всем договорённостям, мы должны передать Македонию и Восточные Сербские земли Болгарии.
bolgoc1 = За наших новых друзей - Болгар!
OTTTITLEGW2 = Вступление в войну
OTTDESCGW2 = После заключения секретного союза, прошло достаточное количество времени, за которое мы смогли подготовиться к вступлению в конфликт. 
OTTRESULTGW2 = Мы извлечем большую выгоду с этой войны!
parisfall1 = Падение Парижа
parisfall2 = Быстрый натиск Германских войск позволил в кратчайшие сроки занять Париж и сломить тамошнее сопротивление. Французское правительство понимало, что город придётся сдать, поэтому заранее переехало в город Брест. Если падёт вторая столица, то Франция полностью капитулирует.
parisfall3 = Мы закончим войну к рождеству!
parisfall4 = Это трудные времена.
parisfall5 = Война изначально была не в нашу пользу. Мы сдаёмся.
brestfall1 = Падение Бреста
brestfall2 = Сдвиг столицы в Брест не спас Французскую Республику. Германские войска заняли город и вынудили правительство признать поражение. Сопротивление всё еще идет в колониях, но надолго ли?
brestfall3 = Французы не умеют воевать!
brestfall4 = Неужели это конец?
franzferz1 = Смерть Франца Иосифа
franzferz2 = Франц Иосиф умер в такое трудное для государства время. После убийства наследника и эрцгерцога Франца Фердинанда новым наследником стал Карл I, который был пятым по счёту претендентом на трон.
franzferz3 = Мементо мори.
franzferz4 = Франц Иосиф умер в такое трудное для государства время. Трон унаследовал Франц Иосиф. Возможно при нём установится мир на Балканах.
versalisalt1 = Версальский мир
versalisalt2 = С падением Бреста пала и Третья Республика. Вся территория Франции находится под оккупацией Германии. Германская сторона охотно ждёт предложения мира, но тем же мы предадим своих союзников и свой народ, ожидающий освобождения в Европе. По нашим ожиданиям Германия потребует от нас большую часть наших колоний, приграничные земли в Европе, признание Эльзас-Лотарингии Германской землёй и большую контрибуцию в 5 миллионов Франков. Мы можем сложить оружие, либо продолжить борьбу на колониальных землях.
versalisalt3 = Не стоит ничего говорить, а только поднять белый флаг...
versalisalt4 = Франция никогда не сдается!
versalisalt5 = После того как все сопротивление Франции было уничтоженно, Французское правительство предложило нам мир. Франция разорвёт все соглашения со всеми странами и союзниками, мы заберём большую часть Африканских колоний, Индокитайские колонии, признают Эльзас-Лотарингию Германской землёй и выплатят большую контрибуцию в 5 миллионов Франков. Мы не можем держать Францию в вечной оккупации, поэтому мы не можем не согласиться.
versalisalt6 = Это триумф над Францией!
prqp1 = Франция предлагает мир
prqp2 = После взятия Парижа, Французское правительство поняло всю безнадежность дальнейшего сопротивления и предложило мир. Франция разорвет все дипломатические соглашения с союзниками, мы получим все приграничные земли, контрибуцию в 2,500,000 Франков и официальное признание Францией Эльзаса-Лотарингии за нами.
frqp3 = Один есть, два осталось...
frqp4 = Мы добьемся лучших условий капитуляции!
itaversal1 = Поражение Франции
itaversal2 = Франция подписала свою капитуляцию перед Германией и прочими союзниками, включая нас, в Версале. Так как мы союзник Германии мы можем претендовать на получение некоторых земель и небольшую контрибуцию.
itaversal3 = Слава Италии! 
rebalance1 = Ребаланс
rebalance2 = Являясь мировой сверхдержавой, искуственный интеллект всё еще способен проиграть Антанте и её союзникам. Так как для игрока это будет слишком легкой игрой, было создано это событие, чтобы уменьшить экономическую мощь Германии.
rebalance3 = Я понял.
whifrance1 = Учреждение нового правительства
whifrance2 = С падением Третьей Республики, и бегства остатков Французского правительства в Африку, мы не получили никакого предложения мира. Мы можем воспользоваться этим и правозгласить подконтролльный нам режим на Юге Франции со столицей в курортом городке - Виши.
whifrance3 = Виши? Мне это знакомо.
whifrance4 = В этом нет необходимости.
bulmacq1 = Болгарский запрос
bulmacq2 = В текущий момент Сербия является нашим вассалом. В связи с этим Болгарское царство запросило у нас передачу земель Македонии в состав Болгарии. Болгария раннее и до сих пор проводила прогерманскую политику, так что наше согласие только усилит наше влияние на Болгарию.
bulmacq3 = Мы поможем Болгарии.
bulmacq4 = Македония останется у Сербии.
bulmacq5 = Македонский вопрос
bulmacq6 = В текущий момент Сербия является вассалом Австро-Венгрии. Раннее мы проводили прогерманскую политику, отчего, возможно, можем рассчитывать на передачу нам всей Македонии.
bulmacq7 = Центральные державы должны нам помочь.
bulmacq8 = Не будем подавать вида.
razvalah1 = Развал Австро-Венгрии
razvalah2 = Провалы нашей внешней и внутренней политики привели к масштабным потрясениям внутри империи, и, как следствие, привело к отсоединению всех национальных меньшинств из нашей империи.
razvalah3 = Посмотрим.
vossta1 = Окончание беспорядков
vossta2 = Отказ от признания Сербии главным виновником в убийстве Эрцгерцога поначалу привело к стихийным беспорядкам, но после некоторой экспертизы мы, всё же, объявили войну Сербии.
vossta3 = Пусть он увидит эту бойню с небес!
tripoli1 = Независимость Ливии
tripoli2 = Не желая войны, Османская империя отдала нам нашу независимость, на которую стали посягать Итальянцы. Победа в Итало-Ливийской войне ознаменовала полную способность к ведению самостоятельной политики. Будущее стоит за независимой Триполитанией!
tripoli3 = Независимость или смерть!
idrisl1 = Уния с Триполитанией?
idrisl2 = Получение Триполитанией независимости ознаменовало существование Ливии как независимого государства. Мы, как независимая страна-клан на Юго-Востоке Ливии, можем предложить унию Триполитании и, тем же, уже объединить Ливию под нашим эмиром Мухаммадем Идрисом.
idrisl3 = Отличная идея!
idrisl4 = Мы не пойдём на поводу северных варваров!
idrisl5 = Уния с Сануситами?
idrisl6 = Получение Триполитанией независимости ознаменовало существование Ливии как независимого государства. Независимый антиколониальный клан на Юго-Востоке Ливии предложил нам заключить унию, с целью полного объединения Ливии под их эмиром Мухаммадем Идрисом.
idrisl7 = Божиею поспешествующею милостию, Мы, Идрис, император...
idrisl8 = Ливия не будет монархией!
mahdist21 = Второе восстание Махдистов
mahdist22 = Антиколониально настроенное местное население, до сих пор помнящее победы Махдистского восстания, предложило нам помощь взамен на признание и помощь деньгами. Это сильно ударит по организации войск Британии в Судане.
mahdist23 = Признайте и отправьте им помощь!
mahdist24 = Они потребуются нам в армии.
auger1 = Война из-за Марокко
auger2 = Кризис Франко-германских отношений и нежелание подчиняться Франции Германии, привело к началу военного конфликта. Уже сейчас мы уверены, что союзники Франции точно не останутся в стороне, но чем ответим мы?
auger3 = Мы обязаны своему союзнику.
auger4 = Абсурд!
osowietz1 = Атака мертвецов
osowietz2 = На рассвете с попутным ветром по всему фронту начался выпуск хлора из газобаллонных батарей. Газ в итоге проник на общую глубину до 20 км. Из-за отсутствия каких либо средств защиты, результат атаки оказался сокрушительным, погибло более половины защитников крепости. Но когда Германские войска, думающие, что все защитники погибли, пошли занимать крепость, встретили контратаку отравившихся, но не умерших, русских солдат. Германские войска так и не смогли занять Крепость, а этот момент вошёл в историю, как Атака Мертвецов.
osowietz3 = План Вильгельма обречён...
brusilov1 = Брусиловский прорыв, победа
brusilov2 = Наступательная операция русской армии на Юго-Западном фронте дала неожиданно хорошие результаты. Наши войска сумели обратить в панику отступающие силы австрийцев и немцев, что позволило нам продвинуться значительно глубоко в позиции врага. Нашими силами была занята Волынь, Галиция, а также Трансильвания, что показывает недееспособность австрийской армии, которая уже не может сражаться.
brusilov3 = Победа близка!
usoga1 = Реформирование Австрии
usoga2 = После смерти Франца Иосифа I трон Императора Австро-Венгрии был унаследован Францом Фердинандом, который в 1914 году смог пережить покушение Боснийского сепаратиста. Франц Фердинанд поддерживал идею Аурела Поповича о Соединённых Штатах Великой Австрии, поэтому начал проводить политику рефомирования Австро-Венгрии. Сейчас все реформы готовы, Австрия может вновь переродиться, осталось лишь подписать указ.
usoga3 = Австрия готова к становлению Великой!
usoga4 = Это была неразумная идея. Отвергайте реформу!
guaalb1 = Гарантии Албании
guaalb2 = После Лондонского мира на карте мира появилась независимая Албания. Многие страны Балкан, в том числе и Сербия претендуют на земли Албании. Мы можем гарантировать неприкосновенность Албании, чтобы не допустить получения Сербией выхода к морю.
guaalb3 = Албания - наш друг.
