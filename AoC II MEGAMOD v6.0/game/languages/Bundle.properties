poh = Литовский поход
poh2 = Звон русских мечей на юге гремел на всю Прибалтику. Решительный удар по литовскому войску смял его, и, продвинувшись в глубь княжества, Александр Ярославич надолго совершил свою первую победу. Это деяние, закрепив в истории князя как храброго воина, надолго обезопасило наши рубежи от литовцев.
