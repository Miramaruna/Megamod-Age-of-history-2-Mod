opisaniePytVouni = Судетский кризис плохо обернётся для Чехословакии и её союзников. Нашим потенциальным союзником может стать Венгрия, но прежде нам нужна Чехословакия. Нужно подготовиться к этой войне, ведь Великобритания и Франция не дадут нам спокойно забрать все, что мы хотим. Так же стоит иметь ввиду Польшу, которая имеет притязания на наши территории в Восточной Пруссии, а так же на Силезию.
vengriya = Кольцо врагов сжимается всё сильнее...
vengriyaVosi = Венгрия - Союзник Оси
opisanieSosi = Германия сейчас является не в лучшем положении и ей как никогда нужны союзники, которыми вполне можем стать мы. Так же у нас есть шанс ухватить свой кусочек Чехословакии и расширить влияние на Балканском полуострове.
