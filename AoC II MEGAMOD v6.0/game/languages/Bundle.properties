titlePUNkrf2 = Нам и этого будет достаточно.
PUNrim3 = Третья Пуническая Война
opisaniePUNrim3 = Карфаген нарушил наш договор и без нашего разрешения начал войну. Мы не можем простить подобную наглость никому, а в особенности Карфагену. Время раз и навсегда покончить со свободой Карфагена. 
titlePUNrim3 = "Карфаген должен быть разрушен!"
PUNrim4 = Карфаген Должен Быть Разрушен
opisaniePUNrim4 = Армия Рима вошла в город Карфаген, где и закончится его история. Мы стерём город с лица земли, сожжём все дома, разрушим памятники и посыпим землю солью. Карфаген должен потеряться в истории, быть забыт навсегда, от нашего главного соперника должно остаться лишь пепелище. Карфаген должен быть разрушен!
titlePUNrim4 = Стереть Карфаген с лица Земли!
KNkrf = Наглость Нумидии 
opisanieKNkrf = Нумидия прекрасно понимает, что сейчас мы находим не в том положении, чтобы открыто противостоять им и они успешно этим пользуются. Они шаг за шагом отнимают у нас нашу землю. Мы можем объявить им войну, но не имеем на это право. Рим может быть сильно не доволен нашими действиями.
titleKNkrf1 = Нам нужно ответить им, если мы не хотим остаться без хоть каких-то территорий.
titleKNkrf2 = Рим поможет нам... Может быть...
