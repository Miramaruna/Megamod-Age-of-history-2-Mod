chiun1 = Объединение Китая
chiun2 = Ни династия, ни революционеры и ни Юань Шикай не желали продолжать войну. Юань Шикай начал с нами переговоры, по которым предлагает объединить Китай при условии, что будет установлена конституционная монархия с безвластным богдыханом во главе. Мы отклоняли это предложение, взамен предлагая ему пост президента, что он отклонял. Надавив на него, нежелающего дальнейшей войны, он всё же согласился на наше предложение.
