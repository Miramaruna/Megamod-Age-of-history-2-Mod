pechal = Это не может не огорчить...
razdelYug = Вторжение в Югославию
opisanieRazdelaYug = Югославия является последним государством, которое ещё не подчинилось нам на Балканах. Однако, у нас уже готов план раздела территорий Югославии с нашими союзниками и пришло время начать исполнение этого плана.
