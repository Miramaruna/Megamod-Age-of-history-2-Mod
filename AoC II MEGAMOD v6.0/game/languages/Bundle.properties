YKF = Республика Корея
opisanieYKF = Юг Корейского полуострова кое как смог оправиться от японской оккупации и готов возродить свою государственноть. Правительство провозгласило независимой всю Корею, хотя они и имели власть только над югом. Северная часть полуострова должна объединиться с нами, видимо, но те не спешат этого делать.
titleYKF = Правительство - благо всей Кореи.
SKF = Корейская Народно-Демократическая Республика
opisanieSKF = Американское правительство на юге Кореи создало своё государство под названием Республика Корея. Трудовая Партия Кореи не может стоять в стороне после этого. Мы должны ответить капиталистическому югу зеркальными мерами.
titleSKF = Противостояние корейского народа?
KVkndr = Отечественная Освободительная Война
opisanieKVkndr = Товарищ Ким Ир Сен поставил одной из своих главных целей объединить Корею под своей властью. Множество инцидентов и провокаций на границе с Югом убеждают нас о неизбежности данной войны. Мы можем начать атаку прямо сейчас, или не начинать её никогда.
titleKVkndr1 = Приступить к военной компании.
titleKVkndr2 = Отложить это до лучших времён.
KVrk = Смута 25 Июня
opisanieKVrk = Ли Сын Ман открыто говорил о том, что желает видеть Корею единым государством. Под своим началом, конечно. Бесконечные провокации на границе показывают, что этот конфликт между Севером и Югом рано или поздно разгорится с новой силой. Нам, возможно, стоит нанести удар первее, чем наш противник.
titleKVrk1 = Лучшая защита - это нападение!
titleKVrk2 = Стоит поберечь себя.
KVam = Корейская Война
opisanieKVam = Война в Корее идёт очень успешно для Северной Кореи. Не в наших интересах, чтобы Север вдруг победил, так что правительство согласно как отправить нашу армию на войну, так и просто поддержать Юг денежными средствами и оборудыванием. Что скажете?
titleKVam1 = Для скорейшей победы требуется наше руководство.
titleKVam2 = Материальная помощь им сейчас нужнее.
titleKVam3 = Очередная авантюра? Нет уж.
KVkit = Война в Корее
opisanieKVkit = Северная Корея терпит крупное поражение в этой войне. Наш долг, как коммунистического государства, поддержать соратника по идеологическомй вектору. У нас есть несколько вариантов того, как мы можем обеспечить поддержку нашему союзнику. Или же мы можем не поддерживать Север, но тогда некоторые круги общества будут недовольны таким решением.
titleKVkit1 = Нам нужно вступить в войну.
titleKVkit2 = Материальная поддержка и ничего более!
titleKVkit3 = Никакой поддержки не будет.
KVmir = Мирный Договор
opisanieKVmirAM = Война в Корее затянулась и в неё было втянуто уже слишком много стран. Наши противники готовы заключить мирный договор, если к этому готовы мы.
titleKVmirAM1 = Мы готовы заключить мир.
titleKVmirAM2 = Мир? Ещё рано.
NUS = Мир с Агрессором
opisanieNUS = К сожалению, мы не успели придти нашему союзнику на помощь, враг уже успел оккупировать его территории и арестовать правительство нашего союзника...
titleNUS = Не свезло.
JANOT = Возвращение Империи
opisanieJANOT = Американское оккупационное правительство шатало устои японского общества, чтобы перестроить его в соответствии с западным образом жизни. Многим японцам не нравится это и народ готов поддержать народное восстание против захватчиков. Вопрос лишь в том, готовы ли мы поддержать их. 
titleJANOT1 = Возродись отечество!
titleJANOT2 = Япония выбрала новый путь. Она продолжит его поддерживать.
JANOTam = Япония Наносит Ответный Удар
opisanieJANOTam = Оккупационное правительсво в Японии потерпело поражение. В Японии поднялся мятеж, который снёс нашу военную администрацию в Японии. У нас есть некоторые силы, которые остались на военных базах, но их явно будет недостаточно, чтобы вновь подчинить Японию. Мы можем избрать путь примирения с мятежниками, но это ударит по нам на международной арене, а наше население может быть недовольно таким решением.
titleJANOTam1 = Нам нужно немедленно восстановить порядок!
titleJANOTam2 = Уладим всё без кровопролития.
JANE = Конец Оккупации
opisanieJANE = Американская военная администрация покидает Японию - период оккупации закончен. Соединённые Штаты оказали огромное влияние на японское общество, но одно оказалось неизменным - сохранена династия Японского императорского дома. Пока жив Император - жива Япония!
titleJANE = Япония будет жить!
GAO48 = Генеральная Ассамблея ООН
opisanieGAO48 = В этом году одной из обсуждающихся тем на Генеральной Ассамблеи ООН стала проблема обретения независимости Ливии. Проблема заключалась в том, что Франция и Великобритания хотели оставить Ливию либо как часть своих колониальных владений, либо как полностью подконтрольное полунезависимое государство. Противниками данной идеи выступили США и СССР, желающие видеть Ливию как независимое государство. Проект резолюции, разработанный США, должен дать возможность нам управлять своей частью Ливии в течении трёх лет, после которых Ливия должна будет стать независимой, однако, Великобритания и Франция выступают против данного решения. Нам нужно решить, какое будущее ждёт Ливию.
titleGAO48br1 = Британская часть Ливии должна быть подконтрольна метрополии и никак иначе.
titleGAO48br2 = Мы согласны с резолюцией и готовы работать над Ливийским проектом дальше.
titleGAO48fr1 = Французская часть Ливии должна быть подконтрольна Парижу.
titleGAO48fr2 = Мы согласимся подписать резолюцию и продолжить развитие в данном направлении.
BRL = Британская Ливия
opisanieBRL = На Генеральной Ассамблеи ООН мы высказали своё мнение и свои притязания на Ливию, в чём нас поддержала Франция. Вместе мы решили, что Ливия должна оставаться в подчинении у нас, так будет явно лучше, чем если бы СССР поимел влияние в этом регионе. Остаётся только вопрос о статусе этих территорий в составе Британской империи.
titleBRL1 = Провозгласить марионеточные правительства.
titleBRL2 = Оставить ливийские провинции в составе колоний.
GAO50 = Пятая Генеральная Ассамблея ООН
opisanieGAO50 = Осенняя ГА ООН ознаменовалась очередной резолюцией по Ливии, на этот раз от СССР. Эта резолюция предусматривает объединение Британских Киренаики и Триполитании, а также Французского Феццана в единое Ливийское государство и последующее освобождение Ливии от иностранных военных баз. Так как на прошлой ГА ООН мы согласились на последующее отделение ливийских провинций от наших колониальных владений, то будет очень странно принять такую непоследовательную позицию. Тем более мы сможем влиять на Ливию другими способами.
titleGAO50br = Резолюция будет принята.
titleGAO50fr = Резолюция будет принята.
NSL = Национальное Собрание Ливии
opisanieNSL = 2 декабря 1950 года, после множества решений ОНН, было собрано Национальное Собрание Ливии, которое должно было выбрать правителя будущего Ливийского государства, а также разработать проект конституции Ливии. Было принято решение о создании конституционной монархии с федеративным административным устройством. Будующим королём был выбран Мухаммад Идрис ас-Сануси из Киренаики.
titleNSL = Это не может не радовать!
FLlib = Образование Ливии
opisanieFLlib = Множество переговоров и споров в итоге решили Ливийский вопрос. Ливийское государство стало конституционной монархией со своим собственным королём Идрисом I. Ливия небогатая страна, так что ей предстоит пройти через многое на своём пути.
titleFLlib = Славься, король!
LKlib = Ливийские Противоречия
opisanieLKlib = Ливия является довольно специфическим государством. Она стала первым арабским государством, получившим независимость, но вместе с этим Ливия является беднейшей страной мира. Несмотря на то, что все три провинции Ливии были объединены в одно государство, у каждой из них есть свои устремления и цели. Страной правят выходцы из Киренаики, тогда как большая часть населения проживает в Триполитании. У Ливии слабое центральное управление, в каждой провинции есть своё правительство и каждое правительство мешает друг другу. Такая внутренняя неразбериха плохо сказывается на устойчивости государства и может привести к плачевным последствиям.
titleLKlib = Нужно решать эти проблемы.
ESud = Англо-Египетский Судан
opisanieESud = Совместное управление над Суданом со стороны Египта и Великобритании продолжается уже полвека. За это время Египет пережил множество потрясений, в том числе и мировые войны. В египетском обществе постепенно нарастали антибританские настроения, которые в итоге выливаются в конфликт с британцами. Парламент Египта стремится принять закон, который разрывает предыдущие договоры 1899 и 1936 годов с Великобританией. Ещё есть время помешать парламенту довести наши отношения до кипения, пока они не провозгласили Фарука I королём не только Египта, но и Судана.
titleESud1 = Судан принадлежит Египту!
titleESud2 = Ухудшение отношений? Нет, спасибо!
ESudbr = Денонсация Анго-Египетских Соглашений
opisanieESudbr = Парламент Египта денонсировал англо-египетские договоры 1899 и 1936 годов. Судан был провозглашён территорией Египта, король Фарук I был объявлен королём Египта и Судана. Египет потребовал вывода британских войск из Судана, а также из области Суэцкого канала. Антибританские настроения в Египте необычайно высоки, нам нужно ответить.
titleESudbr1 = Судан вам просто так не достанется!
titleESudbr2 = Нам не стоит препятствовать им.
ESud2 = Вывод Британских Войск
opisanieESud2 = Великобритания признала наш суверенитет над Суданом и вывела войска оттуда. Судан теперь по праву может считаться египетским. Победа великой египетской политики!
titleESud21 = По праву наше!
RSbr = Республика Судан
opisanieRSbr = Июльская революция поставила точку в египетском желании власдеть Суданом, тамошнее правительство решило дать суданскому народу право на самоопределение. В итоге парламент Судана принял решение об окончательном прекращении действия кондоминиума Египта и Великобритании, после чего египетские и британские войска были выведены из страны.
titleRSbr = Это лучше усиления Египта.
UReg = Июльская Революция
opisanieUReg = Военные из "Свободных офицеров" провели военный переворот в Египте, отстранив нынешнего короля Фарука I. Военные спроводили короля в эмиграцию; Египет начинает вставать на путь реформ, которые при бывшем короле были бы невозможны, хотя тот и заявлял, что военные свергли его ради реформ, которые тот сам намеревался провести. "Говорил ли он правду?" - на этот вопрос мы уже не узнаем ответ.
titleUReg = Долой Короля!
NUB = Независимость Уганды
opisanieNUB = Деколонизация идёт семимильными шагами! В очередной раз встал вопрос о предоставлении независимости Уганды. ООН и местное население ждёт от нас правильного решения!
titleNUB1 = Признать независимость Уганды.
titleNUB2 = Они ошибаются.
BMP = Британская Подмандатная Палестина
opisanieBMP =  Еврейско-арабский конфликт оказался сильнее, чем нам казалось ранее. Нас втянули туда, и мы увязли в нём ещё сильнее, чем раньше. С момента образования ООН мы не смогли решить данную проблему и нам следует подумать о том, что делать дальше. Некоторые наши представители в Палестине говорят, что лучше всего передать этот вопрос в ООН, где он и будет решён.
titleBMP1 = Прододолжить решать этот вопрос самостоятельно.
titleBMP2 = Отказаться от мандата.
EAB = Проблематика Палестины
opisanieEAB = Британские коменданты в Палестине предложили два варианта плана для решения палестинской проблемы. В первом варианте нам предложили создать в Палестине два независимых государства, а во втором - федеративное Палестинское государство. Мы можем утвердить любой из этих планов.
titleEAB1 = Поддержать создание двух независимых государств.
titleEAB2 = Поддержать независимое федеративное государство.
UNSCOP = Специальный Комитет ООН по Палестине
opisanieUNSCOP = Великобритания передала свой мандат в Палестине ООН, чтобы решить еврейско-арабский конфликт. ООН создала специальный комитет, в который входим и мы, и который должен разработать план дальнейшего решения этого вопроса. При выработке основного плана было предложено несколько вариантов того, как будет устроена Палестина. Мы должны выбрать самый приемлемый вариант.
titleUNSCOP1 = Создание двух независимых, но связанных экономически государств.
titleUNSCOP2 = Создание Федерации с еврейской и арабской составляющей.
titleUNSCOP3 = Создание единого государства с доминирующей ролью одного из этносов.
PF = Палестинский Вопрос
opisaniePF = ООН смогла найти решение конфликта в Палестине. Генеральная Ассамблей одобрила план, предложенный Специальным Комитетом ООН по Палестине, и с с сегодняшнего дня он будет исполняться.
titlePF1 = Народ Еврейского Государства наконец свободен(Играть за Израиль)!
titlePF2 = Народ Палестины обрёл независимость(Играть за Палестину)!
titlePF3 = Федерация народов Палестины должна решить все проблемы.
titlePF4 = Унитарное государство решит наши проблемы... Возможно...
PF1 = Война за Независимость
opisaniePF1 = Сразу же после провозглашения независимости Еврейского Государства, арабские страны решили напасть на молодую страну. Мы не должны пасть, даже смертью храбрых. От этой войны зависит будущее нашего народа.
titlePF11 = Постоим за Израиль!
PF2 = Освободительная Война
opisaniePF2 = Палестина была разделена неправильно! Такие выводы можно сделать из решения ООН, которое не является справедливым. Мы должны освободить Палестину от еврейских захватчиков, раз и навсегда!
titlePF21 = Отстоим Палестину!
titlePF22 = Арабы и так настрадались, хватит войн!
KPF12 = Конец Войне
opisanieKPF1 = Войска Израиля заняли все территории Палестины, ранее входившие в состав Подмандатной Палестины. Арабские государства, окружающие нас, грозятся применить силу, если мы не согласимся на переговоры и перемирие.
opisanieKPF2 = Войска Палестины наконец завоевали земли, оккупированные Израилем. После того, как стало ясно, что наши войска возьмут под контроль всю Палестину, страны Запада стали давить на наше правительство. И хоть нас поддерживали многие арабские государства, но с таким международным давлением мы справиться не можем. Нам придётся идти на уступки и оставить некоторые территории для Еврейского Государства.
titleKPF1 = Для нас будет лучше заключит мир, уступив Палестине некоторые территории.
titleKPF12 = Никаких уступок!
titleKPF2 = Ни рыба, ни мясо. Но оно того стоило!
AGI = Поддержка Палестины
opisanieAGI = Палестинское государство терпит поражение в войне. Еврейское Государство оккупировало территории, предназначенные ООН для Арабского государства. Бежавшее правительство Палестины просит арабские государства помочь в этой священной борьбе.Население очень взволнованно тем, что происходит в Палестине, люди будут расстроены, если мы не поддержим Арабское государство.
titleAGI1 = Да начнётся праведный бой!
titleAGI2 = Это не в наших интересах.
PF3 = Федерация Палестины
opisaniePF3 = Федеративное устройство Палестины благостно сказалось на населении, хотя и есть недовольные таким решением. Арабские государства также были против такого решения и настаивали на создании унитарного государства с преобладанием арабского этноса над другими. Они могут спонсировать радикальные исламистские ячейки, чтобы настроить арабское население против нашего правительства. Возможно, стоит задуматься над отношениями с соседями.
titlePF31 = Евреи и арабы будут жить вместе. Пока одни других не вытеснят...
PF4 = Палестинские Противоречия
opisaniePF4 = Решение ООН об объединении евреев и неевреев под одним флагом не возымела большой радости среди населения Палестины. Арабы не хотят жить с евреями в одном государстве и не хотят видеть их в Палестине в принципе. Евреи же не хотят видеть агрессивных арабов недалеко от своих поселений и городов с преобладающим еврейским населением. Эти противоречия вспыхивают всё ярче и ярче, с каждым днём недовольство растёт. Вооружённые группировки уже готовы к государственному перевороту, войны не избежать. Вопрос лишь в том, кого поддержим мы...
titlePF41 = Поддержим Арабов.
titlePF42 = Поддержим Евреев.
GAO47 = Генаральная Ассамблея ООН 
opisanieGAO47 = Специальный Комитет ООН по Палестине сформировал план по дальнейшим действиям в этом регионе. Генеральная Ассамблея одобрила этот план, скоро он будет исполнен, и конфликт в Палестине будет решён.
titleGAO47 = Конфликт исчерпан?
BKZN = Курдское Восстание
opisanieBKZN = Курды составляют существенную часть населения Турции, но сейчас они подвергаются систематическим репрессиям, и это мягко сказано. Курды всегда хотели слишком многого, а именно своего независимого государства, что мы позволить им не можем. Поэтому, когда на востоке Турции начинаются курдские волнения, мы посылаем туда побольше войск. Сейчас как раз один из таких случаев, курды снова подняли восстание. Нам нужно подавить его как можно скорее!
titleBKZN = Бей курдов!
BKZN2 = Турецкий Курдистан
opisanieBKZN2 = Удивительно, но курды сейчас контролируют большие территории на востоке и уже провозгласили своё собственное государство Курдистан. Обычные курдские бунты зашли слишком далеко.
titleBKZN21 = Бой ещё не окончен!
titleBKZN22 = Мы согласны на переговоры.
MNVK = Миграция Курдов
opisanieMNVK = Курдистан обрёл независимость, и со всех окраин Турции началась миграция в новое государство.
titleMNVK = Туда им и дорога!
KVI = Колониальные Проблемы в Индокитае
opisanieKVI = В середине декабря прошлого года случилось восстание вьетнамских коммунистов, которое переросло в настоящую колониальную войну. Пока что мы удерживаем наши позиции в Ханохое, но кажется, что вьетнамцы скоро найдут способ обойти нашу оборону. Некоторые члены колониального правительства и даже метрополии говорят, что эта война для Франции является ненужной и даже вредной. Мы, конечно, не уважаем подобных политиков, но иногда нам стоит прислушиваться к подобным мнениям, как считаете?
titleKVI1 = Франция не должна упускать из своих рук колонии!
titleKVI2 = Стоит прислушаться и закончить боевые действия.
titleKVI3 = Независимость, свобода, счастье(Играть за Вьетнамских Сепаратистов)!
PVD = Победа при Дьенбьенфу
opisaniePVD = Битва при Дьенбьенфу стала крупнейшим поражением Франции в Индокитайской войне. Часть войск уничтожено, часть сдано в плен, уничтожено большое количество техники. На следующий день делегация от Вьетнама прибыла на Конференцию в Женеву, чтобы обсудить условия мира.
titlePVD1 = Мы согласны на эти условия.
titlePVD2 = Продолжайте сражаться!
PCV = Партийные Чистки
opisaniePCV = После того, как мы одержали победу над Францией в партии встал вопрос о надёжности некоторых членов партии и правительства. В этот "ненадёжный" список попали и мы. Возможно, самое время переметнуться на другую сторону...
titlePCV1 = Кто куда, а я на Юг(играть за Южный Вьетнам).
titlePCV2 = Нам нечего бояться, мы достойные сыны своего Отечества(продолжить игру за Северный Вьетнам).
KOI = Сепаратизм в Индокитае не Утихает
opisanieKOI = После того, как мы отпустили Вьетнам в свободное плаванье, политические группировки остального Индокитая стали требовать предоставления им независимости и права на самоопределение. Лаос, по всей видимости, станет следующим государством, получившим независимость. Деколонизация началась и её будет очень трудно остановить, так что мы не будем особо и пытатся...
titleKOI1 = Дайте им вольность выбирать.
titleKOI2 = Дальше мы пойдём вместе с ними(Играть за Лаос).
KOI2 = Распад Индокитайского Союза
opisanieKOI2 = Правительство Франции и Индокитая не смогли сдержать процесс деколонизации в этом регионе. Деколонизация будет идти непрерывно и на других континентах и частях света, вопрос лишь в том, сколько территорий метрополии смогут сохранить.
titleKOI21 = Мы ещё можем послужить Франции.
titleKOI22 = Мы останемся в Камбодже как французские консультанты(Играть за Камбоджу).
PFA = Победа Французской Армии!
opisaniePFA = Французская армия разбила последний лагерь коммунистических сепаратистов Вьетнама. Мы завершили наводить порядок, но всё ещё остались некоторые подпольные группировки, которые намерены вести партизанскую войну. Во Франции данная новость воспринята положительно, идут народные гуляния.
titlePFA = Раздавим сепаратистов как жуков!
NFI = Независимость Индокитая
opisanieNFI = Индокитай стал колонией Франции в недалёком девятнадцатом веке. С тех пор Индокитай и Франция пережили множество потрясений и, кажется, настало время ещё одного. Многие люди в колониальном правительстве считают, что метрополия забирает из колоний слишком много ресурсов, не давая нам развиваться. Проскальзывают идеи объявить независимость колонии в соответствии с уставом ООН. В этом нас могут поддержать страны социалистического блока, такие как СССР и Китай. Что будем делать?
titleNFI1 = Пора избавиться от гнёта метрополии!
titleNFI2 = Метрополия не мешала вам расскатывать повстанцев на гусеницах, и вы хотите отречься от неё?
GAO51 = Генеральная Ассамблея ООН
opisanieGAO51 = В уходящем году в ООН неожиданно поступила нота от французского колониального правительства в Индокитае. В ноте говорится, что народы Индокитая больше не намерены терпеть владычество Франции в регионе и хотят воспользоваться правом народов на самоопределение. Также французскому правительству была отправлена нота, в которой говорится о объявлении независимости Индокитайского Союза от Франции. Народ Индокитая ждёт поддержки мирового сообщества, включая и нас.
titleGAO511 = Как мы можем не удовлетворить чаяния народа?
titleGAO512 = Нам не выгодно такое положение дел.
NFI2 = Резолюция ООН по Индокитаю
opisanieNFI2 = После того, как мы отправили ноту в ООН, Советским Союзом на голосовании была предоставлена резолюция по Индокитаю, которая в случае принятия должна была предоставить нам независимость, что и случилось. Большинство членов ООН одобрило данную резолюцию и она была принята. Франция была одной из немногих стран, которые проголосовали против данной резолюции.
titleNFI21 = Прекрасная новость!
opisanieNFI3 = После того, как мы отправили ноту в ООН, Советским Союзом на голосовании была предоставлена резолюция по Индокитаю, которая в случае принятия должна была дать нам независимость, но случилось так, что большинство проголосовало против данной резолюции.
titleNFI22 = Нам остаётся только отстоять своё право с оружием в руках!
titleNFI23 = Чтож, мы пытались...
VPI = Выборы в Парламент Индокитая
opisanieVPI = Мы получили независимость, но, исходя из положений резолюции ООН, мы должны провести свободные выборы в правительсво. Свои кандидатуры выдвинули коммунисты, а также республиканцы. Обе силы являются противниками, одни выступают за сближение с СССР, другие же выступают за сближение с Западом. Итак, кто же победил?
titleVPI1 = Победу одержали коммунисты.
titleVPI2 = Победу одержали республиканцы.
PPD = Битва при Дьенбьенфу
opisaniePPD = Битва при Дьенбьенфу стала крупнейшим поражением Франции в Индокитайской войне. Часть войск уничтожено, часть сдано в плен, уничтожено большое количество техники. На следующий день делегация от Вьетнама прибыла на Конференцию в Женеву, чтобы обсудить условия мира.
titlePPD1 = Мы согласны на это.
titlePPD2 = Они хотят мира? Война должна окончиться стремительной победой Французской армии!
RFA = Разгром Французской Армии
opisanieRFA = Силы коммунистов Вьетнама окончательно разгромили наши силы в Индокитае, теперь жители Индокитая в полной власти коммунистов. Мы признали поражение и вывели свои войска из колоний Индокитая.
titleRFA = Это поражение Франция забудет не скоро...
opisanieRFAvie = Силы Вьетнамской Народной Армии смогли показать французам, что Вьетнам умеет воевать! Мы одержали ряд значительных побед в Лаосе и Кампучии, что вынудило Францию пойти на серьёзные уступки и освободить народы Индокитая.
titleRFAvie = Это поражение Франция запомнит не скоро!
GVL = Гражданская Война в Лаосе
opisanieGVL = Лаос стал очередным полем сражения между гигантами современного мира. Коммунистические силы борятся с монархом и проамериканским правительством, что не может быть не выгодно нам. Сейчас в Лаосе военные действия приостановлены, но кто знает, когда они вновь примут активную фазу.
titleGVL1 = Стоит оказать военную поддержку этому движению(Продолжить игру за Вьетнам).
titleGVL2 = Направить военных советников в Лаос(Играть за Лаосских сепаратистов).
titleGVL3 = Сами как-нибудь справятся.
opisanieGVL2 = Лаос получил долгожданную независимость и вместе с тем приобрёл новые проблемы. Коммунистические сепаратисты ошиваются на востоке и юге страны, вынашивая планы свержения монархии в Лаосе. Их поддерживает Северный Вьетнам, который имеет достаточно качественную армию. Сейчас в Лаосе затишье, но кто знает, что может его нарушить...
titleGVL21 = Мне не нравятся коммунисты на территории Лаоса.
titleGVL22 = Мне не нравится монархический Лаос(Играть за Лаосских Сепаратистов)...
PGL = Быстрое Решение Проблем
opisaniePGL = Наши войска смогли разбить противника и выгнать его с наших законных земель. Отныне мы одни будем управлять Лаосом!
titlePGLlao = Слава Революции!
titlePGLmon = Слава Королю!
KPL = Коалиционное Правительство
opisanieKPL = В ходе долгих переговоров было принято решение о создании коалиционного правительства вместе с коммунистами и монархистами. После выборов коммунисты стали контролировать правительство и начали налаживать отношения с СССР, что не понравилось США. США прекратило поддержку Лаоса, что привело к падению левого правительства и смены его на правое. В скоре правое правительство свернуло программу примирения сторон, что сделало безуспешным прошлые действия.
titleKPL = Коалиционное правительство провалилось.
PGVL = Примирение в Лаосе
opisaniePGVL = Правительство Лаоса и лидеры Патет Лао смогли найти решение своим разногласиям и согласились создать коалиционное правительство. В Лаосе настал мир!
titlePGVL = Это заслуживает похвалы.
GVLP = Конец Затишья
opisanieGVLP = В недавнем времени нейтралисты Конг Ле попытались провести военный переворот, но безуспешно, из столицы их вытеснили королевские войска, после чего они отошли в Долину Кувшинов. Правительство Лаоса и лидеры Патет Лоа не смогли договориться об примирении, начался новый виток гражданской войны.
titleGVLP = Мирного решения не будет.
VPL = Военный Переворот
opisanieVPL = Коммунистическое движение в Индокитае было очень сильно. Сильно оно и сейчас. Патет Лао совершил государственный переворот в Лаосе, чтобы провозгласить социализм в Лаосе. Однако, чисток не последовало, и нас включили в состав правительства. Пора нам подстраиваться под ситуацию и новый режим...
titleVPL = Как неожиданно и неприятно!
GVC = Кражданская Война в Камбодже
opisanieGVC = Коммунисты в Камбодже уже долгие годы ведут партизанскую войну против правительства. Вьетнамские коммунисты оказывают существенную поддержку народному движению Камбоджи, они хотят свергнуть наш режим и уже занимают значительные территории внутри Камбоджи. Военное руководство разработал план "Ченла", который предполагает зачистку районов Камбоджи от коммунистических сил. В бой?
titleGVC1 = Если не сейчас, то когда?
titleGVC2 = Не хочу воевать за диктатуру(играть за Камбоджийских коммунистов)
GVCC = Конец Гражданской Войны
opisanieGVCC = Наши войска смогли разбить противника и выгнать его с наших законных земель. Отныне мы одни будем управлять Камбоджей!
titleGVCC = Ура!
EGNC = Эвакуация Городского Населения
opisanieEGNC = Коммунистическая Партия Кампучии нацелена построить в Кампучии стопроцентное коммунистическое общество. Первым этапом в осуществлении этой задачи стоит выселение всего городского населения в сельскую местность. Такой шаг может многим не понравиться, но их же никто не спрашивал, верно?
titleEGNC = Для коммунизма города не нужны.
ODC = Отмена Денег
opisanieODC = Коммунистическая Партия Кампучии считает, что деньги являются препятствием на пути к коммунизму. Собственно, денег больше нет. Да и они не нужны нам, ведь мы строим коммунистическое общество, а не какое-нибудь недоразумение.
titleODC = Партия плохого не сделает.
GAC = Государственный Атеизм
opisanieGAC = Хоть в Кампучии формально не запрещена вера в бога, но мы всё равно можем запрещадь религиозные культы. Партия решила, что любая религия является враждебной для Кампучии, в связи с чем мы начинаем планимерное истребление всех враждебных элементов. Кампучия должна быть очищена от обмана религиозных сект!
titleGAC = Буддисты? Мусульмане? Христиане? Все должны быть ликвидированы!
BCC = Борьба с Интеллигенцией
opisanieBCC = Согласно идее Первого Брата, стране необходим "один миллион преданных людей", чтобы построить коммунистическое общество. Следовательно, остальная ненужная часть населения подлежит перевоспитанию, а если же те не смогут перевоспитаться, то будут ликвидированы. Мы уже обнаружили таких среди старых чиновников, а также военных старого режима. Что же, перевоспитание им не помогло.
titleBCC = Бей предателей!
ENC = Экономика Не Нужна
opisanieENC = Так как мы начали выселение людей из городов, то пора задуматься о том, что делать с оставшимся производством, ведь теперь рабочие не будут работать на заводах. Видимо, придётся разрушить заводы, чтобы у всех была большая мотивация работать на рисовых полях.
titleENC = Все на рисовые поля!
VVC = Вторжение Вьетнама в Камбоджу
opisanieVVCvie = Кампучийские отряды часто пересекают нашу границу и устраивают бесчинства на нашей территории. В последний раз они вырезали целую деревню с вьетнамским населением, в которой проживало 3 тысячи человек. Это не прекращается даже после наших угроз военного вмешательства. Красные кхмеры являются угрозой для нас, потому мы должны установить там провьетнамских режим, свергнув старое правительство.
opisanieVVCcum = 
titleVVC = Повод для войны всегда найдётся.
KVCV = Конец Войны в Камбодже
opisanieKVCV = Пномпень пал и вместе с ним пал и режим Красных кхмеров. Мы установили в Камбодже марионеточный режим, который будет управляться из Ханоя. Во время боевых действий мы обнаружили большое количество захоронений и останков людей. По всей видимости они погибли от рук правительственной армии и имел место быть геноцид. Мы проведём расследование этого преступления.
titleKVCV = Ужасные вещи происходили здесь.
RSCm = Перевоспитание Мусульман
opisanieRSCm = Ислам является враждебной религией для Красных кхмеров, так что все приверженцы Ислама должны быть устранены. В провинции Кампонгтям компактно проживает большое количество мусульман, что облегчает нам работу. Революционная армия Кампучии превратит их мечети в склады и свинарники!
titleRSCm = Долой опиум для народа!
RSCh = Перевоспитание Христиан
opisanieRSCh = Христианство было завезено в Кампучию европейцами, чтобы поработить народ Кампучии, потому нам придётся очистить территорию Кампучии от христиан. Революционная армия Кампучии уже занимается этим.
titleRSCh = Долой опиум для народа!
RSCb = Перевоспитание Буддистов
opisanieRSCb = Революционная армия Кампучии обнаружила очередной буддистский храм. Буддизм является враждебной религией для Красных кхмеров, так что все религиозные фанатики были подвергнуты уничтожению, а храм был переоборудован в склад.
titleRSCb = Долой опиум для народа!
RMC = Реставрация Камбоджи
opisanieRMC = Трудная хозяйственная и экономическая ситуация в стране привела к компромису между принцем Сиануком и НРК. В стране объявлена реставрация дополпотовского режима парламентарной монархии. Разумеется наши люди останутся в правительстве, куда же без этого, верно?
titleRMC = Места в правительстве нельзя отдать не тем людям.
JSV = Выполнение Женевских Соглашений
opisanieJSV = Правительства Севера и Юга смогли найти компромис в государственном устройстве Вьетнамского Государство. В скором времени Вьетнам объединится в единую страну, кризис будет решён!
titleJSV = Нас не постигла судьба Кореи и Германии? Прекрасно!
PVV = Присоединение Вьетнама Вьетнамом
opisaniePVV = Наша армия заняла все территории нашего противника, уже бывшего. Все его территории отныне являются частью Вьетнамского Государства.
titlePVV = Наконец-то!
GPV = Государственный Переворот
opisanieGVP = Уже продолжительное время нашей страной управляет хлипкий монарх, который не способен к решительным действиям. При поддержке армии и западных спецслужб премьер-министр Нго Динь Зьем совершил государственный переворот. Сразу после переворота он заявил, что Южный Вьетнам не будет исполнять решения Женевской конференции, тем самым нарушил основные положения этих соглашений. Конфликт во Вьетнаме спешит перерасти в вооруженный.
titleGVP = Нам нужна твёрдая рука у руля.
NYV = Нарушение Женевских Соглашений 
opisanieNYV = Новоиспечённый диктатор Южного Вьетнама стал делать очень резкие заявления. Он говорит, что Вьетнам должен стать антикоммунистическим государством, и что решения Женевской конференции Республика Вьетнам выполнять не будет. 
titleNYVso = Как это не будет?
titleNYVam = Кажется, это нам выгодно.
NVV = Решительные Действия
opisanieNVV = Правителство Южного Вьетнама нарушило условия Женевских соглашений, тем самым развязав нам руки. Мы будем готовить подпольные организации и военных советников для проведения различных операций на Юге. Так как мы поддержали коммунистов в Лаосе, те разрешили пользоваться своей территорией для переброски диверсантов на территорию Юга.
titleNVV1 = Это единственный способ объединить наши страны.
titleNVV2 = Нам нужно искать мирные способы разрешения данного вопроса.
opisanieNVV2 = Правителство Южного Вьетнама нарушило условия Женевских соглашений, тем самым развязав нам руки. Мы будем готовить подпольные организации и военных советников для проведения различных операций на Юге. Переброс диверсантов через демилитаризованную зону будет весьма сложным процессом, есть риск обнаружения наших действий, что может спровоцировать большай скандал или даже войну.
titleNVV21 = Это единственный способ объединить наши страны.
titleNVV22 = Нам нужно искать мирные способы разрешения данного вопроса.
DVV = Подпольные Организации
opisanieDVV = Подпольные организации в нашем государстве набирают силу. Они создают нам оппозицию, агитируя за свои идеи в городах и сёлах. Путём террора они избавляются от некоторых чиновников, что вредит нашему государству. За 1960-й год они уничтожили около 1400 чиновников разной важности, что сказалось на нашей популярности в народе.
titleDVV = Они выглядят опасно.
OGAV = Ограниченный Контингент Войск США во Вьетнаме
opisanieOGAV = Активность НФОЮВ, также известного как "Вьетконг", и неспособность правительства Южного Вьетнама подавить подпольные движения вынуждают нас принять решительные меры, чтобы противостоять коммунизму в этом регионе.
titleOGAV1 = Отправить малый контингент для наведения порядка.
titleOGAV2 = Они сами справятся.
SPAp = Сражение при Апбаке
opisanieSPAp = Первое открытое боестолкновение армии Южного Вьетнама и Вьетконга обернулось для нас неприятным поражением. Наш десант был разгромлен, мы понесли существенные потери в людях и технике. Десант США также понёс некоторые потери. Видимо, наши командиры ещё не готовы к серьёзным операциям.
titleSPAp = Неприятно.
RPH = Религиозные Протесты в Хюэ
opisanieRPH = 8 мая в городе Хюэ произошла демонстрация буддистов. Они требуют свободы вероисповедания и выступают против притеснения буддистов со стороны Римской Католической Церкви. Так сложилось, что почти всё окружение Нго Динь Зьема состоит из христиан-католиков. Буддизм в нашем государстве притесняется достаточно долго, но только сейчас это выливается в крупные протесты. Такой подъём протестных настроение выгоден Вьетконгу, который будет использовать эти настроения в качестве ещё одной причины вступать в оппозицию к власти. Нам нужно предпринять какие-то действия.
titleRPH1 = Задействовать армию для разгона демонстрации.
titleRPH2 = Пойти на мировую с протестующими.
BKV = Буддистский Кризис
opisanieBKV = С момента подавления протестов в Хюэ мы начали проводить репрессии в гругах буддистов, главным образом под раздачу попали монахи, а также лидеры религиозных организаций. Всё это плохо сказалось на нашей поддержки в буддистских кругах. 11 июня в Сайгоне монах из всё того же Хюэ Тхить Куанг Дык совершил акт публичного самосожжения, дабы выразить свой протест притеснениям буддистов. Об этом случае вскоре узнали иностранные СМИ, которые начали тиражировать эту носвость, прилагая фото самосожжения монаха. Во многих странах это вызвало шквал антивоенных настроений, в том числе и в США.
titleBKVvie = Очередное ненастье!
opisanieBKVam = С момента подавления протестов в Хюэ в Южном Вьетнаме начали проводить репрессии в кругах буддистов, главным образом под раздачу попали монахи, а также лидеры религиозных организаций. 11 июня в Сайгоне монах из всё того же Хюэ Тхить Куанг Дык совершил акт публичного самосожжения, дабы выразить свой протест притеснениям буддистов. Об этом случае вскоре узнали наши СМИ, которые начали тиражировать эту носвость, прилагая фото самосожжения монаха. Во многих странах это вызвало шквал антивоенных настроений, в том числе и в нашей.
titleBKVam = Ужас!
opisanieBKVvie2 = С момента подавления протестов в Хюэ в Южном Вьетнаме начали проводить репрессии в кругах буддистов, главным образом под раздачу попали монахи, а также лидеры религиозных организаций. 11 июня в Сайгоне монах из всё того же Хюэ Тхить Куанг Дык совершил акт публичного самосожжения, дабы выразить свой протест притеснениям буддистов. Об этом случае вскоре узнали Западные СМИ, которые начали тиражировать эту носвость, прилагая фото самосожжения монаха. Во многих странах Запада это вызвало шквал антивоенных выступлений и зародило протестное антивоенное движение.
titleBKVvie2 = Ужасы западного капитализма!
VPV = Военный Переворот
opisanieVPV = Нго Динь Зьем не справляется с урегулированием конфликта внутри страны, его место должны занять новые люди, которые решат все проблемы с подпольем. С поддержкой американских спецслужб мы смогли сместить Нго Динь Зьема, после чего от был убит.
titleVPV = Новая власть - залог новых свершений.
TIA = Тонкинский Инцидент
opisanieTIAam = 2 августа в Тонкийском заливе произашло столкновение американского эсминца "Мэддкос" и нескольких северовьетнамских торпедных катеров. Спустя два дня в том же Тонкийском заливе произошло ещё одно столкновение наших судов с судами Северного Вьетнама. Хоть и по-второму нападению информация противоречива, но Конгресс США всё же подготовил резолюцию, которая уполномочивает Президента Линдона Джонсона принять меры для предотвращения дальнейших нападений на американские судна. Мы можем напрямую вмешаться в конфликт в Южном Вьетнаме использовав свою армию.
titleTIAam1 = Начать пересылку войск во Вьетнам.
titleTIAam2 = Отказаться от вмешательства.
opisanieTIAvie = 2 августа в Тонкийском заливе произашло столкновение американского эсминца "Мэддкос" и нескольких северовьетнамских торпедных катеров. В ходе столкновения американскому эсминцу на помощь прибыло звено американских палубных истребителей, после чего вьетнамские катера с повреждениями отступили. Эти события заставили США вмешаться в события в Южнов Вьетнаме, направив регулярную армию в Юго-Восточную Азию.
titleTIAvie = Это может затруднить свержение диктатуры на юге Вьетнама.
titleTIAvie2 = Помощь союзника становится более внушительной!
AVV = Раскаты Грома в Небе Вьетнама
opisanieAVV = С марта этого года мы ведём бомбардировки гражданских объектов Северного Вьетнама, чтобы остановить их агрессию. Пока наши действия не привнесли внушительных результатов, потому нам требёется увеличить финансирование войны, чтобы наиболее эффективно уничтожать объекты врага.
titleAVV1 = Продолжить выполнение операции.
titleAVV2 = Прекратить выполнение операции.
AVV2 = Гром Без Грозы
opisanieAVV2 = Мы хотели "вбомбить их в каменный век", но особой пользы операция "Раскаты Грома" нам не принесла. Мы смогли испытать новые типы вооружения и авиатехники, нанести некоротый ущерб для Северного Вьетнама, но это не смогло повлиять на боевые действия.
titleAVV21 = Ясно.
BUD = Битва в Долине Йа-Дранг
opisanieBUD = Разведка обнаружила большую группирвку сил противника в долине реки Дранг. Был составлен план военной операции, после чего в зону высадки последовали два батальона морской пехоты США. Пока что это первое настолько крупное столкновение с противником.
titleBUD = В бой!
OGam = Операция "Гастингс"
opisanieOGam = Дивизия северовьетнамских военных пересекла демилитаризированную зону. Противник передвигается разрозненными группами, которые мы должны найти и уничножить, пока они не разбрелись по округе.
titleOGam = В бой!
PCG = Проникновения Через Границу
opisaniePCG = В последнее время участились попытки северовьетнамских военных пересечь демилитаризованную зону. Мы требовали, чтобы они не делали этого, но в ответ получали лишь молчание. Военное командование думает, что пора прекратить эту переброску войск. Мы подготовили план полномасштабного вторжение в Северный Вьетнам, чтобы раз и навсегда закончить эту войну. Что скажите?
titlePCG1 = Начинайте операцию!
titlePCG2 = Нет, отложите операцию.
SZG = Сражение за Высоту 937
opisanieSZG = Разведка обнаружила крупный лагерь и укреплённые позиции северовьетнамских солдат в долине Ашау на высоте 937. Исходя из нашей военной доктрины во Вьетнаме, мы должны как можно быстрее уничтожить эту группировку и занять высоту.
titleSZG = Приказано уничтожить!
SZG2 = Сражение за "Гамбургер"
opisanieSZG2 = После того, как мы заняли высоту 937, командование войсками увело оттуда солдат, так как эта высота не представляет стратегической ценности. Бойцы прозвали эту высоту "Гамбургер" за то, что что она «пережёвывала» людей, как мясо для гамбургеров, ведь бой за неё длился 10 дней, а все попытки взять её, кроме последней, оказались безуспешными. Вскоре об этом стало известно общественности, которая негативно восприняло такую новость. Для широкой публики и антивоенных кругов эта операция стала символом бессмысленности этой войны. Многие даже в Конгрессе считают, что война во Вьетнаме бессмысленна и является "пустой тратой американских жизней".
titleSZG2 = Неприятно.
SZD = Сражение при Дакто
opisanieSZD = Крупная группировка противника обнаружена недалеко от городка Дакто. Противник также занял одну из здешних высот, штурм которой потребует больших усилий, так что для этого с юга были подтянуты дополнительные силы.
titleSZD = Вперёд!
TET = Тетское Наступление
opisanieTET2 = Тетское наступление завершилось. Казалось бы, мы одержали явную военную победу над врагом, но общественность США думает иначе. После северовьетнамского наступления в СМИ развернулась критика вооруженных сил и правителства страны. Антивоенные настроения подялись как никогда иначе, и протестующие требуют немедленно вывести войска из Вьетнама.
titleTET2 = Неприятно.
opisanieTETam = В канун Тета, вьетнамского Нового Года, бойцы Вьетконга и северовьетнамской армии решили провести масштабную операцию, тем самым нарушив перемирие. Они совершили атаки в ряде крупных городов, в том числе и в Сайгоне, столице Южного Вьетнама. В ходе уличных боёв наши силы совместно с южновьетнамскими смогли отбить почти все атаки противника, кроме тех, которые случились в городе Хюэ, город был полностью захвачен врагом.
titleTETam = Снова в бой?
TET69 = Второй Тет
opisanieTET69 = Второе Тетское наступление не стало неожиданностью для нас, наши войска смогли предотвратить захват крупных городов северовьетнамской армией. Однако, за время боевых действий погибло много американских солдат, что снова подлило масло в огонь. Антивоенные настроения в США увеличились.
titleTET69 = Чтож, видимо, второго срока Джонсону не видать.
DZV = Захват Дананга
opisanieDZV = Американские войска были вынуждены отступить из Дананга, где находилась наша главная база, а также морской порт. После сдачи вьетконговцы смогли подчинить обширные территории вокруг города. Нам придётся отбить эти территории, или наша операция станет провальной.
titleDZV = С каждым днём всё хуже...
ODV = Освобождение Дананга
opisanieODV = После непродолжительных боёв Дананг был взят, а военная база освобождена, мы возвращаемся у уже привычные казармы.
titleODV = Хорошо.
RSV = Данные Разведки
