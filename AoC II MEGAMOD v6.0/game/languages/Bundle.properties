qincoup2 = Президент Ли Юаньхун был лишь формально лидером. Вся полнота власти принадлежала генералу и премьер-министру Дуань Цижую. Ли Юаньхун вошёл в заговор с генералом Чжан Сюнем, но генерал преследовал свои цели. Он ввёл войска и объявил о восстановлении Империи Цин! Вряд ли этот фанатик сможет долго продержаться у власти.
