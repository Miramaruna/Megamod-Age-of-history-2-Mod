tFRbmir2 = Плохие новости.
RUpetr = Император Пётр III
oRUpetr = На Рождество 1961 года года, в три часа пополудни скончалась императрица Елизавета Петровна. Пётр вступил на престол Российской империи. Император родом не из России, но имеет корни Романовых. При дворе говорят, что в его качествах есть жажда деятельности, неутомимость, доброта и доверчивость, но он является большим фанатом короля Пруссии Фридриха II, что может затуманить его разум.
tRUpetr = Правь на славу, Пётр!
RUvpru = Пруссия и Курляндия
oRUvpru = Вступление России в войну против Пруссии не было напрасным, ведь мы получили Восточную Пруссию в качестве награды. Теперь мы можем обменять её на Курляндию у Польши. До войны Польша находилась под угрозой северогерманских государств, теперь же Польша может быть в безопасности и под нашим "присмотром", а обмен территориями точно сблизит нас ещё больше.
tRUvpru1 = Верное предложение.
tRUvpru2 = Пруссия нужна в составе России.
POLvpru = Восточная Пруссия
oPOLvpru = После недавней войны в Европе Восточная Пруссия стала владением России. Теперь петербургский дом предлагает нам обменять эту провинцию на Курляндию и ещё несколько территорий. Звучит многообещающе, но стоит ли оно того?
tPOLvpru1 = Это прекрасное предложение!
tPOLvpru2 = Оно того не стоит.
