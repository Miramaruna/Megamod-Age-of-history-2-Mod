papavzivaet1 = Священная война против мусульман
papavzivaet2 = После занятия Мусульманами-сельджуками Святой земли, которая ранее контролировалась Византией, Папа Григорий IV призвал воинов Христовых на помощь Византии, несмотря на то что они еретики. Уже сейчас мы ожидаем бессчисленные сбережения от королей Европы, дабы освободить Иерусалим от неверных язычников!
