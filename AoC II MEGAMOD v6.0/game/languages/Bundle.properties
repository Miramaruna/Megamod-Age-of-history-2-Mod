chiun4 = Юань Шикай очередной монархист!
chiun5 = Объединение Китая, согласие
chiun6 = Юань Шикай, желавший установления конституционной монархии и не желавший дальнейшей войны с революцией, согласился на предложение Юга о назначении его на пост президента. Юань Шикай начал процесс устранения от власти Цин. Направив ультиматум слабой императрице Лунъюй, вынудив согласиться с неизбежным отречением от власти династии, он получил право вести переговоры с Югом об условиях отречения. Позже по указанию генерала императрица объявила о передаче власти народу и одобрении республиканского правительства. Шестилетний, неспособный повлиять на ситуацию, Пу И был отстранен от власти.
chiun7 = Стоило его казнить...
beijingf1 = Взятие Пекина
