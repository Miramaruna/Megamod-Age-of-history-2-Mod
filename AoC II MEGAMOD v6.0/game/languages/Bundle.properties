titleLVkrf = Как мы могли это допустить?
KMkrf = Конец Мятежу Наёмников
opisanieKMkrf = Войска Карфагена разбили последние силы мятежников. Это восстание оказалось довольно тяжелым для нас, но мы смогли удержать свою власть.
