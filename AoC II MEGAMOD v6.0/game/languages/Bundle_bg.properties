NuclearAttacker1 = Операция за хвърляне на ядрена бойна глава върху %cName, поставена на територия %cDefender, успешно завършено! %cDefender нанесе огромни щети.
NuclearAttacker2 = Сър, в съответствие с вашата заповед изпратихме ядрени бомбардировачи на територията на вражеска държава %cDefender. Бойни глави са хвърлени в града %cName. Съдейки по разузнаването, щетите, които сме нанесли, са големи, това ще забави действията на врага. Световната общност осъди действията ни.
NuclearDefender1 = Сър, нашият град %cName подложени на вражеска ядрена бомбардировка %cAttacker. Щетите са трудни за оценка, много цивилни са убити или тежко ранени. Полагаме всички възможни усилия да евакуираме оцелелите в безопасни райони на нашата страна. Цялата световна общност изрази подкрепа за нас във връзка с подобни жестоки действия срещу нас.
NuclearDefender2 = Съвсем наскоро в нашия град %cName, е бил атакуван с ядрени бойни глави. правителството казва, че е хвърлило ядрена бойна глава %cAttacker. Световната общност е възмутена от действията %cAttacker
