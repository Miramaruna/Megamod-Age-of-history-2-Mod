NuclearAttacker1 = Аперацыя па кіданні ядзернай боегалоўкі на %cName, размешчаны на тэрыторыі %cDefender, паспяхова завершана! %cDefender атрымаў велізарную шкоду.
NuclearAttacker2 = Сэр, згодна з вашым загадам мы адправілі ядзерныя бамбавікі на тэрыторыю варожай дзяржавы %cDefender. Боегалоўкі былі закінуты ў горад %cName. Мяркуючы па разведданых, урон у нас вялікі, ён замарудзіць дзеянні праціўніка. Сусветная супольнасць асудзіла нашы дзеянні.
NuclearDefender1 = Сэр, наш горад %cName падвергся варожай ядзернай бамбардзіроўцы %cAttacker. Шкоду цяжка ацаніць, многія мірныя жыхары загінулі або атрымалі сур'ёзныя раненні. Мы прыкладаем усе магчымыя намаганні для эвакуацыі тых, хто выжыў, у бяспечныя раёны нашай краіны. Уся сусветная супольнасць выказала нам падтрымку ў сувязі з такімі жорсткімі дзеяннямі супраць нас.
NuclearDefender2 = Зусім нядаўна наш горад %cName быў атакаваны ядзернымі боегалоўкамі. урад кажа, што скінуў ядзерную боегалоўку %cAttacker. Сусветная супольнасць абураная дзеяннямі %cAttacker
