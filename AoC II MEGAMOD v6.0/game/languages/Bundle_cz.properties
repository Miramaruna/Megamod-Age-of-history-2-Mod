NuclearAttacker1 = Operace vrhání jaderné hlavice na %cName umístěná na území %cDefender, úspěšně dokončena! %cDefender utrpěl masivní poškození.
NuclearAttacker2 = Pane, v souladu s vaším rozkazem jsme poslali jaderné bombardéry na území nepřátelského státu %cDefender. Bojové hlavice byly vrženy do města %cName. Soudě podle inteligence je škoda, kterou jsme způsobili, velká, zpomalí akce nepřítele. Světové společenství naše činy odsoudilo.
NuclearDefender1 = Pane, naše město %cName bylo vystaveno nepřátelskému jadernému bombardování %cAttacker. Škody je obtížné odhadnout, mnoho civilistů bylo zabito nebo vážně zraněno. Vynakládáme veškeré možné úsilí k evakuaci přeživších do bezpečných oblastí naší země. Celé světové společenství nám vyjádřilo podporu v souvislosti s tak krutými akcemi proti nám.
NuclearDefender2 = Nedávno bylo v našem městě %cName napadeno jadernými hlavicemi. vláda říká, že shodila jadernou hlavici %cAttacker. Globální komunita je pobouřena akcemi %cAttacker
